name: Build DebugLogger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debuglogger:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Write source
        run: |
          set -euo pipefail
          cat > debuglogger.m <<'OBJC_EOF'
          #import <Foundation/Foundation.h>
          #import <mach-o/dyld.h>
          #import <dlfcn.h>
          #import <objc/runtime.h>

          static NSString *SafePath(const char *path) {
              return path ? [NSString stringWithUTF8String:path] : @"(null)";
          }

          #define DLOG(fmt, ...) NSLog(@"[FridaDebug] " fmt, ##__VA_ARGS__)

          static void redirectLogs(void) {
              NSArray *paths = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES);
              NSString *docs = paths.count > 0 ? paths[0] : nil;
              if (!docs) docs = [NSHomeDirectory() stringByAppendingPathComponent:@"Documents"];
              NSString *logPath = [docs stringByAppendingPathComponent:@"frida_debug.log"];
              NSFileManager *fm = [NSFileManager defaultManager];
              if (![fm fileExistsAtPath:logPath]) {
                  [fm createFileAtPath:logPath contents:nil attributes:nil];
              }
              freopen([logPath fileSystemRepresentation], "a+", stderr);
              DLOG(@"log redirected to %@", logPath);
          }

          __attribute__((constructor(101)))
          __attribute__((used))
          static void onLoad(void) {
              @autoreleasepool {
                  redirectLogs();
                  DLOG(@"========================================");
                  DLOG(@"DebugLogger loaded pid=%d", getpid());
                  DLOG(@"Bundle: %@", [[NSBundle mainBundle] bundlePath]);
                  DLOG(@"Executable: %@", [[NSBundle mainBundle] executablePath]);
                  DLOG(@"Container: %@", NSHomeDirectory());
                  DLOG(@"Bundle ID: %@", [[NSBundle mainBundle] bundleIdentifier]);

                  NSUserDefaults *defs = [NSUserDefaults standardUserDefaults];
                  BOOL isLC = [defs boolForKey:@"isLiveProcess"] ||
                              [defs stringForKey:@"lcGuestAppId"] != nil ||
                              [defs stringForKey:@"lcAppGroupPath"] != nil;
                  DLOG(@"LiveContainer: %@", isLC ? @"YES" : @"NO");
                  if (isLC) {
                      DLOG(@"  lcGuestAppId: %@", [defs stringForKey:@"lcGuestAppId"]);
                      DLOG(@"  lcAppGroupPath: %@", [defs stringForKey:@"lcAppGroupPath"]);
                  }

                  DLOG(@"--- loaded modules ---");
                  uint32_t count = _dyld_image_count();
                  for (uint32_t i = 0; i < count; i++) {
                      const char *name = _dyld_get_image_name(i);
                      if (!name) continue;
                      NSString *n = [NSString stringWithUTF8String:name];
                      if ([n containsString:@"W.dylib"] || [n containsString:@"Frida"] ||
                          [n containsString:@"TweakLoader"] || [n containsString:@"gadget"]) {
                          DLOG(@"  [%u] %@", i, n);
                      }
                  }

                  Dl_info info;
                  if (dladdr((void *)&onLoad, &info) && info.dli_fname) {
                      NSString *myPath = SafePath(info.dli_fname);
                      DLOG(@"Loaded from: %@", myPath);
                      NSString *dir = [myPath stringByDeletingLastPathComponent];
                      for (NSString *file in @[@"W.dylib", @"W.config", @"agent.js"]) {
                          NSString *full = [dir stringByAppendingPathComponent:file];
                          BOOL exists = [[NSFileManager defaultManager] fileExistsAtPath:full];
                          DLOG(@"  %@ next to dylib: %@", file, exists ? @"YES" : @"NO");
                      }
                  }

                  NSString *docs = [NSHomeDirectory() stringByAppendingPathComponent:@"Documents"];
                  DLOG(@"Documents: %@ writable: %@", docs,
                       [[NSFileManager defaultManager] isWritableFileAtPath:docs] ? @"YES" : @"NO");
                  DLOG(@"========================================");
              }
          }
          OBJC_EOF

      - name: Compile
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -dynamiclib \
            -o DebugLogger.dylib \
            debuglogger.m \
            -framework Foundation \
            -arch arm64 \
            -miphoneos-version-min=12.0 \
            -isysroot "$SDK" \
            -fobjc-arc \
            -O2 \
            -Wall -Wextra \
            -Wl,-no_dead_strip_inits_and_terms \
            -Wl,-all_load \
            -install_name "@executable_path/Frameworks/DebugLogger.dylib"
          ls -l DebugLogger.dylib

      - name: Verify
        run: |
          set -euo pipefail
          file DebugLogger.dylib | grep -q arm64
          otool -l DebugLogger.dylib | grep -A3 -i 'init_array' || echo "WARNING: no init_array"
          nm -gU DebugLogger.dylib | grep -i onLoad || echo "WARNING: onLoad not exported"

      - name: Sign
        run: |
          set -euo pipefail
          brew install ldid || true
          if command -v ldid >/dev/null; then
            cp DebugLogger.dylib DebugLogger.signed.dylib
            ldid -S DebugLogger.signed.dylib
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: debuglogger
          path: |
            DebugLogger.dylib
            DebugLogger.signed.dylib
          retention-days: 30
          if-no-files-found: error