name: Build Locator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locator:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Write source
        run: |
          set -euo pipefail
          cat > locator.m <<'OBJC_EOF'
          #import <Foundation/Foundation.h>
          #import <mach-o/dyld.h>
          #import <dlfcn.h>
          #import <objc/runtime.h>
          #import <unistd.h>
          #import <fcntl.h>

          static void redirectLogs(void) {
              NSArray *paths = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES);
              NSString *docs = paths.count > 0 ? paths[0] : nil;
              if (!docs) {
                  docs = [NSHomeDirectory() stringByAppendingPathComponent:@"Documents"];
              }
              NSString *logPath = [docs stringByAppendingPathComponent:@"locator.log"];
              int fd = open([logPath fileSystemRepresentation], O_CREAT | O_WRONLY | O_APPEND, 0666);
              if (fd >= 0) {
                  dup2(fd, STDERR_FILENO);
                  dup2(fd, STDOUT_FILENO);
                  close(fd);
                  setvbuf(stderr, NULL, _IONBF, 0);
                  setvbuf(stdout, NULL, _IONBF, 0);
              }
              NSLog(@"[Locator] log: %@", logPath);
          }

          static void checkFile(NSString *dir, NSString *name) {
              NSString *full = [dir stringByAppendingPathComponent:name];
              BOOL exists = [[NSFileManager defaultManager] fileExistsAtPath:full];
              NSLog(@"[Locator]   %@/%@ -> %@", dir, name, exists ? @"FOUND" : @"missing");
          }

          static void scanDir(NSString *dir) {
              NSFileManager *fm = [NSFileManager defaultManager];
              BOOL isDir = NO;
              if (![fm fileExistsAtPath:dir isDirectory:&isDir] || !isDir) {
                  NSLog(@"[Locator] %@ -> not a directory", dir);
                  return;
              }
              NSArray *items = [fm contentsOfDirectoryAtPath:dir error:nil];
              NSLog(@"[Locator] %@ contents (%lu): %@", dir, (unsigned long)items.count, items);
          }

          static void runLocator(void) {
              @autoreleasepool {
                  NSLog(@"[Locator] ========================================");
                  NSLog(@"[Locator] Locator loaded pid=%d", getpid());
                  NSLog(@"[Locator] Bundle: %@", [[NSBundle mainBundle] bundlePath]);
                  NSLog(@"[Locator] Executable: %@", [[NSBundle mainBundle] executablePath]);
                  NSLog(@"[Locator] Container: %@", NSHomeDirectory());
                  NSLog(@"[Locator] Bundle ID: %@", [[NSBundle mainBundle] bundleIdentifier]);

                  NSString *bundlePath = [[NSBundle mainBundle] bundlePath];
                  NSString *appDir = [bundlePath stringByDeletingLastPathComponent];
                  NSString *container = NSHomeDirectory();
                  NSString *docs = [container stringByAppendingPathComponent:@"Documents"];
                  NSString *tweaks = [docs stringByAppendingPathComponent:@"Tweaks"];
                  NSString *appsDir = [docs stringByAppendingPathComponent:@"Applications"];

                  NSLog(@"[Locator] --- checking W files ---");
                  checkFile(bundlePath, @"W.dylib");
                  checkFile(bundlePath, @"W.config");
                  checkFile(bundlePath, @"agent.js");
                  checkFile([bundlePath stringByAppendingPathComponent:@"Frameworks"], @"W.dylib");
                  checkFile([bundlePath stringByAppendingPathComponent:@"Frameworks"], @"W.config");
                  checkFile([bundlePath stringByAppendingPathComponent:@"Frameworks"], @"agent.js");
                  checkFile(appDir, @"W.dylib");
                  checkFile(docs, @"W.dylib");
                  checkFile(docs, @"W.config");
                  checkFile(docs, @"agent.js");
                  checkFile(tweaks, @"W.dylib");
                  checkFile(tweaks, @"W.config");
                  checkFile(tweaks, @"agent.js");

                  NSLog(@"[Locator] --- scanning directories ---");
                  scanDir(bundlePath);
                  scanDir([bundlePath stringByAppendingPathComponent:@"Frameworks"]);
                  scanDir(tweaks);
                  scanDir(appsDir);
                  scanDir(docs);

                  NSLog(@"[Locator] --- loaded modules ---");
                  uint32_t count = _dyld_image_count();
                  for (uint32_t i = 0; i < count; i++) {
                      const char *name = _dyld_get_image_name(i);
                      if (!name) continue;
                      NSString *n = [NSString stringWithUTF8String:name];
                      if ([n containsString:@"W.dylib"] || [n containsString:@"Frida"] ||
                          [n containsString:@"TweakLoader"] || [n containsString:@"Locator"]) {
                          NSLog(@"[Locator]   [%u] %@", i, n);
                      }
                  }

                  Dl_info info;
                  if (dladdr((void *)&runLocator, &info) && info.dli_fname) {
                      NSLog(@"[Locator] Loaded from: %s", info.dli_fname);
                  }
                  NSLog(@"[Locator] ========================================");
              }
          }

          __attribute__((constructor))
          __attribute__((used))
          static void onLoad(void) {
              redirectLogs();
              runLocator();
          }

          @interface LocatorLoader : NSObject @end
          @implementation LocatorLoader
          + (void)load {
              onLoad();
          }
          @end
          OBJC_EOF

      - name: Compile
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -dynamiclib \
            -o Locator.dylib \
            locator.m \
            -framework Foundation \
            -arch arm64 \
            -miphoneos-version-min=12.0 \
            -isysroot "$SDK" \
            -fobjc-arc \
            -O2 \
            -Wall -Wextra \
            -install_name "@executable_path/Frameworks/Locator.dylib"
          ls -l Locator.dylib

      - name: Verify
        run: |
          set -euo pipefail
          file Locator.dylib | grep -q arm64
          otool -l Locator.dylib | grep -A3 -i 'init_array' || echo "WARNING: no init_array"

      - name: Sign
        run: |
          set -euo pipefail
          brew install ldid || true
          if command -v ldid >/dev/null; then
            cp Locator.dylib Locator.signed.dylib
            ldid -S Locator.signed.dylib
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: locator
          path: |
            Locator.dylib
            Locator.signed.dylib
          retention-days: 30
          if-no-files-found: error