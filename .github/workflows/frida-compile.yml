name: Frida Compile

on:
  push:
    branches: [main]
    paths:
      - 'scripts/frida-scripts/**'
      - '.github/workflows/frida-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/cache@v4
        id: cache-npm
        with:
          path: ~/.npm
          key: npm-frida-compile-17-${{ runner.os }}-v2
          restore-keys: |
            npm-frida-compile-17-
            npm-frida-compile-

      - name: Get npm global root
        id: npmroot
        run: |
          set -euo pipefail
          ROOT=$(npm root -g)
          echo "ROOT=$ROOT" >> "$GITHUB_OUTPUT"
          echo "npm global root: $ROOT"

      - uses: actions/cache@v4
        id: cache-frida-compile
        with:
          path: ${{ steps.npmroot.outputs.ROOT }}/frida-compile
          key: frida-compile-17-${{ runner.os }}-v2

      - name: Install frida-compile
        if: steps.cache-frida-compile.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          npm install -g frida-compile@17

      - name: Verify frida-compile
        run: |
          set -euo pipefail
          which frida-compile
          ls -la $(which frida-compile)
          ROOT=$(npm root -g)
          node -e "console.log('frida-compile version: ' + require('$ROOT/frida-compile/package.json').version)"

      - name: Compile scripts
        run: |
          set -euo pipefail
          mkdir -p build
          shopt -s nullglob
          count=0
          for f in scripts/frida-scripts/*.js; do
            base=$(basename "$f" .js)
            case "$base" in
              _*|*.d) echo "skip $f"; continue ;;
            esac
            echo "=== compile $f ==="
            frida-compile "$f" -o "build/${base}.js"
            ls -la "build/${base}.js"
            echo "--- first 64 bytes ---"
            xxd -l 64 "build/${base}.js" || true
            count=$((count + 1))
          done
          shopt -u nullglob
          echo "compiled: $count"
          test "$count" -gt 0

      - name: Verify output
        run: |
          set -euo pipefail
          for f in build/*.js; do
            echo "--- $f ---"
            file "$f"
            wc -c "$f"
            wc -l "$f"
          done

      - name: Report head
        if: always()
        run: |
          for f in build/*.js; do
            echo "=== HEAD $f ==="
            head -c 2000 "$f" || true
            echo
            echo "=== TAIL $f ==="
            tail -c 500 "$f" || true
            echo
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frida-compiled
          path: build/
          retention-days: 30
          if-no-files-found: warn