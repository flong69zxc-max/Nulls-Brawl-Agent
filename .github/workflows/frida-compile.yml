name: Frida Compile

on:
  push:
    branches: [main]
    paths:
      - 'scripts/frida-scripts/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/frida-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm install
          npm install -g frida-compile@17
          NPM_BIN="$(npm prefix -g)/bin"
          echo "$NPM_BIN" >> "$GITHUB_PATH"

      - name: Verify
        run: |
          set -euo pipefail
          which frida-compile
          ROOT=$(npm root -g)
          node -e "console.log('frida-compile: ' + require('$ROOT/frida-compile/package.json').version)"
          node -e "console.log('frida-objc-bridge: ' + require('./node_modules/frida-objc-bridge/package.json').version)"

      - name: Compile scripts
        run: |
          set -euo pipefail
          mkdir -p build
          shopt -s nullglob
          count=0
          for f in scripts/frida-scripts/*.js; do
            base=$(basename "$f" .js)
            case "$base" in
              _*|*.d) continue ;;
            esac
            echo "=== compile $f ==="
            frida-compile "$f" -o "build/${base}.js" -S -c -s agent
            rm -f "build/${base}.js.map"
            ls -la "build/${base}.js"
            count=$((count + 1))
          done
          shopt -u nullglob
          echo "compiled: $count"
          test "$count" -gt 0

      - uses: actions/upload-artifact@v4
        with:
          name: frida-compiled
          path: build/
          retention-days: 30
          if-no-files-found: error