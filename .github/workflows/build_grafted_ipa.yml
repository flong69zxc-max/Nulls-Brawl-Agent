name: Build Frida.framework (17.19.0 gum-graft + explicit offsets)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      FRIDA_VERSION: '17.19.0'
      GUM_GRAFT_VERSION: '17.18.0'
      FRAMEWORK_NAME: Frida.framework
      LDID_VERSION: 'v2.1.5-procursus7'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Cache gum-graft
        id: cache-gum-graft
        uses: actions/cache@v4
        with:
          path: gum-graft
          key: gum-graft-${{ env.GUM_GRAFT_VERSION }}-macos-arm64

      - name: Download gum-graft
        if: steps.cache-gum-graft.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          URL="https://github.com/frida/frida/releases/download/${GUM_GRAFT_VERSION}/gum-graft-${GUM_GRAFT_VERSION}-macos-arm64.xz"
          curl -fL --retry 3 -o gum-graft.xz "$URL"
          xz -d gum-graft.xz
          chmod +x gum-graft
          file gum-graft

      - name: Verify gum-graft
        run: |
          set -euo pipefail
          test -x gum-graft
          ./gum-graft --help 2>&1 | head -30 || true

      - name: Cache Frida Gadget
        id: cache-gadget
        uses: actions/cache@v4
        with:
          path: W.thin.dylib
          key: frida-gadget-${{ env.FRIDA_VERSION }}-arm64-thin

      - name: Download and thin Frida Gadget
        if: steps.cache-gadget.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gadget-${FRIDA_VERSION}-ios-universal.dylib.xz"
          curl -fL --retry 3 -o gadget.xz "$URL"
          xz -d gadget.xz
          mv gadget W.fat.dylib
          lipo -thin arm64 -output W.thin.dylib W.fat.dylib
          rm -f W.fat.dylib
          echo "thin: $(stat -f%z W.thin.dylib)"

      - name: Remove signature before graft
        run: |
          set -euo pipefail
          codesign --remove-signature W.thin.dylib 2>&1 || true

      - name: Run gum-graft with explicit offsets
        run: |
          set -euo pipefail
          echo "before: $(stat -f%z W.thin.dylib)"
          ./gum-graft \
            --ingest-imports \
            --add 0xd93d80 \
            --add 0xb24820 \
            --add 0xb24244 \
            --add 0x9b5afc \
            --add 0x62d890 \
            W.thin.dylib 2>&1 | tail -30 || true
          echo "after: $(stat -f%z W.thin.dylib)"
          otool -l W.thin.dylib | grep -iE "graft|__FRIDA" || echo "no graft sections"

      - name: Cache ldid
        id: cache-ldid
        uses: actions/cache@v4
        with:
          path: ldid-bin
          key: ldid-${{ env.LDID_VERSION }}-macos-arm64

      - name: Install ldid
        if: steps.cache-ldid.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ldid-bin
          brew install pkg-config libplist openssl@3
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          LIBPLIST_PREFIX=$(brew --prefix libplist)
          export PKG_CONFIG_PATH="$OPENSSL_PREFIX/lib/pkgconfig:$LIBPLIST_PREFIX/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export LDFLAGS="-L$OPENSSL_PREFIX/lib -L$LIBPLIST_PREFIX/lib"
          export CPPFLAGS="-I$OPENSSL_PREFIX/include -I$LIBPLIST_PREFIX/include"
          rm -rf ldid-src
          git clone --depth 1 --branch "${LDID_VERSION}" https://github.com/ProcursusTeam/ldid.git ldid-src 2>/dev/null || git clone --depth 1 https://github.com/ProcursusTeam/ldid.git ldid-src
          cd ldid-src
          make CXXFLAGS="-O2 -pipe" -j$(sysctl -n hw.ncpu)
          cp ldid ../ldid-bin/ldid
          chmod +x ../ldid-bin/ldid

      - name: Sign grafted thin
        run: |
          set -euo pipefail
          ./ldid-bin/ldid -S W.thin.dylib
          echo "signed: $(stat -f%z W.thin.dylib)"

      - name: Build Frida.framework
        run: |
          set -euo pipefail
          rm -rf "$FRAMEWORK_NAME"
          mkdir -p "$FRAMEWORK_NAME"
          cp W.thin.dylib "$FRAMEWORK_NAME/W.dylib"

          cat > "$FRAMEWORK_NAME/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>W.dylib</string>
              <key>CFBundleIdentifier</key><string>re.frida.gadget</string>
              <key>CFBundleShortVersionString</key><string>17.19.0</string>
              <key>CFBundleVersion</key><string>17.19.0</string>
              <key>CFBundleName</key><string>Frida</string>
              <key>CFBundlePackageType</key><string>FMWK</string>
              <key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>
              <key>DTPlatformName</key><string>iphoneos</string>
              <key>MinimumOSVersion</key><string>12.0</string>
          </dict>
          </plist>
          PLIST

          cat > "$FRAMEWORK_NAME/W.config" <<'CONFIG'
          {
            "interaction": {
              "type": "script",
              "path": "agent.js",
              "on_change": "ignore"
            },
            "code_signing": "required"
          }
          CONFIG

          echo 'rpc.exports = { init: function () { return true; } };' > "$FRAMEWORK_NAME/agent.js"
          plutil -lint "$FRAMEWORK_NAME/Info.plist"
          find "$FRAMEWORK_NAME" -type f -exec ls -la {} \;

      - name: Upload Frida.framework
        uses: actions/upload-artifact@v4
        with:
          name: Frida.framework
          path: ${{ env.FRAMEWORK_NAME }}/
          retention-days: 30
          if-no-files-found: error