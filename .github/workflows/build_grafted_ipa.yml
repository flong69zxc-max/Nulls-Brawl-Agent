name: Build FridaGadget Framework

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14 file
    timeout-minutes: 30
    steps:
      - name: Download gum-graft
        run: |
          set -euo pipefail
          mkdir -p work
          curl -fL -o work/gum-graft.tar.xz \
            "https://github.com/frida/frida/releases/download/17.18.0/gum-graft-17.18.0-macos-arm64.tar.xz"
          tar xf work/gum-graft.tar.xz -C work
          chmod +x work/gum-graft
          file work/gum-graft
          work/gum-graft --help || true

      - name: Download Frida Gadget 17.18.0
        run: |
          set -euo pipefail
          curl -fL -o work/frida-gadget.dylib.xz \
            "https://github.com/frida/frida/releases/download/17.18.0/frida-gadget-17.18.0-ios-universal.dylib.xz"
          xz -d work/frida-gadget.dylib.xz
          mv work/frida-gadget.dylib work/FridaGadget.dylib
          work/FridaGadget.dylib

      - name: Apply gum-graft (bypass code signing)
        run: |
          set -euo pipefail
          work/gum-graft -i work/FridaGadget.dylib -a 0xb24998
          file work/FridaGadget.dylib

      - name: Create Framework structure
        run: |
          set -euo pipefail
          mkdir -p FridaGadget.framework
          cp work/FridaGadget.dylib FridaGadget.framework/FridaGadget
          cat > FridaGadget.framework/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>FridaGadget</string>
              <key>CFBundleIdentifier</key>
              <string>re.frida.gadget</string>
              <key>CFBundleName</key>
              <string>FridaGadget</string>
              <key>CFBundlePackageType</key>
              <string>FMWK</string>
              <key>CFBundleShortVersionString</key>
              <string>17.18.0</string>
              <key>CFBundleVersion</key>
              <string>17.18.0</string>
              <key>MinimumOSVersion</key>
              <string>11.0</string>
          </dict>
          </plist>
          EOF

      - name: Create FridaGadget.config
        run: |
          set -euo pipefail
          cat > FridaGadget.framework/FridaGadget.config << 'EOF'
          {
            "interaction": {
              "type": "script",
              "path": "updated/script_69_252.js",
              "on_change": "ignore"
            },
            "runtime": "qjs",
            "code_signing": "required"
          }
          EOF

      - name: Upload Framework
        uses: actions/upload-artifact@v4
        with:
          name: FridaGadget.framework
          path: FridaGadget.framework/
          retention-days: 7