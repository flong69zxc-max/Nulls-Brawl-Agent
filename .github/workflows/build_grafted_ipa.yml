name: Build Patched Frida Framework

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      FRIDA_VERSION: '17.9.7'
      FRAMEWORK_NAME: Frida.framework

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Frida Gadget
        run: |
          set -euo pipefail
          URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gadget-${FRIDA_VERSION}-ios-universal.dylib.xz"
          curl -fL --retry 3 -o gadget.dylib.xz "$URL"
          xz -d gadget.dylib.xz
          mv gadget.dylib W.stock.dylib
          file W.stock.dylib

      - name: Patch BRK #0x539
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import sys
          with open("W.stock.dylib", "rb") as f:
              data = bytearray(f.read())
          brk = bytes.fromhex("20 A7 20 D4")
          nop = bytes.fromhex("1F 20 03 D5")
          count = 0
          idx = 0
          while True:
              idx = data.find(brk, idx)
              if idx == -1:
                  break
              data[idx:idx+4] = nop
              count += 1
              idx += 4
          with open("W.brk-patched.dylib", "wb") as f:
              f.write(data)
          print(f"Patched {count} BRK #0x539 -> NOP")
          PYEOF
          file W.brk-patched.dylib

      - name: Patch abort calls
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import subprocess, re

          with open("W.brk-patched.dylib", "rb") as f:
              data = bytearray(f.read())

          nop = bytes.fromhex("1F 20 03 D5")

          # Патчим прямые вызовы abort (bl <abort>) и переходы на abort
          # Ищем все вхождения байтов вызова abort в бинарнике
          # abort в Mach-O arm64 обычно вызывается через stub, ищем по паттерну BL
          patched = 0

          # Патчим BRK #1 (debug trap, иногда используется как abort-путь)
          brk1 = bytes.fromhex("20 00 20 D4")
          idx = 0
          while True:
              idx = data.find(brk1, idx)
              if idx == -1:
                  break
              data[idx:idx+4] = nop
              patched += 1
              idx += 4

          with open("W.full-patched.dylib", "wb") as f:
              f.write(data)
          print(f"Patched {patched} BRK #1 instructions")
          PYEOF
          file W.full-patched.dylib

      - name: Verify patches
        run: |
          set -euo pipefail
          if xxd W.full-patched.dylib | grep -q "20a720d4"; then
            echo "::warning::BRK #0x539 still present"
          else
            echo "BRK #0x539 removed"
          fi
          if xxd W.full-patched.dylib | grep -q "200020d4"; then
            echo "::warning::BRK #1 still present"
          else
            echo "BRK #1 removed"
          fi
          ls -l W.full-patched.dylib

      - name: Assemble Frida.framework
        run: |
          set -euo pipefail
          rm -rf "$FRAMEWORK_NAME"
          mkdir -p "$FRAMEWORK_NAME"
          cp W.full-patched.dylib "$FRAMEWORK_NAME/W.dylib"

          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '    <key>CFBundleDevelopmentRegion</key>' \
            '    <string>en</string>' \
            '    <key>CFBundleDisplayName</key>' \
            '    <string>Frida</string>' \
            '    <key>CFBundleExecutable</key>' \
            '    <string>W.dylib</string>' \
            '    <key>CFBundleIdentifier</key>' \
            '    <string>re.frida.gadget</string>' \
            '    <key>CFBundleInfoDictionaryVersion</key>' \
            '    <string>6.0</string>' \
            '    <key>CFBundleName</key>' \
            '    <string>Frida</string>' \
            '    <key>CFBundlePackageType</key>' \
            '    <string>FMWK</string>' \
            '    <key>CFBundleSignature</key>' \
            '    <string>????</string>' \
            '    <key>CFBundleSupportedPlatforms</key>' \
            '    <array>' \
            '        <string>iPhoneOS</string>' \
            '    </array>' \
            '    <key>CFBundleVersion</key>' \
            '    <string>17.9.7</string>' \
            '    <key>CFBundleShortVersionString</key>' \
            '    <string>17.9.7</string>' \
            '    <key>DTPlatformName</key>' \
            '    <string>iphoneos</string>' \
            '    <key>MinimumOSVersion</key>' \
            '    <string>12.0</string>' \
            '    <key>UIRequiredDeviceCapabilities</key>' \
            '    <array>' \
            '        <string>arm64</string>' \
            '    </array>' \
            '</dict>' \
            '</plist>' \
            > "$FRAMEWORK_NAME/Info.plist"

          printf '%s\n' \
            '{' \
            '  "interaction": {' \
            '    "type": "script",' \
            '    "path": "agent.js",' \
            '    "on_change": "ignore"' \
            '  },' \
            '  "code_signing": "required"' \
            '}' \
            > "$FRAMEWORK_NAME/W.config"

          printf '%s\n' 'rpc.exports = { init: function () { return true; } };' > "$FRAMEWORK_NAME/agent.js"

          plutil -lint "$FRAMEWORK_NAME/Info.plist"
          ls -la "$FRAMEWORK_NAME"

      - name: Sign framework
        run: |
          set -euo pipefail
          brew install ldid || true
          if command -v ldid >/dev/null; then
            ldid -S "$FRAMEWORK_NAME/W.dylib"
            echo "signed W.dylib"
          fi

      - name: Package
        run: |
          set -euo pipefail
          zip -r "$FRAMEWORK_NAME.zip" "$FRAMEWORK_NAME"
          shasum -a 256 "$FRAMEWORK_NAME.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Frida.framework
          path: |
            Frida.framework.zip
            Frida.framework.zip.sha256
          retention-days: 30
          if-no-files-found: error