name: Build Patched Frida Framework

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      FRIDA_VERSION: '17.9.7'
      PATCHER_DIR: frida-bin-patcher
      FRAMEWORK_NAME: Frida.framework

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download patcher
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/electrondefuser/frida-bin-patcher.git "$PATCHER_DIR"
          cd "$PATCHER_DIR"
          sed -i '' 's/^lief==.*/lief==1.0.0/' requirements.txt
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -c "import lief; print('lief', lief.__version__)"

      - name: Download Frida Gadget
        run: |
          set -euo pipefail
          URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gadget-${FRIDA_VERSION}-ios-universal.dylib.xz"
          curl -fL --retry 3 -o gadget.dylib.xz "$URL"
          xz -d gadget.dylib.xz
          mv gadget.dylib W.stock.dylib
          file W.stock.dylib
          otool -l W.stock.dylib | grep -A4 LC_BUILD_VERSION | head -10 || true

      - name: Patch Frida strings
        run: |
          set -euo pipefail
          cd "$PATCHER_DIR"
          source venv/bin/activate
          python main.py --binarypath "../W.stock.dylib" --output "../W.patched.dylib"
          cd ..
          ls -l W.patched.dylib
          file W.patched.dylib

      - name: Patch BRK #0x539
        run: |
          set -euo pipefail
          cat > patch_brk.py <<'PYEOF'
          import sys

          def patch_brk(input_path, output_path):
              with open(input_path, 'rb') as f:
                  data = bytearray(f.read())
              brk_pattern = bytes.fromhex('20 A7 20 D4')  # BRK #0x539 (little-endian)
              nop = bytes.fromhex('1F 20 03 D5')          # NOP
              count = 0
              idx = 0
              while True:
                  idx = data.find(brk_pattern, idx)
                  if idx == -1:
                      break
                  data[idx:idx+4] = nop
                  count += 1
                  idx += 4
              with open(output_path, 'wb') as f:
                  f.write(data)
              print(f"Patched {count} BRK #0x539 instructions")

          if __name__ == '__main__':
              patch_brk(sys.argv[1], sys.argv[2])
          PYEOF
          python3 patch_brk.py W.patched.dylib W.brk-patched.dylib
          file W.brk-patched.dylib

      - name: Verify patch
        run: |
          set -euo pipefail
          if strings W.brk-patched.dylib | grep -q "frida-gadget"; then
            echo "::error::frida-gadget string still present"
            exit 1
          fi
          if xxd W.brk-patched.dylib | grep -q "20a720d4"; then
            echo "::warning::BRK #0x539 still present"
          fi
          echo "patch verification passed"

      - name: Assemble Frida.framework
        run: |
          set -euo pipefail
          rm -rf "$FRAMEWORK_NAME"
          mkdir -p "$FRAMEWORK_NAME"
          cp W.brk-patched.dylib "$FRAMEWORK_NAME/W.dylib"

          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '    <key>CFBundleDevelopmentRegion</key>' \
            '    <string>en</string>' \
            '    <key>CFBundleDisplayName</key>' \
            '    <string>Frida</string>' \
            '    <key>CFBundleExecutable</key>' \
            '    <string>W.dylib</string>' \
            '    <key>CFBundleIdentifier</key>' \
            '    <string>re.frida.gadget</string>' \
            '    <key>CFBundleInfoDictionaryVersion</key>' \
            '    <string>6.0</string>' \
            '    <key>CFBundleName</key>' \
            '    <string>Frida</string>' \
            '    <key>CFBundlePackageType</key>' \
            '    <string>FMWK</string>' \
            '    <key>CFBundleSignature</key>' \
            '    <string>????</string>' \
            '    <key>CFBundleSupportedPlatforms</key>' \
            '    <array>' \
            '        <string>iPhoneOS</string>' \
            '    </array>' \
            '    <key>CFBundleVersion</key>' \
            '    <string>17.9.7</string>' \
            '    <key>CFBundleShortVersionString</key>' \
            '    <string>17.9.7</string>' \
            '    <key>DTPlatformName</key>' \
            '    <string>iphoneos</string>' \
            '    <key>MinimumOSVersion</key>' \
            '    <string>12.0</string>' \
            '    <key>UIRequiredDeviceCapabilities</key>' \
            '    <array>' \
            '        <string>arm64</string>' \
            '    </array>' \
            '</dict>' \
            '</plist>' \
            > "$FRAMEWORK_NAME/Info.plist"

          printf '%s\n' \
            '{' \
            '  "interaction": {' \
            '    "type": "script",' \
            '    "path": "agent.js",' \
            '    "on_change": "ignore"' \
            '  },' \
            '  "code_signing": "optional"' \
            '}' \
            > "$FRAMEWORK_NAME/W.config"

          printf '%s\n' 'rpc.exports = { init: function () { return true; } };' > "$FRAMEWORK_NAME/agent.js"

          plutil -lint "$FRAMEWORK_NAME/Info.plist"
          ls -la "$FRAMEWORK_NAME"

      - name: Sign framework
        run: |
          set -euo pipefail
          brew install ldid || true
          if command -v ldid >/dev/null; then
            ldid -S "$FRAMEWORK_NAME/W.dylib"
            echo "signed W.dylib"
          else
            echo "::warning::ldid not available, leaving unsigned"
          fi

      - name: Package
        run: |
          set -euo pipefail
          zip -r "$FRAMEWORK_NAME.zip" "$FRAMEWORK_NAME"
          shasum -a 256 "$FRAMEWORK_NAME.zip" | tee "$FRAMEWORK_NAME.zip.sha256"

      - name: Summary
        run: |
          set -euo pipefail
          {
            echo "### patched frida framework"
            echo ""
            echo "| param | value |"
            echo "|---|---|"
            echo "| frida | ${FRIDA_VERSION} |"
            echo "| patch | frida-bin-patcher + BRK #0x539 → NOP |"
            echo "| arch | arm64 |"
            echo "| dylib size | $(stat -f%z $FRAMEWORK_NAME/W.dylib) B |"
            echo "| sha256 | \`$(shasum -a 256 $FRAMEWORK_NAME.zip | cut -c1-16)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Frida.framework
          path: |
            Frida.framework.zip
            Frida.framework.zip.sha256
          retention-days: 30
          if-no-files-found: error