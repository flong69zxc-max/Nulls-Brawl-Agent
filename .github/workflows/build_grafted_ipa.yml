name: Build Patched Frida Framework

# Собирает пропатченный Frida Gadget в готовый iOS Frida.framework бандл.
# Патчер (electrondefuser/frida-bin-patcher) вырезает сигнатуры, по которым
# защита приложений и сам Frida Gadget детектируют факт инструментации.
#
# Выход: Frida.framework.zip, внутри:
#   Frida.framework/
#   ├── W.dylib          (пропатченный Frida Gadget)
#   ├── Info.plist       (описание фреймворка)
#   ├── W.config         (конфиг Gadget)
#   └── agent.js         (заглушка, заменишь своим скриптом)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      frida_version:
        description: 'Версия Frida Gadget (например 17.9.7)'
        required: true
        default: '17.9.7'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      FRIDA_VERSION: ${{ inputs.frida_version || '17.9.7' }}
      PATCHER_DIR: frida-bin-patcher
      FRAMEWORK_NAME: Frida.framework

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download patcher
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/electrondefuser/frida-bin-patcher.git "$PATCHER_DIR"
          cd "$PATCHER_DIR"
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -c "import lief; print('lief', lief.__version__)"

      - name: Download Frida Gadget
        run: |
          set -euo pipefail
          URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gadget-${FRIDA_VERSION}-ios-universal.dylib.xz"
          echo "downloading $URL"
          curl -fL --retry 3 -o gadget.dylib.xz "$URL"
          xz -d gadget.dylib.xz
          mv gadget.dylib W.stock.dylib
          file W.stock.dylib
          otool -l W.stock.dylib | grep -A4 LC_BUILD_VERSION | head -20

      - name: Patch binary
        run: |
          set -euo pipefail
          cd "$PATCHER_DIR"
          python3 main.py \
            --binarypath "../W.stock.dylib" \
            --output "../W.patched.dylib"
          cd ..
          ls -l W.patched.dylib
          file W.patched.dylib
          file W.patched.dylib | grep -q arm64

      - name: Verify patch
        run: |
          set -euo pipefail
          STOCK=$(stat -f%z W.stock.dylib)
          PATCHED=$(stat -f%z W.patched.dylib)
          echo "stock: $STOCK bytes"
          echo "patched: $PATCHED bytes"
          if [ "$STOCK" -eq "$PATCHED" ]; then
            echo "::warning::размер не изменился — патч, возможно, не применён"
          fi
          if strings W.patched.dylib | grep -q "frida-gadget"; then
            echo "::error::строковый маркер 'frida-gadget' всё ещё в бинарнике"
            strings W.patched.dylib | grep "frida" | head -10
            exit 1
          fi
          echo "строковые маркеры Frida вычищены"

      - name: Assemble Frida.framework
        run: |
          set -euo pipefail
          rm -rf "$FRAMEWORK_NAME"
          mkdir -p "$FRAMEWORK_NAME"

          cp W.patched.dylib "$FRAMEWORK_NAME/W.dylib"

          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '    <key>CFBundleDevelopmentRegion</key>' \
            '    <string>en</string>' \
            '    <key>CFBundleDisplayName</key>' \
            '    <string>Frida</string>' \
            '    <key>CFBundleExecutable</key>' \
            '    <string>W.dylib</string>' \
            '    <key>CFBundleIdentifier</key>' \
            '    <string>re.frida.gadget</string>' \
            '    <key>CFBundleInfoDictionaryVersion</key>' \
            '    <string>6.0</string>' \
            '    <key>CFBundleName</key>' \
            '    <string>Frida</string>' \
            '    <key>CFBundlePackageType</key>' \
            '    <string>FMWK</string>' \
            '    <key>CFBundleSignature</key>' \
            '    <string>????</string>' \
            '    <key>CFBundleSupportedPlatforms</key>' \
            '    <array>' \
            '        <string>iPhoneOS</string>' \
            '    </array>' \
            '    <key>CFBundleVersion</key>' \
            '    <string>17.9.7</string>' \
            '    <key>CFBundleShortVersionString</key>' \
            '    <string>17.9.7</string>' \
            '    <key>DTPlatformName</key>' \
            '    <string>iphoneos</string>' \
            '    <key>MinimumOSVersion</key>' \
            '    <string>12.0</string>' \
            '    <key>UIRequiredDeviceCapabilities</key>' \
            '    <array>' \
            '        <string>arm64</string>' \
            '    </array>' \
            '</dict>' \
            '</plist>' \
            > "$FRAMEWORK_NAME/Info.plist"

          printf '%s\n' \
            '{' \
            '  "interaction": {' \
            '    "type": "script",' \
            '    "path": "agent.js",' \
            '    "on_change": "ignore"' \
            '  },' \
            '  "code_signing": "optional"' \
            '}' \
            > "$FRAMEWORK_NAME/W.config"

          printf '%s\n' 'rpc.exports = { init: function () { return true; } };' > "$FRAMEWORK_NAME/agent.js"

          plutil -lint "$FRAMEWORK_NAME/Info.plist"
          ls -la "$FRAMEWORK_NAME"

      - name: Sign framework
        run: |
          set -euo pipefail
          brew install ldid || true
          if command -v ldid >/dev/null; then
            ldid -S "$FRAMEWORK_NAME/W.dylib"
            echo "signed W.dylib"
          else
            echo "::warning::ldid недоступен, оставляю неподписанный"
          fi

      - name: Package
        run: |
          set -euo pipefail
          zip -r "$FRAMEWORK_NAME.zip" "$FRAMEWORK_NAME"
          shasum -a 256 "$FRAMEWORK_NAME.zip" | tee "$FRAMEWORK_NAME.zip.sha256"

      - name: Summary
        run: |
          set -euo pipefail
          {
            echo "### patched frida framework"
            echo ""
            echo "| параметр | значение |"
            echo "|---|---|"
            echo "| frida | ${FRIDA_VERSION} |"
            echo "| patcher | electrondefuser/frida-bin-patcher |"
            echo "| arch | arm64 |"
            echo "| размер dylib | $(stat -f%z $FRAMEWORK_NAME/W.dylib) B |"
            echo "| sha256 | \`$(shasum -a 256 $FRAMEWORK_NAME.zip | cut -c1-16)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Frida.framework
          path: |
            Frida.framework.zip
            Frida.framework.zip.sha256
          retention-days: 30
          if-no-files-found: error