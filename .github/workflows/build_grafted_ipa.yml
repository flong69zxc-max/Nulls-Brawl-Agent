name: Build Frida Gadget & Repack IPA

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: 'Frida version (e.g. 17.5.0 or latest)'
        required: true
        default: 'latest'

env:
  FRIDA_VERSION: ${{ github.event.inputs.frida_version }}
  IPA_PATH: ./input/target.ipa
  OUTPUT_IPA: ./output/target_modded.ipa
  GADGET_NAME: FridaGadget.dylib
  SCRIPT_NAME: agent.js

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python & pip
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          brew install ldid xz
          pip install lief requests

      - name: Resolve Frida version
        id: frida_ver
        run: |
          if [ "$FRIDA_VERSION" = "latest" ]; then
            VER=$(curl -s https://api.github.com/repos/frida/frida/releases/latest | python3 -c "import sys,json;print(json.load(sys.stdin)['tag_name'])")
          else
            VER="$FRIDA_VERSION"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Download Frida Gadget
        run: |
          VER=${{ steps.frida_ver.outputs.version }}
          URL="https://github.com/frida/frida/releases/download/${VER}/frida-gadget-${VER}-ios-universal.dylib.xz"
          curl -L -o gadget.xz "$URL"
          xz -d gadget.xz
          mv gadget "${{ env.GADGET_NAME }}"

      - name: Prepare gadget config
        run: |
          cat > gadget.config <<'EOF'
          {
            "interaction": {
              "type": "script",
              "path": "Frameworks/agent.js"
            },
            "code_signing": "required"
          }
          EOF

      - name: Prepare agent script
        run: |
          cp ./scripts/agent.js ./agent.js

      - name: Extract IPA
        run: |
          rm -rf ./Payload
          unzip -q "${{ env.IPA_PATH }}" -d ./extracted
          APP_DIR=$(find ./extracted/Payload -maxdepth 1 -type d -name "*.app" | head -n1)
          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV

      - name: Inject Frida Gadget into IPA
        run: |
          BINARY=$(find "$APP_DIR" -maxdepth 1 -type f -perm +111 ! -name "*.dylib" | head -n1)
          echo "BINARY=$BINARY" >> $GITHUB_ENV

          mkdir -p "$APP_DIR/Frameworks"
          cp "${{ env.GADGET_NAME }}" "$APP_DIR/Frameworks/"
          cp gadget.config "$APP_DIR/Frameworks/${GADGET_NAME%.dylib}.config"
          cp agent.js "$APP_DIR/Frameworks/agent.js"

          ldid -S"$APP_DIR/Frameworks/${{ env.GADGET_NAME }}"
          ldid -S"$BINARY"

          insert_dylib --inplace --strip-codesig "@executable_path/Frameworks/${{ env.GADGET_NAME }}" "$BINARY"

          ldid -S"$BINARY"

      - name: Repack IPA
        run: |
          cd ./extracted
          zip -qr ../output.ipa Payload
          cd ..
          mv output.ipa "${{ env.OUTPUT_IPA }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: modded-ipa
          path: ${{ env.OUTPUT_IPA }}