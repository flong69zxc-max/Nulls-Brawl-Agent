name: Build FridaGadget Framework

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: cache-gum-graft
        with:
          path: gum-graft-bin
          key: gum-graft-17.18.0-macos-arm64-v3

      - name: Checkout frida-gum
        if: steps.cache-gum-graft.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: frida/frida-gum
          ref: 17.18.0
          submodules: recursive
          path: frida-gum

      - uses: actions/setup-python@v5
        if: steps.cache-gum-graft.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'

      - name: Install build dependencies
        if: steps.cache-gum-graft.outputs.cache-hit != 'true'
        run: |
          brew install meson ninja pkg-config libffi glib
          pip install setuptools

      - name: Build gum-graft
        if: steps.cache-gum-graft.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd frida-gum
          meson setup build --prefix=/tmp/frida-build -Dgraft_tool=enabled
          ninja -C build tools/gum-graft
          mkdir -p ../gum-graft-bin
          cp build/tools/gum-graft ../gum-graft-bin/gum-graft
          cp build/gum/libfrida-gum-1.0.dylib ../gum-graft-bin/libfrida-gum-1.0.dylib
          chmod +x ../gum-graft-bin/gum-graft
          install_name_tool -change "@rpath/libfrida-gum-1.0.dylib" "@executable_path/libfrida-gum-1.0.dylib" ../gum-graft-bin/gum-graft || true
          install_name_tool -change "@rpath/libfrida-gum-1.0.dylib" "@executable_path/libfrida-gum-1.0.dylib" ../gum-graft-bin/libfrida-gum-1.0.dylib || true
          otool -L ../gum-graft-bin/gum-graft
          ls -la ../gum-graft-bin/

      - name: Verify gum-graft
        run: |
          set -euo pipefail
          ls -la gum-graft-bin/
          otool -L gum-graft-bin/gum-graft
          DYLD_LIBRARY_PATH="$PWD/gum-graft-bin" ./gum-graft-bin/gum-graft --help || true

      - uses: actions/cache@v4
        id: cache-gadget
        with:
          path: gadget-cache
          key: frida-gadget-17.18.0-ios-universal-v1

      - name: Download Frida Gadget
        if: steps.cache-gadget.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p gadget-cache
          curl -fL -o /tmp/frida-gadget.dylib.xz \
            "https://github.com/frida/frida/releases/download/17.18.0/frida-gadget-17.18.0-ios-universal.dylib.xz"
          xz -d /tmp/frida-gadget.dylib.xz
          mv /tmp/frida-gadget.dylib gadget-cache/FridaGadget.dylib
          file gadget-cache/FridaGadget.dylib

      - name: Apply gum-graft (ingest function starts)
        run: |
          set -euo pipefail
          mkdir -p work
          cp gadget-cache/FridaGadget.dylib work/FridaGadget.dylib
          chmod +x gum-graft-bin/gum-graft
          DYLD_LIBRARY_PATH="$PWD/gum-graft-bin" ./gum-graft-bin/gum-graft --ingest-function-starts work/FridaGadget.dylib
          file work/FridaGadget.dylib

      - name: Create Framework structure
        run: |
          set -euo pipefail
          mkdir -p FridaGadget.framework
          cp work/FridaGadget.dylib FridaGadget.framework/FridaGadget
          cat > FridaGadget.framework/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>FridaGadget</string>
              <key>CFBundleIdentifier</key>
              <string>re.frida.gadget</string>
              <key>CFBundleName</key>
              <string>FridaGadget</string>
              <key>CFBundlePackageType</key>
              <string>FMWK</string>
              <key>CFBundleShortVersionString</key>
              <string>17.18.0</string>
              <key>CFBundleVersion</key>
              <string>17.18.0</string>
              <key>MinimumOSVersion</key>
              <string>11.0</string>
          </dict>
          </plist>
          EOF

      - name: Create FridaGadget.config
        run: |
          set -euo pipefail
          cat > FridaGadget.framework/FridaGadget.config << 'EOF'
          {
            "interaction": {
              "type": "script",
              "path": "updated/script_69_252.js",
              "on_change": "ignore"
            },
            "runtime": "qjs",
            "code_signing": "required"
          }
          EOF

      - name: Commit and push framework
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add -f FridaGadget.framework
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "build: FridaGadget.framework 17.18.0 [skip ci]"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: FridaGadget.framework
          path: FridaGadget.framework/
          retention-days: 7