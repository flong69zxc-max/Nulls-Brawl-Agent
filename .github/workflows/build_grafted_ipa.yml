name: Build FridaGadget Framework 17.16.4 (arm64 thin)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Download Frida Gadget 17.16.4
        run: |
          set -euo pipefail
          mkdir -p work
          curl -fL -o work/gadget.dylib.xz \
            "https://github.com/frida/frida/releases/download/17.16.4/frida-gadget-17.16.4-ios-universal.dylib.xz"
          xz -d work/gadget.dylib.xz
          mv work/gadget.dylib work/FridaGadget-universal
          lipo -info work/FridaGadget-universal

      - name: Thin to arm64
        run: |
          set -euo pipefail
          lipo work/FridaGadget-universal -thin arm64 -output work/FridaGadget
          lipo -info work/FridaGadget
          ls -la work/

      - name: Build FridaGadget.framework
        run: |
          set -euo pipefail
          mkdir -p FridaGadget.framework
          cp work/FridaGadget FridaGadget.framework/FridaGadget
          chmod +x FridaGadget.framework/FridaGadget
          cat > FridaGadget.framework/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>FridaGadget</string>
              <key>CFBundleIdentifier</key>
              <string>re.frida.gadget</string>
              <key>CFBundleName</key>
              <string>FridaGadget</string>
              <key>CFBundlePackageType</key>
              <string>FMWK</string>
              <key>CFBundleShortVersionString</key>
              <string>17.16.4</string>
              <key>CFBundleVersion</key>
              <string>17.16.4</string>
              <key>MinimumOSVersion</key>
              <string>11.0</string>
          </dict>
          </plist>
          EOF
          ls -la FridaGadget.framework/

      - uses: actions/upload-artifact@v4
        with:
          name: FridaGadget.framework-17.16.4-arm64
          path: FridaGadget.framework/
          retention-days: 7