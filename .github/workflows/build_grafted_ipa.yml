name: Build Patched Frida Framework

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build_grafted_ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      FRIDA_VERSION: '17.9.7'
      FRAMEWORK_NAME: Frida.framework

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Frida Gadget
        run: |
          set -euo pipefail
          URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gadget-${FRIDA_VERSION}-ios-universal.dylib.xz"
          curl -fL --retry 3 -o gadget.dylib.xz "$URL"
          xz -d gadget.dylib.xz
          mv gadget.dylib W.stock.dylib
          file W.stock.dylib
          lipo -info W.stock.dylib
          echo "SHA256 stock: $(shasum -a 256 W.stock.dylib | cut -c1-16)"

      - name: Analyze original binary
        run: |
          set -euo pipefail
          count_pattern() {
            xxd -p "$1" | tr -d '\n' | grep -o "$2" | wc -l | tr -d ' '
          }
          echo "BRK #0x539 in stock: $(count_pattern W.stock.dylib 20a720d4)"
          echo "BRK #1 in stock: $(count_pattern W.stock.dylib 200020d4)"
          echo "NOP in stock: $(count_pattern W.stock.dylib 1f2003d5)"
          echo "abort symbol:"
          nm -gU W.stock.dylib | grep -i abort || true

      - name: Patch BRK and abort
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import subprocess

          with open("W.stock.dylib", "rb") as f:
              data = bytearray(f.read())

          nop = bytes.fromhex("1F 20 03 D5")

          brk539 = bytes.fromhex("20 A7 20 D4")
          count_brk = 0
          idx = 0
          while True:
              idx = data.find(brk539, idx)
              if idx == -1:
                  break
              data[idx:idx+4] = nop
              count_brk += 1
              idx += 4
          print(f"BRK #0x539 patched: {count_brk}")

          brk1 = bytes.fromhex("20 00 20 D4")
          count_brk1 = 0
          idx = 0
          while True:
              idx = data.find(brk1, idx)
              if idx == -1:
                  break
              data[idx:idx+4] = nop
              count_brk1 += 1
              idx += 4
          print(f"BRK #1 patched: {count_brk1}")

          out = subprocess.run(["nm", "-gU", "W.stock.dylib"], capture_output=True, text=True)
          abort_addr = None
          for line in out.stdout.splitlines():
              parts = line.split()
              if len(parts) >= 3 and parts[2] == "_abort":
                  abort_addr = int(parts[0], 16)
                  break
          count_abort = 0
          if abort_addr:
              print(f"abort symbol address: 0x{abort_addr:x}")
              for i in range(0, len(data) - 4, 4):
                  instr = int.from_bytes(data[i:i+4], "little")
                  if (instr & 0xFC000000) == 0x94000000:
                      imm26 = instr & 0x03FFFFFF
                      if imm26 & 0x02000000:
                          imm26 -= 0x04000000
                      target = i + imm26 * 4
                      if target == abort_addr:
                          data[i:i+4] = nop
                          count_abort += 1
              print(f"BL abort patched: {count_abort}")
          else:
              print("abort symbol not found, skipping BL patch")

          with open("W.full-patched.dylib", "wb") as f:
              f.write(data)
          print("=== patching done ===")
          PYEOF
          file W.full-patched.dylib

      - name: Verify patches
        run: |
          set -euo pipefail
          count_pattern() {
            xxd -p "$1" | tr -d '\n' | grep -o "$2" | wc -l | tr -d ' '
          }

          STOCK_BRK539=$(count_pattern W.stock.dylib 20a720d4)
          PATCHED_BRK539=$(count_pattern W.full-patched.dylib 20a720d4)
          STOCK_BRK1=$(count_pattern W.stock.dylib 200020d4)
          PATCHED_BRK1=$(count_pattern W.full-patched.dylib 200020d4)
          STOCK_NOP=$(count_pattern W.stock.dylib 1f2003d5)
          PATCHED_NOP=$(count_pattern W.full-patched.dylib 1f2003d5)

          echo "BRK #0x539: stock=$STOCK_BRK539 patched=$PATCHED_BRK539"
          echo "BRK #1:     stock=$STOCK_BRK1 patched=$PATCHED_BRK1"
          echo "NOP:        stock=$STOCK_NOP patched=$PATCHED_NOP"

          if [ "$PATCHED_BRK539" -ne 0 ]; then
            echo "::error::BRK #0x539 still present ($PATCHED_BRK539)"
            exit 1
          fi
          if [ "$PATCHED_BRK1" -ne 0 ]; then
            echo "::error::BRK #1 still present ($PATCHED_BRK1)"
            exit 1
          fi

          EXPECTED_MIN=$((STOCK_NOP + STOCK_BRK539 + STOCK_BRK1))
          if [ "$PATCHED_NOP" -lt "$EXPECTED_MIN" ]; then
            echo "::error::NOP count $PATCHED_NOP < expected $EXPECTED_MIN (patch did not apply)"
            exit 1
          fi

          if [ "$STOCK_BRK539" -eq 0 ] && [ "$STOCK_BRK1" -eq 0 ]; then
            echo "::warning::no BRKs found in stock — verification limited to NOP growth"
          fi

          file W.full-patched.dylib | grep -q arm64 || { echo "::error::not arm64"; exit 1; }
          echo "OK: all patches verified"

      - name: Assemble Frida.framework
        run: |
          set -euo pipefail
          rm -rf "$FRAMEWORK_NAME"
          mkdir -p "$FRAMEWORK_NAME"
          cp W.full-patched.dylib "$FRAMEWORK_NAME/W.dylib"

          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '    <key>CFBundleDevelopmentRegion</key>' \
            '    <string>en</string>' \
            '    <key>CFBundleDisplayName</key>' \
            '    <string>Frida</string>' \
            '    <key>CFBundleExecutable</key>' \
            '    <string>W.dylib</string>' \
            '    <key>CFBundleIdentifier</key>' \
            '    <string>re.frida.gadget</string>' \
            '    <key>CFBundleInfoDictionaryVersion</key>' \
            '    <string>6.0</string>' \
            '    <key>CFBundleName</key>' \
            '    <string>Frida</string>' \
            '    <key>CFBundlePackageType</key>' \
            '    <string>FMWK</string>' \
            '    <key>CFBundleSignature</key>' \
            '    <string>????</string>' \
            '    <key>CFBundleSupportedPlatforms</key>' \
            '    <array>' \
            '        <string>iPhoneOS</string>' \
            '    </array>' \
            '    <key>CFBundleVersion</key>' \
            '    <string>17.9.7</string>' \
            '    <key>CFBundleShortVersionString</key>' \
            '    <string>17.9.7</string>' \
            '    <key>DTPlatformName</key>' \
            '    <string>iphoneos</string>' \
            '    <key>MinimumOSVersion</key>' \
            '    <string>12.0</string>' \
            '    <key>UIRequiredDeviceCapabilities</key>' \
            '    <array>' \
            '        <string>arm64</string>' \
            '    </array>' \
            '</dict>' \
            '</plist>' \
            > "$FRAMEWORK_NAME/Info.plist"

          printf '%s\n' \
            '{' \
            '  "interaction": {' \
            '    "type": "script",' \
            '    "path": "agent.js",' \
            '    "on_change": "ignore"' \
            '  },' \
            '  "code_signing": "required"' \
            '}' \
            > "$FRAMEWORK_NAME/W.config"

          printf '%s\n' 'rpc.exports = { init: function () { return true; } };' > "$FRAMEWORK_NAME/agent.js"

          plutil -lint "$FRAMEWORK_NAME/Info.plist"
          ls -la "$FRAMEWORK_NAME"

      - name: Sign framework
        run: |
          set -euo pipefail
          brew install ldid || true
          if command -v ldid >/dev/null; then
            ldid -S "$FRAMEWORK_NAME/W.dylib"
            echo "signed W.dylib"
            codesign -dvv "$FRAMEWORK_NAME/W.dylib" 2>&1 | head -5 || true
          fi

      - name: Final verification
        run: |
          set -euo pipefail
          count_pattern() {
            xxd -p "$1" | tr -d '\n' | grep -o "$2" | wc -l | tr -d ' '
          }
          echo "=== final framework checks ==="
          file "$FRAMEWORK_NAME/W.dylib"
          echo "BRK #0x539: $(count_pattern $FRAMEWORK_NAME/W.dylib 20a720d4)"
          echo "BRK #1:     $(count_pattern $FRAMEWORK_NAME/W.dylib 200020d4)"
          echo "NOP:        $(count_pattern $FRAMEWORK_NAME/W.dylib 1f2003d5)"
          echo "=== framework structure ==="
          find "$FRAMEWORK_NAME" -type f | sort

      - name: Package
        run: |
          set -euo pipefail
          zip -r "$FRAMEWORK_NAME.zip" "$FRAMEWORK_NAME"
          shasum -a 256 "$FRAMEWORK_NAME.zip" | tee "$FRAMEWORK_NAME.zip.sha256"

      - name: Summary
        run: |
          set -euo pipefail
          count_pattern() {
            xxd -p "$1" | tr -d '\n' | grep -o "$2" | wc -l | tr -d ' '
          }
          {
            echo "### patched frida framework"
            echo ""
            echo "| param | value |"
            echo "|---|---|"
            echo "| frida | ${FRIDA_VERSION} |"
            echo "| patches | BRK #0x539, BRK #1, BL abort |"
            echo "| BRK #0x539 remaining | $(count_pattern $FRAMEWORK_NAME/W.dylib 20a720d4) |"
            echo "| BRK #1 remaining | $(count_pattern $FRAMEWORK_NAME/W.dylib 200020d4) |"
            echo "| NOP count | $(count_pattern $FRAMEWORK_NAME/W.dylib 1f2003d5) |"
            echo "| arch | arm64 |"
            echo "| dylib size | $(stat -f%z $FRAMEWORK_NAME/W.dylib) B |"
            echo "| sha256 | \`$(shasum -a 256 $FRAMEWORK_NAME.zip | cut -c1-16)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Frida.framework
          path: |
            Frida.framework.zip
            Frida.framework.zip.sha256
          retention-days: 30
          if-no-files-found: error