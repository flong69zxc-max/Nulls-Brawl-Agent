name: Build Frida.framework (dev-matching)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 10
    env:
      FRIDA_VERSION: '17.2.11'
      FRAMEWORK_NAME: Frida.framework

    steps:
      - uses: actions/checkout@v4

      - name: Download Frida Gadget
        run: |
          set -euo pipefail
          URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gadget-${FRIDA_VERSION}-ios-universal.dylib.xz"
          curl -fL --retry 3 -o gadget.dylib.xz "$URL"
          xz -d gadget.dylib.xz
          mv gadget.dylib W.stock.dylib
          file W.stock.dylib
          lipo -info W.stock.dylib || true

      - name: Extract arm64
        run: |
          set -euo pipefail
          if lipo -info W.stock.dylib 2>/dev/null | grep -q "Non-fat"; then
            cp W.stock.dylib W.dylib
          else
            lipo -thin arm64 -output W.dylib W.stock.dylib
          fi
          file W.dylib
          echo "size: $(stat -f%z W.dylib) bytes"

      - name: Strip (match dev size)
        run: |
          set -euo pipefail
          xcrun strip -Sx W.dylib -o W.stripped.dylib
          mv W.stripped.dylib W.dylib
          file W.dylib
          echo "stripped size: $(stat -f%z W.dylib) bytes"

      - name: Compare with dev
        run: |
          set -euo pipefail
          if [ ! -f W.dylib.zip ]; then
            echo "W.dylib.zip not found, skipping comparison"
            exit 0
          fi
          mkdir -p dev
          unzip -o W.dylib.zip -d dev > /dev/null
          DEV=$(find dev -type f -name "*.dylib" ! -path "*__MACOSX*" ! -name "._*" | head -1)
          cp "$DEV" W.dev.raw.dylib
          if lipo -info W.dev.raw.dylib 2>/dev/null | grep -q "Non-fat"; then
            cp W.dev.raw.dylib W.dev.dylib
          else
            lipo -thin arm64 -output W.dev.dylib W.dev.raw.dylib
          fi
          echo "=== dev size vs ours ==="
          echo "dev:  $(stat -f%z W.dev.dylib)"
          echo "ours: $(stat -f%z W.dylib)"
          echo "diff: $(( $(stat -f%z W.dylib) - $(stat -f%z W.dev.dylib) ))"

          echo "=== byte-level diff (first 200 differing offsets) ==="
          python3 - << 'PYEOF' > compare.txt 2>&1
          with open("W.dev.dylib","rb") as f: dev = f.read()
          with open("W.dylib","rb") as f: ours = f.read()
          n = min(len(dev), len(ours))
          diffs = []
          for i in range(n):
              if dev[i] != ours[i]:
                  diffs.append(i)
          print(f"total differing bytes (of {n}): {len(diffs)}")
          print(f"first 200 offsets:")
          for i in diffs[:200]:
              print(f"  off 0x{i:x}: dev={dev[i]:02x} ours={ours[i]:02x}")
          if len(dev) != len(ours):
              print(f"length differs: dev={len(dev)} ours={len(ours)}")
          PYEOF
          cat compare.txt

      - name: Assemble Frida.framework
        run: |
          set -euo pipefail
          rm -rf "$FRAMEWORK_NAME"
          mkdir -p "$FRAMEWORK_NAME"
          cp W.dylib "$FRAMEWORK_NAME/W.dylib"
          cat > "$FRAMEWORK_NAME/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>W.dylib</string>
              <key>CFBundleIdentifier</key><string>re.frida.gadget</string>
              <key>CFBundleShortVersionString</key><string>17.2.11</string>
              <key>CFBundleVersion</key><string>17.2.11</string>
              <key>CFBundleName</key><string>Frida</string>
              <key>CFBundlePackageType</key><string>FMWK</string>
              <key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>
              <key>DTPlatformName</key><string>iphoneos</string>
              <key>MinimumOSVersion</key><string>12.0</string>
          </dict>
          </plist>
          PLIST
          cat > "$FRAMEWORK_NAME/W.config" << 'CONFIG'
          {
            "interaction": {"type": "script", "path": "agent.js", "on_change": "ignore"},
            "code_signing": "required"
          }
          CONFIG
          echo 'rpc.exports = { init: function () { return true; } };' > "$FRAMEWORK_NAME/agent.js"
          plutil -lint "$FRAMEWORK_NAME/Info.plist"

      - name: Sign
        run: |
          set -euo pipefail
          brew install ldid || true
          command -v ldid >/dev/null && ldid -S "$FRAMEWORK_NAME/W.dylib"
          codesign -dvv "$FRAMEWORK_NAME/W.dylib" 2>&1 | head -5 || true

      - name: Package
        run: |
          set -euo pipefail
          find "$FRAMEWORK_NAME" -name ".DS_Store" -delete
          find "$FRAMEWORK_NAME" -name "._*" -delete
          xattr -cr "$FRAMEWORK_NAME" 2>/dev/null || true
          zip -r -X "$FRAMEWORK_NAME.zip" "$FRAMEWORK_NAME"
          shasum -a 256 "$FRAMEWORK_NAME.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Frida.framework
          path: |
            Frida.framework.zip
            Frida.framework.zip.sha256
            compare.txt
          retention-days: 30
          if-no-files-found: error