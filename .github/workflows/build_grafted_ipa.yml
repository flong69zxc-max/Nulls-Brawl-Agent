name: Build Patched Nulls Brawl IPA

on:
  push:
    branches: [main]
    paths:
      - "scripts/frida-scripts/agent.js"
      - ".github/workflows/build-patched.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      FRIDA_VERSION: "17.19.0"
      LDID_VERSION: "v2.1.5-procursus7"

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install toolchain
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund --ignore-scripts esbuild@0.28.2 frida-objc-bridge@8.0.6

      - name: Compile agent.js
        run: |
          set -euo pipefail
          mkdir -p build
          ./node_modules/.bin/esbuild scripts/frida-scripts/agent.js \
            --bundle --format=esm --target=es2020 --minify \
            --legal-comments=none \
            --banner:js='"use strict";' \
            --outfile=build/agent.js
          ls -la build/agent.js

      - name: Resolve IPA URL
        id: resolve
        run: |
          set -euo pipefail
          LOC=$(curl -sIL -A "Mozilla/5.0" "https://nulls.ee/bs_latest_i" \
            | grep -i "^location:" | tail -1 | awk '{print $2}' | tr -d '\r\n')
          test -n "$LOC"
          echo "URL=$LOC" >> "$GITHUB_OUTPUT"
          VER=$(basename "$LOC" | sed -E 's/nb_([0-9.]+)_.*/\1/')
          echo "VER=$VER" >> "$GITHUB_OUTPUT"
          echo "resolved: $LOC (version $VER)"

      - uses: actions/cache@v4
        id: cache-ipa
        with:
          path: ipa_cache
          key: nulls-brawl-ipa-${{ steps.resolve.outputs.VER }}

      - name: Download IPA
        if: steps.cache-ipa.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ipa_cache
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
            --max-time 900 \
            -A "Mozilla/5.0" \
            -o ipa_cache/bs.ipa \
            "${{ steps.resolve.outputs.URL }}"
          test -s ipa_cache/bs.ipa
          file ipa_cache/bs.ipa

      - name: Extract IPA
        id: extract
        run: |
          set -euo pipefail
          rm -rf extract
          mkdir -p extract
          unzip -q ipa_cache/bs.ipa -d extract
          APP_DIR=$(find extract/Payload -maxdepth 1 -type d -name "*.app" | head -n1)
          test -n "$APP_DIR"
          BIN="$APP_DIR/Nulls Brawl"
          if [ ! -f "$BIN" ]; then
            BIN=$(find "$APP_DIR" -maxdepth 1 -type f -perm +111 ! -name "*.dylib" ! -name "*.png" | head -n1)
          fi
          test -f "$BIN"
          file "$BIN"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Cache Frida Gadget
        id: cache-gadget
        uses: actions/cache@v4
        with:
          path: W.thin.dylib
          key: frida-gadget-${{ env.FRIDA_VERSION }}-arm64-thin

      - name: Download Frida Gadget
        if: steps.cache-gadget.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o gadget.xz "https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gadget-${FRIDA_VERSION}-ios-universal.dylib.xz"
          xz -d gadget.xz
          mv gadget W.fat.dylib
          lipo -thin arm64 -output W.thin.dylib W.fat.dylib
          rm -f W.fat.dylib

      - name: Install ldid deps
        run: |
          set -euo pipefail
          brew install pkg-config libplist openssl@3

      - name: Cache ldid
        id: cache-ldid
        uses: actions/cache@v4
        with:
          path: ldid-bin
          key: ldid-${{ env.LDID_VERSION }}-macos-arm64

      - name: Build ldid
        if: steps.cache-ldid.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ldid-bin
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          LIBPLIST_PREFIX=$(brew --prefix libplist)
          export PKG_CONFIG_PATH="$OPENSSL_PREFIX/lib/pkgconfig:$LIBPLIST_PREFIX/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export LDFLAGS="-L$OPENSSL_PREFIX/lib -L$LIBPLIST_PREFIX/lib"
          export CPPFLAGS="-I$OPENSSL_PREFIX/include -I$LIBPLIST_PREFIX/include"
          git clone --depth 1 --branch "${LDID_VERSION}" https://github.com/ProcursusTeam/ldid.git ldid-src 2>/dev/null || git clone --depth 1 https://github.com/ProcursusTeam/ldid.git ldid-src
          cd ldid-src
          make CXXFLAGS="-O2 -pipe" -j"$(sysctl -n hw.ncpu)"
          cp ldid ../ldid-bin/ldid
          chmod +x ../ldid-bin/ldid

      - name: Cache insert_dylib
        id: cache-insert-dylib
        uses: actions/cache@v4
        with:
          path: insert_dylib-bin
          key: insert_dylib-macos-arm64-v1

      - name: Build insert_dylib
        if: steps.cache-insert-dylib.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p insert_dylib-bin
          rm -rf /tmp/insert_dylib
          git clone --depth 1 https://github.com/tyilo/insert_dylib.git /tmp/insert_dylib
          cd /tmp/insert_dylib
          xcodebuild -project insert_dylib.xcodeproj -scheme insert_dylib -configuration Release SYMROOT="$PWD/build" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -5
          cp build/Release/insert_dylib "$GITHUB_WORKSPACE/insert_dylib-bin/insert_dylib"
          chmod +x "$GITHUB_WORKSPACE/insert_dylib-bin/insert_dylib"

      - name: Build Frida.framework
        run: |
          set -euo pipefail
          FW="$APP_DIR/Frameworks/Frida.framework"
          rm -rf "$FW"
          mkdir -p "$FW"
          cp W.thin.dylib "$FW/W.dylib"
          cp build/agent.js "$FW/agent.js"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '    <key>CFBundleExecutable</key>' \
            '    <string>W.dylib</string>' \
            '    <key>CFBundleIdentifier</key>' \
            '    <string>re.frida.gadget</string>' \
            '    <key>CFBundleShortVersionString</key>' \
            '    <string>17.19.0</string>' \
            '    <key>CFBundleVersion</key>' \
            '    <string>17.19.0</string>' \
            '    <key>CFBundleName</key>' \
            '    <string>Frida</string>' \
            '    <key>CFBundlePackageType</key>' \
            '    <string>FMWK</string>' \
            '    <key>CFBundleSupportedPlatforms</key>' \
            '    <array><string>iPhoneOS</string></array>' \
            '    <key>DTPlatformName</key>' \
            '    <string>iphoneos</string>' \
            '    <key>MinimumOSVersion</key>' \
            '    <string>12.0</string>' \
            '</dict>' \
            '</plist>' \
            > "$FW/Info.plist"
          printf '%s\n' \
            '{' \
            '  "interaction": {' \
            '    "type": "script",' \
            '    "path": "agent.js",' \
            '    "on_change": "ignore"' \
            '  },' \
            '  "code_signing": "required"' \
            '}' \
            > "$FW/W.config"
          plutil -lint "$FW/Info.plist"
          ls -la "$FW/"

      - name: Inject load command and fix rpath
        run: |
          set -euo pipefail
          cp "$BIN" "$BIN.orig"
          ./insert_dylib-bin/insert_dylib --weak --all-yes "@executable_path/Frameworks/Frida.framework/W.dylib" "$BIN.orig" "$BIN"
          chmod +x "$BIN"
          rm -f "$BIN.orig"
          install_name_tool -add_rpath "@executable_path/Frameworks" "$BIN" || echo "rpath already exists"
          otool -L "$BIN" | grep -i frida || echo "no frida dylib"
          otool -l "$BIN" | grep -A2 LC_RPATH | head -20 || echo "no LC_RPATH"

      - name: Sign
        run: |
          set -euo pipefail
          ./ldid-bin/ldid -S "$APP_DIR/Frameworks/Frida.framework/W.dylib"
          ./ldid-bin/ldid -S "$BIN"
          echo "signed"

      - name: Repack IPA
        run: |
          set -euo pipefail
          cd extract
          rm -f ../bs_patched.ipa
          zip -qry ../bs_patched.ipa Payload
          cd ..
          ls -la bs_patched.ipa
          file bs_patched.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: patched-brawl-ipa
          path: bs_patched.ipa
          retention-days: 30
          if-no-files-found: error