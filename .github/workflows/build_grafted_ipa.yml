name: Build Patched Nulls Brawl (with Frida.framework)

on:
  push:
    branches: [main]
    paths:
      - 'Nulls Brawl'
      - '.github/workflows/build-patched.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      FRIDA_VERSION: '17.19.0'
      GUM_GRAFT_VERSION: '17.19.0'
      LDID_VERSION: 'v2.1.5-procursus7'

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify local binary
        run: |
          set -euo pipefail
          test -f "Nulls Brawl"
          file "Nulls Brawl"
          stat -f%z "Nulls Brawl"

      - name: Cache Frida Gadget thin
        id: cache-gadget
        uses: actions/cache@v4
        with:
          path: W.thin.dylib
          key: frida-gadget-${{ env.FRIDA_VERSION }}-arm64-thin

      - name: Download and thin Frida Gadget
        if: steps.cache-gadget.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o gadget.xz "https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gadget-${FRIDA_VERSION}-ios-universal.dylib.xz"
          xz -d gadget.xz
          mv gadget W.fat.dylib
          lipo -thin arm64 -output W.thin.dylib W.fat.dylib
          rm -f W.fat.dylib
          echo "thin: $(stat -f%z W.thin.dylib)"

      - name: Cache gum-graft
        id: cache-gum-graft
        uses: actions/cache@v4
        with:
          path: gum-graft
          key: gum-graft-${{ env.GUM_GRAFT_VERSION }}-macos-arm64

      - name: Download gum-graft
        if: steps.cache-gum-graft.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o gum-graft.xz "https://github.com/frida/frida/releases/download/${GUM_GRAFT_VERSION}/gum-graft-${GUM_GRAFT_VERSION}-macos-arm64.xz"
          xz -d gum-graft.xz
          chmod +x gum-graft

      - name: Graft binary
        run: |
          set -euo pipefail
          cp "Nulls Brawl" "Nulls Brawl.orig"
          echo "before: $(stat -f%z "Nulls Brawl")"
          set +e
          ./gum-graft \
            -m \
            -i 0xd93d80 \
            -i 0xb24820 \
            -i 0xb24244 \
            -i 0x9b5afc \
            -i 0x62d890 \
            "Nulls Brawl" 2>&1 | tail -30
          rc=$?
          set -e
          echo "gum-graft exit code: $rc"
          echo "after: $(stat -f%z "Nulls Brawl")"
          otool -l "Nulls Brawl" | grep -iE "graft|__FRIDA" || echo "no graft sections"
          if [ "$rc" -ne 0 ]; then
            cp "Nulls Brawl.orig" "Nulls Brawl"
            echo "reverted to original (gum-graft failed)"
          fi

      - name: Install ldid runtime deps
        run: brew install pkg-config libplist openssl@3

      - uses: actions/cache@v4
        id: cache-ldid
        with:
          path: ldid-bin
          key: ldid-${{ env.LDID_VERSION }}-macos-arm64

      - name: Build ldid
        if: steps.cache-ldid.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ldid-bin
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          LIBPLIST_PREFIX=$(brew --prefix libplist)
          export PKG_CONFIG_PATH="$OPENSSL_PREFIX/lib/pkgconfig:$LIBPLIST_PREFIX/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export LDFLAGS="-L$OPENSSL_PREFIX/lib -L$LIBPLIST_PREFIX/lib"
          export CPPFLAGS="-I$OPENSSL_PREFIX/include -I$LIBPLIST_PREFIX/include"
          git clone --depth 1 --branch "${LDID_VERSION}" https://github.com/ProcursusTeam/ldid.git ldid-src 2>/dev/null || git clone --depth 1 https://github.com/ProcursusTeam/ldid.git ldid-src
          cd ldid-src
          make CXXFLAGS="-O2 -pipe" -j$(sysctl -n hw.ncpu)
          cp ldid ../ldid-bin/ldid
          chmod +x ../ldid-bin/ldid

      - name: Build Frida.framework
        run: |
          set -euo pipefail
          rm -rf Frida.framework
          mkdir -p Frida.framework
          cp W.thin.dylib Frida.framework/W.dylib
          cat > Frida.framework/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>W.dylib</string>
              <key>CFBundleIdentifier</key><string>re.frida.gadget</string>
              <key>CFBundleShortVersionString</key><string>17.19.0</string>
              <key>CFBundleVersion</key><string>17.19.0</string>
              <key>CFBundleName</key><string>Frida</string>
              <key>CFBundlePackageType</key><string>FMWK</string>
              <key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>
              <key>DTPlatformName</key><string>iphoneos</string>
              <key>MinimumOSVersion</key><string>12.0</string>
          </dict>
          </plist>
          PLIST
          cat > Frida.framework/W.config <<'CONFIG'
          {
            "interaction": {
              "type": "script",
              "path": "agent.js",
              "on_change": "ignore"
            },
            "code_signing": "required"
          }
          CONFIG
          cp scripts/frida-scripts/agent.js Frida.framework/agent.js
          plutil -lint Frida.framework/Info.plist

      - name: Inject load command
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/tyilo/insert_dylib.git /tmp/insert_dylib
          cd /tmp/insert_dylib
          xcodebuild -project insert_dylib.xcodeproj -scheme insert_dylib -configuration Release SYMROOT="$PWD/build" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -3
          /tmp/insert_dylib/build/Release/insert_dylib --weak --all-yes "@executable_path/Frameworks/Frida.framework/W.dylib" "Nulls Brawl" "Nulls Brawl.patched"
          mv "Nulls Brawl.patched" "Nulls Brawl"
          chmod +x "Nulls Brawl"
          otool -L "Nulls Brawl" | grep -i frida

      - name: Sign
        run: |
          set -euo pipefail
          ./ldid-bin/ldid -S Frida.framework/W.dylib
          ./ldid-bin/ldid -S "Nulls Brawl"

      - uses: actions/upload-artifact@v4
        with:
          name: patched-brawl
          path: |
            Nulls Brawl
            Frida.framework/
          retention-days: 30