name: Build Frida.framework

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25
    env:
      FRIDA_VERSION: '17.2.11'
      FRAMEWORK_NAME: Frida.framework
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Download Frida Gadget
        run: |
          set -euo pipefail
          URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gadget-${FRIDA_VERSION}-ios-universal.dylib.xz"
          curl -fL --retry 3 -o gadget.xz "$URL"
          xz -d gadget.xz
          mv gadget W.fat.dylib

      - name: Extract dev reference
        run: |
          set -euo pipefail
          REF=""
          for p in Frida/W.dylib.zip W.dylib.zip; do
            if [ -f "$p" ]; then REF="$p"; break; fi
          done
          [ -n "$REF" ] || { echo "::error::no dev reference"; exit 1; }
          mkdir -p dev
          unzip -o "$REF" -d dev > /dev/null
          DEV=$(find dev -type f -name "*.dylib" ! -path "*__MACOSX*" ! -name "._*" | head -1)
          cp "$DEV" W.dev.dylib
          lipo -thin arm64 -output W.dev.thin.dylib W.dev.dylib
          echo "dev thin: $(stat -f%z W.dev.thin.dylib)"
          echo "dev fat:  $(stat -f%z W.dev.dylib)"

      - name: Extract stock thin arm64
        run: |
          set -euo pipefail
          lipo -thin arm64 -output W.thin.dylib W.fat.dylib
          codesign --remove-signature W.thin.dylib 2>/dev/null || true
          echo "thin unsigned: $(stat -f%z W.thin.dylib)"

      - name: Build Frida.framework
        run: |
          set -euo pipefail
          rm -rf "$FRAMEWORK_NAME"
          mkdir -p "$FRAMEWORK_NAME"
          cp W.thin.dylib "$FRAMEWORK_NAME/W.dylib"
          cat > "$FRAMEWORK_NAME/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>W.dylib</string>
              <key>CFBundleIdentifier</key><string>re.frida.gadget</string>
              <key>CFBundleShortVersionString</key><string>17.2.11</string>
              <key>CFBundleVersion</key><string>17.2.11</string>
              <key>CFBundleName</key><string>Frida</string>
              <key>CFBundlePackageType</key><string>FMWK</string>
              <key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>
              <key>DTPlatformName</key><string>iphoneos</string>
              <key>MinimumOSVersion</key><string>12.0</string>
          </dict>
          </plist>
          PLIST
          cat > "$FRAMEWORK_NAME/W.config" << 'CONFIG'
          {
            "interaction": {"type": "script", "path": "agent.js", "on_change": "ignore"},
            "code_signing": "required"
          }
          CONFIG
          echo 'rpc.exports = { init: function () { return true; } };' > "$FRAMEWORK_NAME/agent.js"

      - name: Sign framework
        run: |
          set -euo pipefail
          codesign --force --sign - --timestamp=none "$FRAMEWORK_NAME"
          SZ=$(stat -f%z "$FRAMEWORK_NAME/W.dylib")
          TARGET=$(stat -f%z W.dev.thin.dylib)
          echo "signed thin: $SZ (target $TARGET, diff $((SZ - TARGET)))"
          if [ "$SZ" != "$TARGET" ]; then
            echo "::error::framework sign gave $SZ, expected $TARGET"
            exit 1
          fi

      - name: Copy signed thin
        run: |
          set -euo pipefail
          cp "$FRAMEWORK_NAME/W.dylib" W.thin.dylib
          echo "thin: $(stat -f%z W.thin.dylib)"

      - name: Wrap into fat
        run: |
          set -euo pipefail
          lipo -create -arch arm64 W.thin.dylib -output W.dylib
          echo "fat: $(stat -f%z W.dylib)"

      - name: Compare with dev
        run: |
          set -euo pipefail
          echo "dev:  $(stat -f%z W.dev.dylib)"
          echo "ours: $(stat -f%z W.dylib)"
          python3 - << 'PYEOF'
          with open("W.dev.dylib", "rb") as f: dev = f.read()
          with open("W.dylib", "rb") as f: ours = f.read()
          if len(dev) != len(ours):
              print("SIZE: dev=%d ours=%d diff=%d" % (len(dev), len(ours), len(ours)-len(dev)))
          n = min(len(dev), len(ours))
          diffs = [i for i in range(n) if dev[i] != ours[i]]
          print("diffs: %d" % len(diffs))
          for i in diffs[:60]:
              print("  off 0x%x: dev=%02x ours=%02x" % (i, dev[i], ours[i]))
          if not diffs and len(dev) == len(ours):
              print("PERFECT")
          else:
              ranges = []
              if diffs:
                  s = diffs[0]
                  p = diffs[0]
                  for i in diffs[1:]:
                      if i - p > 64:
                          ranges.append((s, p))
                          s = i
                      p = i
                  ranges.append((s, p))
              print("diff ranges:")
              for s, e in ranges[:20]:
                  print("  0x%x - 0x%x (%d bytes)" % (s, e, e - s + 1))
          PYEOF

      - name: Update framework with final dylib
        run: |
          set -euo pipefail
          cp W.dylib "$FRAMEWORK_NAME/W.dylib"

      - name: Package
        run: |
          set -euo pipefail
          find "$FRAMEWORK_NAME" -name ".DS_Store" -delete
          find "$FRAMEWORK_NAME" -name "._*" -delete
          xattr -cr "$FRAMEWORK_NAME" 2>/dev/null || true
          ditto -c -k --sequesterRsrc --keepParent "$FRAMEWORK_NAME" Frida.framework.zip
          shasum -a 256 Frida.framework.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Frida.framework
          path: Frida.framework.zip
          retention-days: 30
          if-no-files-found: error