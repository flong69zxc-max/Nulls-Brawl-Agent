name: Build Frida.framework with gum-graft

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build_grafted_ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      FRIDA_VERSION: '17.2.11'
      FRAMEWORK_NAME: Frida.framework

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build deps
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install node@22 meson ninja pkg-config glib || true
          brew link --overwrite --force node@22
          echo "/opt/homebrew/opt/node@22/bin" >> "$GITHUB_PATH"
          python3 -m venv "$HOME/pyenv"
          source "$HOME/pyenv/bin/activate"
          python3 -m pip install --upgrade pip setuptools
          node --version && meson --version && ninja --version

      - name: Cache Frida source and build
        id: cache-frida
        uses: actions/cache@v4
        with:
          path: frida-src
          key: frida-src-${{ env.FRIDA_VERSION }}-v7
          restore-keys: |
            frida-src-${{ env.FRIDA_VERSION }}-

      - name: Clone Frida
        if: steps.cache-frida.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch ${FRIDA_VERSION} https://github.com/frida/frida.git frida-src || \
          git clone --depth 1 https://github.com/frida/frida.git frida-src
          cd frida-src
          git submodule update --init --recursive --depth 1

      - name: Configure (gum only, no tools, no helper)
        run: |
          set -euo pipefail
          source "$HOME/pyenv/bin/activate"
          cd frida-src
          [ -f build/build.ninja ] && exit 0
          ./configure --host=macos-arm64 -- -Dfrida-gum:graft_tool=enabled -Dfrida-gum:gumjs=disabled -Dfrida-gum:tests=disabled

      - name: List available targets
        run: |
          set -euo pipefail
          source "$HOME/pyenv/bin/activate"
          cd frida-src/build
          echo "=== graft/gum targets ==="
          ninja -t targets all 2>/dev/null | grep -iE "graft|gum" | head -40 || true

      - name: Build gum-graft
        run: |
          set -euo pipefail
          source "$HOME/pyenv/bin/activate"
          cd frida-src/build
          # Пробуем разные имена таргета
          for t in "gum-graft" "graft" "frida-gum-graft" "subprojects/frida-gum/tools/gum-graft"; do
            if ninja -t targets all 2>/dev/null | grep -q "$t"; then
              echo "building target: $t"
              ninja "$t" 2>&1 | tail -60
              exit 0
            fi
          done
          echo "specific target not found, building gum library"
          ninja frida-gum 2>&1 | tail -60

      - name: Locate gum-graft
        run: |
          set -euo pipefail
          GUM_GRAFT=$(find frida-src -type f -name "gum-graft" | head -1)
          if [ -z "$GUM_GRAFT" ]; then
            echo "::error::gum-graft not found"
            echo "=== all graft files ==="
            find frida-src -type f -iname "*graft*" || true
            echo "=== bin dirs ==="
            find frida-src -type d -name bin -exec ls -la {} \; || true
            exit 1
          fi
          chmod +x "$GUM_GRAFT"
          echo "GUM_GRAFT=$(realpath $GUM_GRAFT)" >> "$GITHUB_ENV"
          echo "found: $(realpath $GUM_GRAFT)"
          "$GUM_GRAFT" --help 2>&1 | head -20 || true

      - name: Download Frida Gadget
        run: |
          set -euo pipefail
          URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gadget-${FRIDA_VERSION}-ios-universal.dylib.xz"
          curl -fL --retry 3 -o gadget.dylib.xz "$URL"
          xz -d gadget.dylib.xz
          mv gadget.dylib W.stock.dylib
          lipo -thin arm64 -output W.thin.dylib W.stock.dylib
          file W.thin.dylib

      - name: Run gum-graft
        run: |
          set -euo pipefail
          "$GUM_GRAFT" --ingest-function-starts W.thin.dylib
          file W.thin.dylib
          echo "grafted size: $(stat -f%z W.thin.dylib) bytes"
          otool -l W.thin.dylib | grep -i graft || echo "no graft sections found"

      - name: Assemble Frida.framework
        run: |
          set -euo pipefail
          rm -rf "$FRAMEWORK_NAME"
          mkdir -p "$FRAMEWORK_NAME"
          cp W.thin.dylib "$FRAMEWORK_NAME/W.dylib"
          cat > "$FRAMEWORK_NAME/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>W.dylib</string>
              <key>CFBundleIdentifier</key><string>re.frida.gadget</string>
              <key>CFBundleShortVersionString</key><string>17.2.11</string>
              <key>CFBundleVersion</key><string>17.2.11</string>
              <key>CFBundleName</key><string>Frida</string>
              <key>CFBundlePackageType</key><string>FMWK</string>
              <key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>
              <key>DTPlatformName</key><string>iphoneos</string>
              <key>MinimumOSVersion</key><string>12.0</string>
          </dict>
          </plist>
          PLIST
          cat > "$FRAMEWORK_NAME/W.config" << 'CONFIG'
          {
            "interaction": {"type": "script", "path": "agent.js", "on_change": "ignore"},
            "code_signing": "required"
          }
          CONFIG
          echo 'rpc.exports = { init: function () { return true; } };' > "$FRAMEWORK_NAME/agent.js"
          plutil -lint "$FRAMEWORK_NAME/Info.plist"

      - name: Sign
        run: |
          set -euo pipefail
          brew install ldid || true
          command -v ldid >/dev/null && ldid -S "$FRAMEWORK_NAME/W.dylib"

      - name: Package
        run: |
          set -euo pipefail
          find "$FRAMEWORK_NAME" -name ".DS_Store" -delete
          find "$FRAMEWORK_NAME" -name "._*" -delete
          xattr -cr "$FRAMEWORK_NAME" 2>/dev/null || true
          zip -r -X "$FRAMEWORK_NAME.zip" "$FRAMEWORK_NAME" -x "*.DS_Store" -x "__MACOSX/*" -x "*/._*"
          shasum -a 256 "$FRAMEWORK_NAME.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Frida.framework
          path: |
            Frida.framework.zip
            Frida.framework.zip.sha256
          retention-days: 30
          if-no-files-found: error