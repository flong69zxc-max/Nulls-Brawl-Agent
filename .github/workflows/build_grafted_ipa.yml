name: Build Patched Frida Framework

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build_grafted_ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      FRIDA_VERSION: '17.9.7'
      FRAMEWORK_NAME: Frida.framework

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Frida Gadget
        run: |
          set -euo pipefail
          URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gadget-${FRIDA_VERSION}-ios-universal.dylib.xz"
          curl -fL --retry 3 -o gadget.dylib.xz "$URL"
          xz -d gadget.dylib.xz
          mv gadget.dylib W.stock.dylib
          file W.stock.dylib
          lipo -info W.stock.dylib

      - name: Analyze and patch
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import subprocess, re, sys

          PATTERN_BRK539 = bytes.fromhex("20A720D4")
          PATTERN_BRK1   = bytes.fromhex("200020D4")
          NOP            = bytes.fromhex("1F2003D5")
          RET            = bytes.fromhex("C0035FD6")

          with open("W.stock.dylib", "rb") as f:
              data = bytearray(f.read())

          stock_brk539 = bytes(data).count(PATTERN_BRK539)
          stock_brk1   = bytes(data).count(PATTERN_BRK1)
          stock_nop    = bytes(data).count(NOP)
          print(f"[stock] BRK #0x539={stock_brk539} BRK #1={stock_brk1} NOP={stock_nop}")

          # --- BRK patches ---
          patched_brk539 = 0
          idx = 0
          while True:
              idx = data.find(PATTERN_BRK539, idx)
              if idx == -1:
                  break
              data[idx:idx+4] = NOP
              patched_brk539 += 1
              idx += 4

          patched_brk1 = 0
          idx = 0
          while True:
              idx = data.find(PATTERN_BRK1, idx)
              if idx == -1:
                  break
              data[idx:idx+4] = NOP
              patched_brk1 += 1
              idx += 4

          # --- parse otool -Iv for __stubs entries named _abort ---
          out_iv = subprocess.run(["otool", "-Iv", "W.stock.dylib"],
                                  capture_output=True, text=True).stdout

          abort_stub_vm_addrs = []
          in_stubs = False
          for line in out_iv.splitlines():
              if line.startswith("Indirect symbols for"):
                  m = re.search(r'\(([^,]+),([^)]+)\)', line)
                  if m:
                      in_stubs = (m.group(2) == "__stubs")
                  continue
              if in_stubs:
                  parts = line.split()
                  if len(parts) >= 3:
                      try:
                          addr = int(parts[0], 16)
                          name = parts[2]
                          if name == "_abort":
                              abort_stub_vm_addrs.append(addr)
                      except ValueError:
                          pass

          print(f"[stubs] abort VM addrs: {[hex(a) for a in abort_stub_vm_addrs]}")

          # --- parse otool -l for __TEXT,__stubs section: vmaddr + file offset ---
          out_l = subprocess.run(["otool", "-l", "W.stock.dylib"],
                                 capture_output=True, text=True).stdout

          stubs_vmaddr = None
          stubs_fileoff = None
          stubs_size = None

          lines = out_l.splitlines()
          for i, line in enumerate(lines):
              if "sectname __stubs" in line:
                  for j in range(i, min(i + 10, len(lines))):
                      l = lines[j].strip()
                      m_addr = re.match(r'addr\s+(0x[0-9a-fA-F]+)', l)
                      m_off  = re.match(r'offset\s+(\d+)', l)
                      m_size = re.match(r'size\s+(0x[0-9a-fA-F]+)', l)
                      if m_addr:
                          stubs_vmaddr = int(m_addr.group(1), 16)
                      if m_off:
                          stubs_fileoff = int(m_off.group(1))
                      if m_size:
                          stubs_size = int(m_size.group(1), 16)
                  break

          print(f"[stubs] vmaddr={hex(stubs_vmaddr) if stubs_vmaddr else None} "
                f"fileoff={stubs_fileoff} size={hex(stubs_size) if stubs_size else None}")

          patched_abort = 0
          if stubs_vmaddr is not None and stubs_fileoff is not None:
              for vm in abort_stub_vm_addrs:
                  file_off = stubs_fileoff + (vm - stubs_vmaddr)
                  if 0 <= file_off <= len(data) - 4:
                      data[file_off:file_off+4] = RET
                      patched_abort += 1
                      print(f"[patch] abort stub at file 0x{file_off:x} -> RET")
          else:
              print("[patch] __stubs section not found, skipping abort patch")

          print(f"[patched] BRK #0x539={patched_brk539} BRK #1={patched_brk1} abort_stubs={patched_abort}")

          with open("W.full-patched.dylib", "wb") as f:
              f.write(data)

          final_data = bytes(data)
          final_brk539 = final_data.count(PATTERN_BRK539)
          final_brk1   = final_data.count(PATTERN_BRK1)
          final_nop    = final_data.count(NOP)
          final_ret    = final_data.count(RET)
          print(f"[final] BRK #0x539={final_brk539} BRK #1={final_brk1} NOP={final_nop} RET={final_ret}")

          errors = []
          if final_brk539 != 0:
              errors.append(f"BRK #0x539 still present: {final_brk539}")
          if final_brk1 != 0:
              errors.append(f"BRK #1 still present: {final_brk1}")
          if stock_brk539 == 0 and stock_brk1 == 0:
              errors.append("no BRKs found in stock binary")
          expected_nop_min = stock_nop + stock_brk539 + stock_brk1
          if final_nop < expected_nop_min:
              errors.append(f"NOP count {final_nop} < expected {expected_nop_min}")
          if patched_abort == 0:
              errors.append("no abort stub patched — check otool -Iv output")

          with open("patch-report.txt", "w") as f:
              f.write(f"stock_brk539={stock_brk539}\n")
              f.write(f"stock_brk1={stock_brk1}\n")
              f.write(f"stock_nop={stock_nop}\n")
              f.write(f"patched_brk539={patched_brk539}\n")
              f.write(f"patched_brk1={patched_brk1}\n")
              f.write(f"patched_abort={patched_abort}\n")
              f.write(f"final_brk539={final_brk539}\n")
              f.write(f"final_brk1={final_brk1}\n")
              f.write(f"final_nop={final_nop}\n")
              f.write(f"final_ret={final_ret}\n")

          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)

          print("OK: all patches verified")
          PYEOF
          file W.full-patched.dylib

      - name: Show patch report
        run: |
          set -euo pipefail
          cat patch-report.txt
          file W.full-patched.dylib | grep -q arm64
          echo "arm64 OK"

      - name: Assemble Frida.framework
        run: |
          set -euo pipefail
          rm -rf "$FRAMEWORK_NAME"
          mkdir -p "$FRAMEWORK_NAME"
          cp W.full-patched.dylib "$FRAMEWORK_NAME/W.dylib"

          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '    <key>CFBundleDevelopmentRegion</key>' \
            '    <string>en</string>' \
            '    <key>CFBundleDisplayName</key>' \
            '    <string>Frida</string>' \
            '    <key>CFBundleExecutable</key>' \
            '    <string>W.dylib</string>' \
            '    <key>CFBundleIdentifier</key>' \
            '    <string>re.frida.gadget</string>' \
            '    <key>CFBundleInfoDictionaryVersion</key>' \
            '    <string>6.0</string>' \
            '    <key>CFBundleName</key>' \
            '    <string>Frida</string>' \
            '    <key>CFBundlePackageType</key>' \
            '    <string>FMWK</string>' \
            '    <key>CFBundleSignature</key>' \
            '    <string>????</string>' \
            '    <key>CFBundleSupportedPlatforms</key>' \
            '    <array>' \
            '        <string>iPhoneOS</string>' \
            '    </array>' \
            '    <key>CFBundleVersion</key>' \
            '    <string>17.9.7</string>' \
            '    <key>CFBundleShortVersionString</key>' \
            '    <string>17.9.7</string>' \
            '    <key>DTPlatformName</key>' \
            '    <string>iphoneos</string>' \
            '    <key>MinimumOSVersion</key>' \
            '    <string>12.0</string>' \
            '    <key>UIRequiredDeviceCapabilities</key>' \
            '    <array>' \
            '        <string>arm64</string>' \
            '    </array>' \
            '</dict>' \
            '</plist>' \
            > "$FRAMEWORK_NAME/Info.plist"

          printf '%s\n' \
            '{' \
            '  "interaction": {' \
            '    "type": "script",' \
            '    "path": "agent.js",' \
            '    "on_change": "ignore"' \
            '  },' \
            '  "code_signing": "required"' \
            '}' \
            > "$FRAMEWORK_NAME/W.config"

          printf '%s\n' 'rpc.exports = { init: function () { return true; } };' > "$FRAMEWORK_NAME/agent.js"

          plutil -lint "$FRAMEWORK_NAME/Info.plist"
          find "$FRAMEWORK_NAME" -type f | sort

      - name: Sign framework
        run: |
          set -euo pipefail
          brew install ldid || true
          if command -v ldid >/dev/null; then
            ldid -S "$FRAMEWORK_NAME/W.dylib"
            echo "signed W.dylib"
            codesign -dvv "$FRAMEWORK_NAME/W.dylib" 2>&1 | head -5 || true
          fi

      - name: Final verification
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          with open("Frida.framework/W.dylib", "rb") as f:
              data = f.read()
          brk539 = data.count(bytes.fromhex("20A720D4"))
          brk1   = data.count(bytes.fromhex("200020D4"))
          ret    = data.count(bytes.fromhex("C0035FD6"))
          print(f"final BRK #0x539={brk539} BRK #1={brk1} RET={ret}")
          if brk539 or brk1:
              raise SystemExit("patches missing in final W.dylib")
          print("OK: final W.dylib verified")
          PYEOF

      - name: Package
        run: |
          set -euo pipefail
          zip -r "$FRAMEWORK_NAME.zip" "$FRAMEWORK_NAME"
          shasum -a 256 "$FRAMEWORK_NAME.zip" | tee "$FRAMEWORK_NAME.zip.sha256"

      - name: Summary
        run: |
          set -euo pipefail
          {
            echo "### patched frida framework"
            echo ""
            echo "| param | value |"
            echo "|---|---|"
            echo "| frida | ${FRIDA_VERSION} |"
            echo "| patches | BRK #0x539, BRK #1, abort stub -> RET |"
            echo "| arch | arm64 |"
            echo "| dylib size | $(stat -f%z $FRAMEWORK_NAME/W.dylib) B |"
            echo "| sha256 | \`$(shasum -a 256 $FRAMEWORK_NAME.zip | cut -c1-16)\` |"
            echo ""
            echo '```'
            cat patch-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Frida.framework
          path: |
            Frida.framework.zip
            Frida.framework.zip.sha256
            patch-report.txt
          retention-days: 30
          if-no-files-found: error