name: Build Frida.framework with gum-graft

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build_grafted_ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      FRIDA_VERSION: '17.2.11'
      FRAMEWORK_NAME: Frida.framework

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build deps
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install node@22 meson ninja pkg-config glib || true
          brew link --overwrite --force node@22
          echo "/opt/homebrew/opt/node@22/bin" >> "$GITHUB_PATH"
          python3 -m venv "$HOME/pyenv"
          source "$HOME/pyenv/bin/activate"
          python3 -m pip install --upgrade pip setuptools
          node --version && meson --version && ninja --version

      - name: Cache frida-gum source and build
        id: cache-gum
        uses: actions/cache@v4
        with:
          path: frida-gum
          key: frida-gum-${{ env.FRIDA_VERSION }}-v1
          restore-keys: |
            frida-gum-${{ env.FRIDA_VERSION }}-

      - name: Clone frida-gum
        if: steps.cache-gum.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch ${FRIDA_VERSION} \
            https://github.com/frida/frida-gum.git frida-gum || \
          git clone --depth 1 https://github.com/frida/frida-gum.git frida-gum
          cd frida-gum
          git submodule update --init --recursive --depth 1

      - name: Configure frida-gum with graft tool
        run: |
          set -euo pipefail
          source "$HOME/pyenv/bin/activate"
          cd frida-gum
          [ -f build/build.ninja ] && exit 0
          ./configure --host=macos-arm64 -- -Dgraft_tool=enabled

      - name: List targets
        run: |
          set -euo pipefail
          source "$HOME/pyenv/bin/activate"
          cd frida-gum/build
          ninja -t targets all 2>/dev/null | grep -iE "graft" | head -20 || true

      - name: Build gum-graft
        run: |
          set -euo pipefail
          source "$HOME/pyenv/bin/activate"
          cd frida-gum/build
          if ninja -t targets all 2>/dev/null | grep -q "gum-graft"; then
            ninja gum-graft 2>&1 | tail -60
          elif ninja -t targets all 2>/dev/null | grep -q "graft"; then
            TARGET=$(ninja -t targets all | grep -i graft | head -1 | cut -d: -f1)
            echo "building target: $TARGET"
            ninja "$TARGET" 2>&1 | tail -60
          else
            echo "::error::no graft target found"
            ninja -t targets all | grep -i gum | head -30
            exit 1
          fi

      - name: Locate gum-graft
        run: |
          set -euo pipefail
          GUM_GRAFT=$(find frida-gum -type f -name "gum-graft" -perm +111 | head -1)
          if [ -z "$GUM_GRAFT" ]; then
            echo "::error::gum-graft binary not found"
            find frida-gum -type f -iname "*graft*" || true
            find frida-gum/build -type f -perm +111 | head -20 || true
            exit 1
          fi
          chmod +x "$GUM_GRAFT"
          echo "GUM_GRAFT=$(realpath $GUM_GRAFT)" >> "$GITHUB_ENV"
          echo "found: $(realpath $GUM_GRAFT)"
          "$GUM_GRAFT" --help 2>&1 | head -20 || true

      - name: Download Frida Gadget
        run: |
          set -euo pipefail
          URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gadget-${FRIDA_VERSION}-ios-universal.dylib.xz"
          curl -fL --retry 3 -o gadget.dylib.xz "$URL"
          xz -d gadget.dylib.xz
          mv gadget.dylib W.stock.dylib
          file W.stock.dylib
          lipo -thin arm64 -output W.thin.dylib W.stock.dylib
          file W.thin.dylib
          echo "thin size: $(stat -f%z W.thin.dylib) bytes"

      - name: Run gum-graft
        run: |
          set -euo pipefail
          "$GUM_GRAFT" --ingest-function-starts W.thin.dylib
          echo "=== after grafting ==="
          file W.thin.dylib
          echo "grafted size: $(stat -f%z W.thin.dylib) bytes"
          otool -l W.thin.dylib | grep -i graft || echo "no graft sections found"

      - name: Assemble Frida.framework
        run: |
          set -euo pipefail
          rm -rf "$FRAMEWORK_NAME"
          mkdir -p "$FRAMEWORK_NAME"
          cp W.thin.dylib "$FRAMEWORK_NAME/W.dylib"

          cat > "$FRAMEWORK_NAME/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>W.dylib</string>
              <key>CFBundleIdentifier</key><string>re.frida.gadget</string>
              <key>CFBundleShortVersionString</key><string>17.2.11</string>
              <key>CFBundleVersion</key><string>17.2.11</string>
              <key>CFBundleName</key><string>Frida</string>
              <key>CFBundlePackageType</key><string>FMWK</string>
              <key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>
              <key>DTPlatformName</key><string>iphoneos</string>
              <key>MinimumOSVersion</key><string>12.0</string>
          </dict>
          </plist>
          PLIST

          cat > "$FRAMEWORK_NAME/W.config" << 'CONFIG'
          {
            "interaction": {
              "type": "script",
              "path": "agent.js",
              "on_change": "ignore"
            },
            "code_signing": "required"
          }
          CONFIG

          echo 'rpc.exports = { init: function () { return true; } };' > "$FRAMEWORK_NAME/agent.js"
          plutil -lint "$FRAMEWORK_NAME/Info.plist"
          find "$FRAMEWORK_NAME" -type f | sort

      - name: Sign
        run: |
          set -euo pipefail
          brew install ldid || true
          command -v ldid >/dev/null && ldid -S "$FRAMEWORK_NAME/W.dylib"

      - name: Package
        run: |
          set -euo pipefail
          find "$FRAMEWORK_NAME" -name ".DS_Store" -delete
          find "$FRAMEWORK_NAME" -name "._*" -delete
          xattr -cr "$FRAMEWORK_NAME" 2>/dev/null || true
          zip -r -X "$FRAMEWORK_NAME.zip" "$FRAMEWORK_NAME" \
            -x "*.DS_Store" -x "__MACOSX/*" -x "*/._*"
          shasum -a 256 "$FRAMEWORK_NAME.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Frida.framework
          path: |
            Frida.framework.zip
            Frida.framework.zip.sha256
          retention-days: 30
          if-no-files-found: error