name: Build Frida.framework (gum-graft patched)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      FRIDA_VERSION: '17.19.0'
      FRAMEWORK_NAME: Frida.framework
      LDID_VERSION: 'v2.1.5-procursus7'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Download Frida Gadget
        run: |
          set -euo pipefail
          URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gadget-${FRIDA_VERSION}-ios-universal.dylib.xz"
          curl -fL --retry 3 -o gadget.xz "$URL"
          xz -d gadget.xz
          mv gadget W.fat.dylib
          lipo -thin arm64 -output W.thin.dylib W.fat.dylib
          echo "thin before: $(stat -f%z W.thin.dylib)"

      - name: Download gum-graft
        run: |
          set -euo pipefail
          URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/gum-graft-${FRIDA_VERSION}-macos-arm64.xz"
          curl -fL --retry 3 -o gum-graft.xz "$URL"
          xz -d gum-graft.xz
          chmod +x gum-graft
          file gum-graft
          echo "=== HELP ==="
          ./gum-graft --help 2>&1 | tee /tmp/help.txt
          echo "GUM_GRAFT=$(realpath gum-graft)" >> "$GITHUB_ENV"

      - name: Remove signature
        run: |
          set -euo pipefail
          codesign --remove-signature W.thin.dylib 2>&1 || true
          echo "unsigned thin: $(stat -f%z W.thin.dylib)"

      - name: Try graft variants on thin
        id: graft-thin
        run: |
          set -euo pipefail
          cp W.thin.dylib W.thin.orig.dylib
          SIZE0=$(stat -f%z W.thin.dylib)
          FOUND=0

          try() {
            local name="$1"; shift
            cp W.thin.orig.dylib W.thin.test.dylib
            echo "--- $name ---"
            if "$GUM_GRAFT" "$@" 2>&1 | tee "/tmp/graft-$name.log"; then
              local sz=$(stat -f%z W.thin.test.dylib)
              if [ "$sz" != "$SIZE0" ]; then
                echo "  CHANGED: $SIZE0 -> $sz"
                cp W.thin.test.dylib W.thin.dylib
                FOUND=1
                return 0
              else
                echo "  no change ($sz)"
              fi
            else
              echo "  FAILED"
            fi
            return 1
          }

          # Перебираем варианты
          try "ingest-fn-before" --ingest-function-starts W.thin.test.dylib || true
          [ "$FOUND" = "1" ] && exit 0 || true

          try "ingest-fn-after" W.thin.test.dylib --ingest-function-starts || true
          [ "$FOUND" = "1" ] && exit 0 || true

          try "ingest-imports" --ingest-imports W.thin.test.dylib || true
          [ "$FOUND" = "1" ] && exit 0 || true

          try "transform-lazy" --transform-lazy-binds W.thin.test.dylib || true
          [ "$FOUND" = "1" ] && exit 0 || true

          try "all-flags" --ingest-function-starts --ingest-imports --transform-lazy-binds W.thin.test.dylib || true
          [ "$FOUND" = "1" ] && exit 0 || true

          try "short-i" -i W.thin.test.dylib || true
          [ "$FOUND" = "1" ] && exit 0 || true

          try "all" --all W.thin.test.dylib || true
          [ "$FOUND" = "1" ] && exit 0 || true

          echo "no variant changed the file"
          echo "thin after all attempts: $(stat -f%z W.thin.dylib)"

      - name: Try graft on fat
        if: steps.graft-thin.outcome == 'success' && hashFiles('W.thin.dylib') == ''
        run: |
          echo "thin graft failed, trying fat"
          set -euo pipefail
          codesign --remove-signature W.fat.dylib 2>&1 || true
          SIZE0=$(stat -f%z W.fat.dylib)
          cp W.fat.dylib W.fat.orig.dylib
          for flag in "--ingest-function-starts" "--ingest-imports" "--transform-lazy-binds" "--all"; do
            cp W.fat.orig.dylib W.fat.test.dylib
            if "$GUM_GRAFT" $flag W.fat.test.dylib >/dev/null 2>&1; then
              SZ=$(stat -f%z W.fat.test.dylib)
              if [ "$SZ" != "$SIZE0" ]; then
                echo "fat changed with $flag: $SIZE0 -> $SZ"
                cp W.fat.test.dylib W.fat.dylib
                lipo -thin arm64 -output W.thin.dylib W.fat.dylib
                exit 0
              fi
            fi
          done
          echo "fat graft also failed"

      - name: Install ldid-procursus
        run: |
          set -euo pipefail
          sudo rm -f /usr/local/bin/ldid /opt/homebrew/bin/ldid /usr/bin/ldid 2>/dev/null || true
          brew uninstall ldid 2>/dev/null || true
          brew uninstall ldid-procursus 2>/dev/null || true
          brew install pkg-config libplist openssl@3
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          LIBPLIST_PREFIX=$(brew --prefix libplist)
          export PKG_CONFIG_PATH="$OPENSSL_PREFIX/lib/pkgconfig:$LIBPLIST_PREFIX/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export LDFLAGS="-L$OPENSSL_PREFIX/lib -L$LIBPLIST_PREFIX/lib"
          export CPPFLAGS="-I$OPENSSL_PREFIX/include -I$LIBPLIST_PREFIX/include"
          rm -rf ldid-src
          git clone --depth 1 --branch "${LDID_VERSION}" https://github.com/ProcursusTeam/ldid.git ldid-src 2>/dev/null || git clone --depth 1 https://github.com/ProcursusTeam/ldid.git ldid-src
          cd ldid-src
          make CXXFLAGS="-O2 -pipe"
          sudo cp ldid /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid
          [ -e /opt/homebrew/bin/ldid ] && sudo rm -f /opt/homebrew/bin/ldid || true
          [ -e /usr/bin/ldid ] && sudo rm -f /usr/bin/ldid || true
          /usr/local/bin/ldid -v 2>&1 | head -1 || true

      - name: Sign thin
        run: |
          set -euo pipefail
          /usr/local/bin/ldid -S W.thin.dylib
          echo "signed: $(stat -f%z W.thin.dylib)"

      - name: Wrap into fat
        run: |
          set -euo pipefail
          lipo -create -arch arm64 W.thin.dylib -output W.dylib
          echo "fat: $(stat -f%z W.dylib)"

      - name: Build Frida.framework
        run: |
          set -euo pipefail
          rm -rf "$FRAMEWORK_NAME"
          mkdir -p "$FRAMEWORK_NAME"
          cp W.dylib "$FRAMEWORK_NAME/W.dylib"

          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '    <key>CFBundleExecutable</key>' \
            '    <string>W.dylib</string>' \
            '    <key>CFBundleIdentifier</key>' \
            '    <string>re.frida.gadget</string>' \
            '    <key>CFBundleShortVersionString</key>' \
            '    <string>17.19.0</string>' \
            '    <key>CFBundleVersion</key>' \
            '    <string>17.19.0</string>' \
            '    <key>CFBundleName</key>' \
            '    <string>Frida</string>' \
            '    <key>CFBundlePackageType</key>' \
            '    <string>FMWK</string>' \
            '    <key>CFBundleSupportedPlatforms</key>' \
            '    <array>' \
            '        <string>iPhoneOS</string>' \
            '    </array>' \
            '    <key>DTPlatformName</key>' \
            '    <string>iphoneos</string>' \
            '    <key>MinimumOSVersion</key>' \
            '    <string>12.0</string>' \
            '</dict>' \
            '</plist>' \
            > "$FRAMEWORK_NAME/Info.plist"

          printf '%s\n' \
            '{' \
            '  "interaction": {' \
            '    "type": "script",' \
            '    "path": "agent.js",' \
            '    "on_change": "ignore"' \
            '  },' \
            '  "code_signing": "required"' \
            '}' \
            > "$FRAMEWORK_NAME/W.config"

          printf '%s\n' 'rpc.exports = { init: function () { return true; } };' > "$FRAMEWORK_NAME/agent.js"
          plutil -lint "$FRAMEWORK_NAME/Info.plist"

      - name: Package
        run: |
          set -euo pipefail
          find "$FRAMEWORK_NAME" -name ".DS_Store" -delete
          find "$FRAMEWORK_NAME" -name "._*" -delete
          xattr -cr "$FRAMEWORK_NAME" 2>/dev/null || true
          ditto -c -k --sequesterRsrc --keepParent "$FRAMEWORK_NAME" Frida.framework.zip
          shasum -a 256 Frida.framework.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Frida.framework-and-logs
          path: |
            Frida.framework.zip
            /tmp/help.txt
            /tmp/graft-*.log
          retention-days: 30
          if-no-files-found: warn