name: Build Frida.framework

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25
    env:
      FRIDA_VERSION: '17.2.11'
      FRAMEWORK_NAME: Frida.framework
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Download Frida Gadget
        run: |
          set -euo pipefail
          URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gadget-${FRIDA_VERSION}-ios-universal.dylib.xz"
          curl -fL --retry 3 -o gadget.xz "$URL"
          xz -d gadget.xz
          mv gadget W.fat.dylib

      - name: Extract stock thin arm64
        run: |
          set -euo pipefail
          lipo -thin arm64 -output W.thin.dylib W.fat.dylib
          codesign --remove-signature W.thin.dylib 2>/dev/null || true
          echo "thin unsigned: $(stat -f%z W.thin.dylib)"

      - name: Build Frida.framework
        run: |
          set -euo pipefail
          rm -rf "$FRAMEWORK_NAME"
          mkdir -p "$FRAMEWORK_NAME"
          cp W.thin.dylib "$FRAMEWORK_NAME/W.dylib"

          cat > "$FRAMEWORK_NAME/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>W.dylib</string>
              <key>CFBundleIdentifier</key><string>re.frida.gadget</string>
              <key>CFBundleShortVersionString</key><string>17.2.11</string>
              <key>CFBundleVersion</key><string>17.2.11</string>
              <key>CFBundleName</key><string>Frida</string>
              <key>CFBundlePackageType</key><string>FMWK</string>
              <key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>
              <key>DTPlatformName</key><string>iphoneos</string>
              <key>MinimumOSVersion</key><string>12.0</string>
          </dict>
          </plist>
          PLIST

          cat > "$FRAMEWORK_NAME/W.config" << 'CONFIG'
          {
            "interaction": {"type": "script", "path": "agent.js", "on_change": "ignore"},
            "code_signing": "required"
          }
          CONFIG

          echo 'rpc.exports = { init: function () { return true; } };' > "$FRAMEWORK_NAME/agent.js"

      - name: Sign framework ad-hoc
        run: |
          set -euo pipefail
          codesign --force --sign - --timestamp=none "$FRAMEWORK_NAME"
          SZ=$(stat -f%z "$FRAMEWORK_NAME/W.dylib")
          echo "signed thin: $SZ (expected 19006592)"
          if [ "$SZ" != "19006592" ]; then
            echo "::error::signed thin is $SZ, expected 19006592"
            exit 1
          fi

      - name: Copy signed thin and wrap fat
        run: |
          set -euo pipefail
          cp "$FRAMEWORK_NAME/W.dylib" W.thin.signed.dylib
          lipo -create -arch arm64 W.thin.signed.dylib -output W.dylib
          echo "fat: $(stat -f%z W.dylib) (expected 19022976)"
          if [ "$(stat -f%z W.dylib)" != "19022976" ]; then
            echo "::error::fat size mismatch"
            exit 1
          fi

      - name: Update framework with fat dylib
        run: |
          set -euo pipefail
          cp W.dylib "$FRAMEWORK_NAME/W.dylib"

      - name: Verify with dev reference
        run: |
          set -euo pipefail
          REF=""
          for p in Frida/W.dylib.zip W.dylib.zip; do
            if [ -f "$p" ]; then REF="$p"; break; fi
          done
          if [ -z "$REF" ]; then
            echo "no dev reference, skipping"
            exit 0
          fi
          mkdir -p dev
          unzip -o "$REF" -d dev > /dev/null
          DEV=$(find dev -type f -name "*.dylib" ! -path "*__MACOSX*" ! -name "._*" | head -1)
          cp "$DEV" W.dev.dylib

          echo "=== sizes ==="
          echo "dev:  $(stat -f%z W.dev.dylib)"
          echo "ours: $(stat -f%z W.dylib)"

          python3 - << 'PYEOF'
          import struct

          def get_code_sig(path):
              with open(path, "rb") as f:
                  d = f.read()
              magic = struct.unpack_from(">I", d, 0)[0]
              if magic == 0xcafebabe:
                  nfat = struct.unpack_from(">I", d, 4)[0]
                  for i in range(nfat):
                      base = 8 + i * 20
                      cputype = struct.unpack_from(">I", d, base)[0]
                      offset = struct.unpack_from(">I", d, base + 8)[0]
                      if cputype == 0x0100000c:
                          slice_off = offset
                          break
              else:
                  slice_off = 0
              ncmds = struct.unpack_from("<I", d, slice_off + 16)[0]
              cmd_off = slice_off + 32
              for _ in range(ncmds):
                  cmd, cmdsize = struct.unpack_from("<II", d, cmd_off)
                  if cmd == 0x1d:
                      off, sz = struct.unpack_from("<II", d, cmd_off + 8)
                      return slice_off + off, sz
                  cmd_off += cmdsize
              return None, None

          dev_off, dev_sz = get_code_sig("W.dev.dylib")
          our_off, our_sz = get_code_sig("W.dylib")
          print("dev  LC_CODE_SIGNATURE: offset=%d size=%d" % (dev_off, dev_sz))
          print("ours LC_CODE_SIGNATURE: offset=%d size=%d" % (our_off, our_sz))
          print("")
          if dev_off == our_off and dev_sz == our_sz:
              print("CODE SIGNATURE OFFSET AND SIZE MATCH")
              print("Remaining diffs are only CMS blob content (LiveContainer cert vs ad-hoc)")
              print("LiveContainer will re-sign on import with its own cert")
          PYEOF

      - name: Package
        run: |
          set -euo pipefail
          find "$FRAMEWORK_NAME" -name ".DS_Store" -delete
          find "$FRAMEWORK_NAME" -name "._*" -delete
          xattr -cr "$FRAMEWORK_NAME" 2>/dev/null || true
          ditto -c -k --sequesterRsrc --keepParent "$FRAMEWORK_NAME" Frida.framework.zip
          shasum -a 256 Frida.framework.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Frida.framework
          path: Frida.framework.zip
          retention-days: 30
          if-no-files-found: error