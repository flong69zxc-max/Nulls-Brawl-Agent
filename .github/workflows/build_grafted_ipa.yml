name: Build Frida Gadget IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download Frida Gadget
        id: frida
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p build
          META=$(curl -sL -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/frida/frida/releases/latest")
          VERSION=$(echo "$META" | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          URL=$(echo "$META" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for a in d.get('assets',[]):
              n=a['name']
              if 'gadget' in n and 'ios' in n and n.endswith('.dylib.xz'):
                  print(a['browser_download_url']); break
          ")
          if [ -z "$URL" ]; then
            URL=$(echo "$META" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for a in d.get('assets',[]):
              n=a['name']
              if 'gadget' in n and 'ios' in n and n.endswith('.xz'):
                  print(a['browser_download_url']); break
          ")
          fi
          if [ -z "$URL" ]; then
            echo "::error::No iOS gadget asset found for $VERSION"
            echo "$META" | python3 -c "import sys,json; [print(a['name']) for a in json.load(sys.stdin).get('assets',[])]"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          curl -fL -o /tmp/frida.xz "$URL"
          xz -d /tmp/frida.xz
          mv /tmp/frida /tmp/FridaGadget.dylib
          cp /tmp/FridaGadget.dylib build/FridaGadget.dylib
          file build/FridaGadget.dylib

      - name: Download Nulls Brawl IPA
        run: |
          set -euo pipefail
          mkdir -p build
          curl -fL -A "Mozilla/5.0" -o build/bs.ipa "https://dnull.xyz/latest_bs_i"
          test -s build/bs.ipa
          file build/bs.ipa

      - name: Extract IPA
        id: extract
        run: |
          set -euo pipefail
          cd build
          rm -rf extract
          mkdir -p extract
          unzip -q bs.ipa -d extract
          if [ ! -d "extract/Payload" ]; then
            echo "::error::Payload directory not found"
            ls -la extract/
            exit 1
          fi
          APP_DIR=$(find extract/Payload -maxdepth 1 -type d -name "*.app" | head -n1)
          if [ -z "$APP_DIR" ]; then
            echo "::error::No .app bundle in Payload"
            ls -la extract/Payload/
            exit 1
          fi
          BIN="$APP_DIR/Nulls Brawl"
          if [ ! -f "$BIN" ]; then
            BIN=$(find "$APP_DIR" -maxdepth 1 -type f -perm +111 ! -name "*.dylib" ! -name "*.png" | head -n1)
          fi
          if [ -z "$BIN" ] || [ ! -f "$BIN" ]; then
            echo "::error::No executable in .app"
            ls -la "$APP_DIR"
            exit 1
          fi
          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"
          file "$BIN"

      - name: Setup Frameworks
        run: |
          set -euo pipefail
          APP_DIR="${{ steps.extract.outputs.app_dir }}"
          mkdir -p "$APP_DIR/Frameworks"
          cp build/FridaGadget.dylib "$APP_DIR/Frameworks/"
          mkdir -p "$APP_DIR/Frameworks/scripts"
          cp scripts/agents.js "$APP_DIR/Frameworks/scripts/agents.js"
          cat > "$APP_DIR/Frameworks/FridaGadget.config" << 'EOF'
          {
            "interaction": {
              "type": "script",
              "path": "Frameworks/scripts/agents.js",
              "on_change": "ignore"
            },
            "runtime": "qjs",
            "code_signing": "required"
          }
          EOF

      - name: Install tools
        run: |
          brew install ldid
          git clone --depth 1 https://github.com/tyilo/insert_dylib.git /tmp/insert_dylib
          cd /tmp/insert_dylib
          xcodebuild -project insert_dylib.xcodeproj -scheme insert_dylib -configuration Release build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO 2>&1 | tail -5
          sudo cp build/Release/insert_dylib /usr/local/bin/
          sudo chmod +x /usr/local/bin/insert_dylib

      - name: Inject dylib
        run: |
          set -euo pipefail
          BIN="${{ steps.extract.outputs.bin }}"
          insert_dylib --weak --all-yes "@executable_path/Frameworks/FridaGadget.dylib" "$BIN" "$BIN.patched"
          mv "$BIN.patched" "$BIN"
          chmod +x "$BIN"
          otool -L "$BIN" | grep -i frida || echo "no frida load command"

      - name: Sign
        run: |
          set -euo pipefail
          APP_DIR="${{ steps.extract.outputs.app_dir }}"
          BIN="${{ steps.extract.outputs.bin }}"
          ldid -S "$APP_DIR/Frameworks/FridaGadget.dylib"
          ldid -S "$BIN"
          echo "signed"

      - name: Repack IPA
        run: |
          set -euo pipefail
          cd build/extract
          zip -qry ../bs_patched.ipa Payload

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="brawl-$(date +%Y%m%d)-run${{ github.run_number }}"
          gh release create "$TAG" build/bs_patched.ipa \
            --title "Brawl $TAG" \
            --notes "Auto-built from run ${{ github.run_number }} (Frida ${{ steps.frida.outputs.version }})"

      - uses: actions/upload-artifact@v4
        with:
          name: brawl-patched-ipa
          path: build/bs_patched.ipa
          retention-days: 7