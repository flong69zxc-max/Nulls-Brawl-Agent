name: Build Patched Nulls Brawl

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      FRIDA_VERSION: "17.19.0"
      GUM_GRAFT_VERSION: "17.19.0"
      LDID_VERSION: "v2.1.5-procursus7"

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Verify binary
        run: |
          set -euo pipefail
          test -f "Nulls Brawl"
          file "Nulls Brawl"
          stat -f%z "Nulls Brawl"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install toolchain
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund --ignore-scripts esbuild@0.28.2 frida-objc-bridge@8.0.6

      - name: Compile agent.js
        run: |
          set -euo pipefail
          mkdir -p build
          ./node_modules/.bin/esbuild scripts/frida-scripts/agent.js \
            --bundle --format=esm --target=es2020 --minify \
            --legal-comments=none \
            --banner:js='"use strict";' \
            --outfile=build/agent.js
          ls -la build/agent.js

      - name: Download Frida Gadget
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o gadget.xz "https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gadget-${FRIDA_VERSION}-ios-universal.dylib.xz"
          xz -d gadget.xz
          mv gadget W.fat.dylib
          lipo -thin arm64 -output W.thin.dylib W.fat.dylib
          rm -f W.fat.dylib
          file W.thin.dylib

      - name: Download gum-graft
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o gum-graft.xz "https://github.com/frida/frida/releases/download/${GUM_GRAFT_VERSION}/gum-graft-${GUM_GRAFT_VERSION}-macos-arm64.xz"
          xz -d gum-graft.xz
          chmod +x gum-graft
          ./gum-graft --help 2>&1 | head -20

      - name: Graft binary
        run: |
          set -euo pipefail
          cp "Nulls Brawl" "Nulls Brawl.orig"
          echo "before: $(stat -f%z "Nulls Brawl")"
          set +e
          ./gum-graft \
            --ingest-function-starts \
            --offset 0xb24820 \
            --offset 0xd93d80 \
            "Nulls Brawl" 2>&1 | tail -40
          rc=$?
          set -e
          echo "gum-graft exit code: $rc"
          echo "after: $(stat -f%z "Nulls Brawl")"
          otool -l "Nulls Brawl" | grep -iE "__FRIDA|graft" || echo "no graft sections"
          if [ "$rc" -ne 0 ]; then
            echo "WARNING: graft failed, using original"
            cp "Nulls Brawl.orig" "Nulls Brawl"
          fi
          rm -f "Nulls Brawl.orig"

      - name: Install ldid deps
        run: |
          set -euo pipefail
          brew install pkg-config libplist openssl@3

      - name: Build ldid
        run: |
          set -euo pipefail
          mkdir -p ldid-bin
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          LIBPLIST_PREFIX=$(brew --prefix libplist)
          export PKG_CONFIG_PATH="$OPENSSL_PREFIX/lib/pkgconfig:$LIBPLIST_PREFIX/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export LDFLAGS="-L$OPENSSL_PREFIX/lib -L$LIBPLIST_PREFIX/lib"
          export CPPFLAGS="-I$OPENSSL_PREFIX/include -I$LIBPLIST_PREFIX/include"
          rm -rf ldid-src
          git clone --depth 1 --branch "${LDID_VERSION}" https://github.com/ProcursusTeam/ldid.git ldid-src 2>/dev/null || git clone --depth 1 https://github.com/ProcursusTeam/ldid.git ldid-src
          cd ldid-src
          make CXXFLAGS="-O2 -pipe" -j"$(sysctl -n hw.ncpu)"
          cp ldid ../ldid-bin/ldid
          chmod +x ../ldid-bin/ldid

      - name: Build Frida.framework
        run: |
          set -euo pipefail
          rm -rf Frida.framework
          mkdir -p Frida.framework
          cp W.thin.dylib Frida.framework/W.dylib
          cp build/agent.js Frida.framework/agent.js
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '    <key>CFBundleExecutable</key>' \
            '    <string>W.dylib</string>' \
            '    <key>CFBundleIdentifier</key>' \
            '    <string>re.frida.gadget</string>' \
            '    <key>CFBundleShortVersionString</key>' \
            '    <string>17.19.0</string>' \
            '    <key>CFBundleVersion</key>' \
            '    <string>17.19.0</string>' \
            '    <key>CFBundleName</key>' \
            '    <string>Frida</string>' \
            '    <key>CFBundlePackageType</key>' \
            '    <string>FMWK</string>' \
            '    <key>CFBundleSupportedPlatforms</key>' \
            '    <array><string>iPhoneOS</string></array>' \
            '    <key>DTPlatformName</key>' \
            '    <string>iphoneos</string>' \
            '    <key>MinimumOSVersion</key>' \
            '    <string>12.0</string>' \
            '</dict>' \
            '</plist>' \
            > Frida.framework/Info.plist
          printf '%s\n' \
            '{' \
            '  "interaction": {' \
            '    "type": "script",' \
            '    "path": "agent.js",' \
            '    "on_change": "ignore"' \
            '  },' \
            '  "code_signing": "required"' \
            '}' \
            > Frida.framework/W.config
          plutil -lint Frida.framework/Info.plist
          ls -la Frida.framework/

      - name: Build insert_dylib
        run: |
          set -euo pipefail
          mkdir -p insert_dylib-bin
          rm -rf /tmp/insert_dylib
          git clone --depth 1 https://github.com/tyilo/insert_dylib.git /tmp/insert_dylib
          cd /tmp/insert_dylib
          xcodebuild -project insert_dylib.xcodeproj -scheme insert_dylib -configuration Release SYMROOT="$PWD/build" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -5
          cp build/Release/insert_dylib "$GITHUB_WORKSPACE/insert_dylib-bin/insert_dylib"
          chmod +x "$GITHUB_WORKSPACE/insert_dylib-bin/insert_dylib"

      - name: Inject load command and fix rpath
        run: |
          set -euo pipefail
          cp "Nulls Brawl" "Nulls Brawl.orig"
          ./insert_dylib-bin/insert_dylib --weak --all-yes "@executable_path/Frameworks/Frida.framework/W.dylib" "Nulls Brawl.orig" "Nulls Brawl"
          chmod +x "Nulls Brawl"
          rm -f "Nulls Brawl.orig"
          install_name_tool -add_rpath "@executable_path/Frameworks" "Nulls Brawl" || echo "rpath already exists"
          otool -L "Nulls Brawl" | grep -i frida || echo "no frida dylib"

      - name: Sign
        run: |
          set -euo pipefail
          ./ldid-bin/ldid -S Frida.framework/W.dylib
          ./ldid-bin/ldid -S "Nulls Brawl"
          codesign --force --sign - "Nulls Brawl" 2>&1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: patched-brawl
          path: |
            Nulls Brawl
            Frida.framework/
          retention-days: 30
          if-no-files-found: error