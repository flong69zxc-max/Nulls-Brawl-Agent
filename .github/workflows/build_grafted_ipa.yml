name: Build Florida Frida Framework

# Собирает Florida-iOS (Frida 17.16.4 с удалёнными детектами) в готовый iOS Frida.framework.
# Источник: https://github.com/Mac-XK/Florida-iOS
#
# Выход: Frida.framework.zip, внутри:
#   Frida.framework/
#   ├── W.dylib          (Florida Frida Gadget, уже без детектов)
#   ├── Info.plist
#   ├── W.config
#   └── agent.js         (заглушка, заменишь своим скриптом)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 15
    env:
      FLORIDA_URL: https://github.com/Mac-XK/Florida-iOS/releases/download/Florida/frida-gadget.dylib
      FRAMEWORK_NAME: Frida.framework

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Florida Frida Gadget
        run: |
          set -euo pipefail
          echo "downloading ${FLORIDA_URL}"
          curl -fL --retry 3 -o W.stock.dylib "${FLORIDA_URL}"
          ls -l W.stock.dylib
          file W.stock.dylib

      - name: Verify platform
        run: |
          set -euo pipefail
          file W.stock.dylib | grep -q arm64 || {
            echo "::error::не arm64"; exit 1
          }
          echo "--- LC_BUILD_VERSION ---"
          otool -l W.stock.dylib | grep -A4 LC_BUILD_VERSION | head -20

      - name: Check Florida markers
        run: |
          set -euo pipefail
          echo "--- строковые маркеры Frida (должно быть пусто) ---"
          if strings W.stock.dylib | grep -E "frida-gadget|frida:rpc|FridaScriptEngine" | head -10; then
            echo "::warning::строковые маркеры Frida всё ещё присутствуют"
          else
            echo "строковые маркеры Frida вычищены"
          fi

      - name: Assemble Frida.framework
        run: |
          set -euo pipefail
          rm -rf "$FRAMEWORK_NAME"
          mkdir -p "$FRAMEWORK_NAME"

          cp W.stock.dylib "$FRAMEWORK_NAME/W.dylib"

          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '    <key>CFBundleDevelopmentRegion</key>' \
            '    <string>en</string>' \
            '    <key>CFBundleDisplayName</key>' \
            '    <string>Frida</string>' \
            '    <key>CFBundleExecutable</key>' \
            '    <string>W.dylib</string>' \
            '    <key>CFBundleIdentifier</key>' \
            '    <string>re.frida.gadget</string>' \
            '    <key>CFBundleInfoDictionaryVersion</key>' \
            '    <string>6.0</string>' \
            '    <key>CFBundleName</key>' \
            '    <string>Frida</string>' \
            '    <key>CFBundlePackageType</key>' \
            '    <string>FMWK</string>' \
            '    <key>CFBundleSignature</key>' \
            '    <string>????</string>' \
            '    <key>CFBundleSupportedPlatforms</key>' \
            '    <array>' \
            '        <string>iPhoneOS</string>' \
            '    </array>' \
            '    <key>CFBundleVersion</key>' \
            '    <string>17.16.4</string>' \
            '    <key>CFBundleShortVersionString</key>' \
            '    <string>17.16.4</string>' \
            '    <key>DTPlatformName</key>' \
            '    <string>iphoneos</string>' \
            '    <key>MinimumOSVersion</key>' \
            '    <string>12.0</string>' \
            '    <key>UIRequiredDeviceCapabilities</key>' \
            '    <array>' \
            '        <string>arm64</string>' \
            '    </array>' \
            '</dict>' \
            '</plist>' \
            > "$FRAMEWORK_NAME/Info.plist"

          printf '%s\n' \
            '{' \
            '  "interaction": {' \
            '    "type": "script",' \
            '    "path": "agent.js",' \
            '    "on_change": "ignore"' \
            '  },' \
            '  "code_signing": "optional"' \
            '}' \
            > "$FRAMEWORK_NAME/W.config"

          printf '%s\n' 'rpc.exports = { init: function () { return true; } };' > "$FRAMEWORK_NAME/agent.js"

          plutil -lint "$FRAMEWORK_NAME/Info.plist"
          ls -la "$FRAMEWORK_NAME"

      - name: Sign framework
        run: |
          set -euo pipefail
          brew install ldid || true
          if command -v ldid >/dev/null; then
            ldid -S "$FRAMEWORK_NAME/W.dylib"
            echo "signed W.dylib"
          else
            echo "::warning::ldid недоступен, оставляю неподписанный"
          fi

      - name: Package
        run: |
          set -euo pipefail
          zip -r "$FRAMEWORK_NAME.zip" "$FRAMEWORK_NAME"
          shasum -a 256 "$FRAMEWORK_NAME.zip" | tee "$FRAMEWORK_NAME.zip.sha256"

      - name: Summary
        run: |
          set -euo pipefail
          {
            echo "### florida frida framework"
            echo ""
            echo "| параметр | значение |"
            echo "|---|---|"
            echo "| source | Mac-XK/Florida-iOS |"
            echo "| frida | 17.16.4 |"
            echo "| arch | arm64 |"
            echo "| размер dylib | $(stat -f%z $FRAMEWORK_NAME/W.dylib) B |"
            echo "| sha256 | \`$(shasum -a 256 $FRAMEWORK_NAME.zip | cut -c1-16)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Frida.framework
          path: |
            Frida.framework.zip
            Frida.framework.zip.sha256
          retention-days: 30
          if-no-files-found: error