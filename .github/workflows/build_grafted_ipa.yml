name: Build Frida.framework (unsigned)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 10
    env:
      FRIDA_VERSION: '17.2.11'
      FRAMEWORK_NAME: Frida.framework

    steps:
      - uses: actions/checkout@v4

      - name: Download Frida Gadget
        run: |
          set -euo pipefail
          URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gadget-${FRIDA_VERSION}-ios-universal.dylib.xz"
          curl -fL --retry 3 -o gadget.dylib.xz "$URL"
          xz -d gadget.dylib.xz
          mv gadget.dylib W.stock.dylib
          lipo -thin arm64 -output W.dylib W.stock.dylib
          file W.dylib
          echo "after lipo: $(stat -f%z W.dylib) bytes"

      - name: Strip
        run: |
          set -euo pipefail
          xcrun strip -Sx W.dylib -o W.stripped.dylib
          mv W.stripped.dylib W.dylib
          echo "after strip: $(stat -f%z W.dylib) bytes"

      - name: Remove signature
        run: |
          set -euo pipefail
          # Способ 1: codesign --remove-signature
          codesign --remove-signature W.dylib 2>&1 || echo "codesign remove failed, trying ldid"

          # Способ 2: если codesign не сработал — ldid -M (remove)
          if codesign -dvv W.dylib 2>&1 | grep -q "code signature"; then
            echo "still signed, trying ldid -M"
            brew install ldid || true
            ldid -M W.dylib 2>&1 || true
          fi

          echo "after remove-signature: $(stat -f%z W.dylib) bytes"

      - name: Zero out code signature blob
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import struct, sys

          with open("W.dylib", "rb") as f:
              data = bytearray(f.read())

          magic = data[:4]
          if magic == b"\xcf\xfa\xed\xfe":
              offset_size = 4
              ncmds_off = 16
          elif magic == b"\xfe\xed\xfa\xcf":
              offset_size = 8
              ncmds_off = 16
          else:
              print(f"unknown magic: {magic.hex()}, size={len(data)}")
              sys.exit(0)

          # parse mach header 64-bit
          cpu, subtype, ftype, ncmds, sizeofcmds, flags, reserved = struct.unpack_from("<IIIIIII", data, 4)
          print(f"ncmds={ncmds} sizeofcmds={sizeofcmds}")

          cmd_off = 32
          lc_code_sig = None
          for i in range(ncmds):
              cmd, cmdsize = struct.unpack_from("<II", data, cmd_off)
              if cmd == 0x1d:  # LC_CODE_SIGNATURE
                  dataoff, datasize = struct.unpack_from("<II", data, cmd_off + 8)
                  lc_code_sig = (cmd_off, dataoff, datasize)
                  print(f"LC_CODE_SIGNATURE: offset={dataoff} size={datasize}")
              cmd_off += cmdsize

          if lc_code_sig is None:
              print("no LC_CODE_SIGNATURE found")
              sys.exit(0)

          cmd_off, dataoff, datasize = lc_code_sig
          if datasize == 0:
              print("empty signature blob already")
              sys.exit(0)

          # Zero out the signature blob
          end = min(dataoff + datasize, len(data))
          for i in range(dataoff, end):
              data[i] = 0

          with open("W.dylib", "wb") as f:
              f.write(data)

          print(f"zeroed {end - dataoff} bytes at offset {dataoff}")
          print(f"new size: {len(data)}")
          PYEOF
          file W.dylib
          echo "final: $(stat -f%z W.dylib) bytes"

      - name: Compare with dev
        run: |
          set -euo pipefail
          if [ ! -f W.dylib.zip ]; then
            echo "no W.dylib.zip to compare"
            exit 0
          fi
          mkdir -p dev
          unzip -o W.dylib.zip -d dev > /dev/null
          DEV=$(find dev -type f -name "*.dylib" ! -path "*__MACOSX*" ! -name "._*" | head -1)
          cp "$DEV" dev.dylib

          echo "=== sizes ==="
          echo "dev:  $(stat -f%z dev.dylib)"
          echo "ours: $(stat -f%z W.dylib)"
          echo "diff: $(( $(stat -f%z W.dylib) - $(stat -f%z dev.dylib) ))"

          echo ""
          echo "=== byte diff ==="
          python3 - << 'PYEOF'
          with open("dev.dylib","rb") as f: dev = f.read()
          with open("W.dylib","rb") as f: ours = f.read()
          n = min(len(dev), len(ours))
          diffs = [i for i in range(n) if dev[i] != ours[i]]
          print(f"total differing bytes: {len(diffs)}")
          print("first 30 offsets:")
          for i in diffs[:30]:
              print(f"  off 0x{i:x}: dev={dev[i]:02x} ours={ours[i]:02x}")
          print(f"last 10 offsets:")
          for i in diffs[-10:]:
              print(f"  off 0x{i:x}: dev={dev[i]:02x} ours={ours[i]:02x}")
          PYEOF

      - name: Assemble Frida.framework
        run: |
          set -euo pipefail
          rm -rf "$FRAMEWORK_NAME"
          mkdir -p "$FRAMEWORK_NAME"
          cp W.dylib "$FRAMEWORK_NAME/W.dylib"
          cat > "$FRAMEWORK_NAME/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>W.dylib</string>
              <key>CFBundleIdentifier</key><string>re.frida.gadget</string>
              <key>CFBundleShortVersionString</key><string>17.2.11</string>
              <key>CFBundleVersion</key><string>17.2.11</string>
              <key>CFBundleName</key><string>Frida</string>
              <key>CFBundlePackageType</key><string>FMWK</string>
              <key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>
              <key>DTPlatformName</key><string>iphoneos</string>
              <key>MinimumOSVersion</key><string>12.0</string>
          </dict>
          </plist>
          PLIST
          cat > "$FRAMEWORK_NAME/W.config" << 'CONFIG'
          {
            "interaction": {"type": "script", "path": "agent.js", "on_change": "ignore"},
            "code_signing": "required"
          }
          CONFIG
          echo 'rpc.exports = { init: function () { return true; } };' > "$FRAMEWORK_NAME/agent.js"
          plutil -lint "$FRAMEWORK_NAME/Info.plist"

      - name: Package
        run: |
          set -euo pipefail
          find "$FRAMEWORK_NAME" -name ".DS_Store" -delete
          find "$FRAMEWORK_NAME" -name "._*" -delete
          xattr -cr "$FRAMEWORK_NAME" 2>/dev/null || true
          zip -r -X "$FRAMEWORK_NAME.zip" "$FRAMEWORK_NAME"
          shasum -a 256 "$FRAMEWORK_NAME.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Frida.framework
          path: |
            Frida.framework.zip
            Frida.framework.zip.sha256
          retention-days: 30
          if-no-files-found: error