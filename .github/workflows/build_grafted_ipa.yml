name: Build Frida.framework 17.9.7

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve agent script
        id: agent
        run: |
          set -euo pipefail
          for p in scripts/agents.js scripts/agent.js agent/agents.js agent/agent.js scripts/frida-scripts/agent.js; do
            if [ -f "$p" ]; then echo "path=$p" >> "$GITHUB_OUTPUT"; echo "found: $p"; exit 0; fi
          done
          echo "::error::agent script not found"
          exit 1

      - uses: actions/cache@v4
        id: cache-gadget
        with:
          path: gadget-cache
          key: frida-gadget-17.9.7-ios-universal-v1

      - name: Download Frida Gadget 17.9.7
        if: steps.cache-gadget.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p gadget-cache
          curl -fL -o /tmp/frida.xz \
            "https://github.com/frida/frida/releases/download/17.9.7/frida-gadget-17.9.7-ios-universal.dylib.xz"
          xz -d /tmp/frida.xz
          mv /tmp/frida gadget-cache/FridaGadget.dylib
          file gadget-cache/FridaGadget.dylib

      - name: Thin to arm64
        run: |
          set -euo pipefail
          lipo gadget-cache/FridaGadget.dylib -thin arm64 -output gadget-cache/FridaGadget-arm64
          lipo -info gadget-cache/FridaGadget-arm64
          ls -la gadget-cache/

      - name: Build Frida.framework
        run: |
          set -euo pipefail
          mkdir -p Frida.framework
          cp gadget-cache/FridaGadget-arm64 Frida.framework/W.dylib
          chmod +x Frida.framework/W.dylib
          cp "${{ steps.agent.outputs.path }}" Frida.framework/agent.js
          cat > Frida.framework/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>W.dylib</string>
              <key>CFBundleIdentifier</key>
              <string>re.frida.gadget</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>Frida</string>
              <key>CFBundlePackageType</key>
              <string>FMWK</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>CFBundleSupportedPlatforms</key>
              <array>
                  <string>iPhoneOS</string>
              </array>
              <key>CFBundleVersion</key>
              <string>17.9.7</string>
              <key>CFBundleShortVersionString</key>
              <string>17.9.7</string>
              <key>DTPlatformName</key>
              <string>iphoneos</string>
              <key>MinimumOSVersion</key>
              <string>11.0</string>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
          </dict>
          </plist>
          EOF
          cat > Frida.framework/FridaGadget.config << 'EOF'
          {
            "interaction": {
              "type": "script",
              "path": "agent.js",
              "on_change": "ignore"
            },
            "code_signing": "required"
          }
          EOF
          ls -la Frida.framework/

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd Frida.framework
          zip -qry ../Frida.framework.zip .
          cd ..
          TAG="frida-framework-17.9.7-$(date +%Y%m%d)-r${{ github.run_number }}"
          gh release create "$TAG" Frida.framework.zip \
            --title "$TAG" \
            --notes "Frida 17.9.7 arm64 thin, Interceptor fix for iOS 26+"

      - uses: actions/upload-artifact@v4
        with:
          name: Frida.framework-17.9.7
          path: Frida.framework/
          retention-days: 7