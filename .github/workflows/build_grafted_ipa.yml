name: Build Frida.framework with gum-graft

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build_grafted_ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      FRIDA_VERSION: '17.2.11'
      FRAMEWORK_NAME: Frida.framework

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install node@22 meson ninja pkg-config glib || true
          brew link --overwrite --force node@22
          echo "/opt/homebrew/opt/node@22/bin" >> "$GITHUB_PATH"
          python3 -m venv "$HOME/pyenv"
          source "$HOME/pyenv/bin/activate"
          python3 -m pip install --upgrade pip
          python3 -m pip install setuptools
          node --version
          meson --version
          ninja --version

      - name: Cache Frida build
        id: cache-frida
        uses: actions/cache@v4
        with:
          path: |
            frida-src/build
            frida-src/subprojects/packagecache
          key: frida-${{ env.FRIDA_VERSION }}-${{ runner.os }}-${{ hashFiles('.github/workflows/build_grafted_ipa.yml') }}
          restore-keys: |
            frida-${{ env.FRIDA_VERSION }}-${{ runner.os }}-

      - name: Clone Frida source
        if: steps.cache-frida.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch ${FRIDA_VERSION} \
            https://github.com/frida/frida.git frida-src || \
          git clone --depth 1 https://github.com/frida/frida.git frida-src
          cd frida-src
          git submodule update --init --recursive --depth 1
          echo "=== source ready ==="

      - name: Configure Frida
        run: |
          set -euo pipefail
          source "$HOME/pyenv/bin/activate"
          cd frida-src
          if [ -f build/build.ninja ]; then
            echo "build already configured, skipping configure"
            exit 0
          fi
          ./configure --enable-graft-tool --enable-frida-tools --host=macos-arm64
          echo "=== configure done ==="

      - name: Build gum and tools
        run: |
          set -euo pipefail
          source "$HOME/pyenv/bin/activate"
          cd frida-src
          make 2>&1 | tail -100
          echo "=== build done ==="

      - name: Locate gum-graft
        run: |
          set -euo pipefail
          GUM_GRAFT=$(find frida-src/build -type f -name "gum-graft" | head -1)
          if [ -z "$GUM_GRAFT" ]; then
            echo "::error::gum-graft not found in build tree"
            echo "=== graft-related files ==="
            find frida-src/build -type f -iname "*graft*" || true
            echo "=== bin dirs ==="
            find frida-src/build -type d -name bin -exec ls -la {} \; || true
            exit 1
          fi
          chmod +x "$GUM_GRAFT"
          echo "GUM_GRAFT=$(realpath $GUM_GRAFT)" >> "$GITHUB_ENV"
          echo "found: $(realpath $GUM_GRAFT)"
          "$GUM_GRAFT" --help 2>&1 | head -20 || true

      - name: Download Frida Gadget
        run: |
          set -euo pipefail
          URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gadget-${FRIDA_VERSION}-ios-universal.dylib.xz"
          curl -fL --retry 3 -o gadget.dylib.xz "$URL"
          xz -d gadget.dylib.xz
          mv gadget.dylib W.stock.dylib
          file W.stock.dylib
          lipo -info W.stock.dylib || true

      - name: Extract arm64 slice
        run: |
          set -euo pipefail
          if lipo -info W.stock.dylib 2>/dev/null | grep -q "Non-fat"; then
            cp W.stock.dylib W.thin.dylib
          else
            lipo -thin arm64 -output W.thin.dylib W.stock.dylib
          fi
          file W.thin.dylib
          echo "thin size: $(stat -f%z W.thin.dylib) bytes"

      - name: Run gum-graft
        run: |
          set -euo pipefail
          "$GUM_GRAFT" --ingest-function-starts W.thin.dylib
          echo "=== after grafting ==="
          file W.thin.dylib
          echo "grafted size: $(stat -f%z W.thin.dylib) bytes"
          otool -l W.thin.dylib | grep -i graft || echo "no graft sections found"

      - name: Assemble Frida.framework
        run: |
          set -euo pipefail
          rm -rf "$FRAMEWORK_NAME"
          mkdir -p "$FRAMEWORK_NAME"
          cp W.thin.dylib "$FRAMEWORK_NAME/W.dylib"

          cat > "$FRAMEWORK_NAME/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleDisplayName</key>
              <string>Frida</string>
              <key>CFBundleExecutable</key>
              <string>W.dylib</string>
              <key>CFBundleIdentifier</key>
              <string>re.frida.gadget</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>Frida</string>
              <key>CFBundlePackageType</key>
              <string>FMWK</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>CFBundleSupportedPlatforms</key>
              <array>
                  <string>iPhoneOS</string>
              </array>
              <key>CFBundleVersion</key>
              <string>17.2.11</string>
              <key>CFBundleShortVersionString</key>
              <string>17.2.11</string>
              <key>DTPlatformName</key>
              <string>iphoneos</string>
              <key>MinimumOSVersion</key>
              <string>12.0</string>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
          </dict>
          </plist>
          PLIST

          cat > "$FRAMEWORK_NAME/W.config" << 'CONFIG'
          {
            "interaction": {
              "type": "script",
              "path": "agent.js",
              "on_change": "ignore"
            },
            "code_signing": "required"
          }
          CONFIG

          echo 'rpc.exports = { init: function () { return true; } };' > "$FRAMEWORK_NAME/agent.js"

          plutil -lint "$FRAMEWORK_NAME/Info.plist"
          find "$FRAMEWORK_NAME" -type f | sort

      - name: Sign framework
        run: |
          set -euo pipefail
          brew install ldid || true
          if command -v ldid >/dev/null; then
            ldid -S "$FRAMEWORK_NAME/W.dylib"
            echo "signed W.dylib"
          fi

      - name: Package
        run: |
          set -euo pipefail
          find "$FRAMEWORK_NAME" -name ".DS_Store" -delete
          find "$FRAMEWORK_NAME" -name "._*" -delete
          xattr -cr "$FRAMEWORK_NAME" 2>/dev/null || true
          rm -f "$FRAMEWORK_NAME.zip"
          zip -r -X "$FRAMEWORK_NAME.zip" "$FRAMEWORK_NAME" \
            -x "*.DS_Store" -x "__MACOSX/*" -x "*/._*"
          unzip -l "$FRAMEWORK_NAME.zip"
          shasum -a 256 "$FRAMEWORK_NAME.zip" | tee "$FRAMEWORK_NAME.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Frida.framework
          path: |
            Frida.framework.zip
            Frida.framework.zip.sha256
          retention-days: 30
          if-no-files-found: error