name: Build Frida.framework with gum-graft

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build_grafted_ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25
    env:
      FRIDA_VERSION: '17.2.11'
      FRAMEWORK_NAME: Frida.framework

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download gum-graft
        run: |
          set -euo pipefail
          mkdir -p tools
          # gum-graft для macOS arm64. Имя артефакта в релизах Frida:
          # gum-graft-macos-arm64 (по данным CI-конфига Frida)
          URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/gum-graft-macos-arm64.tar.xz"
          echo "downloading $URL"
          curl -fL --retry 3 -o tools/gum-graft.tar.xz "$URL"
          tar -xJf tools/gum-graft.tar.xz -C tools/
          chmod +x tools/gum-graft
          file tools/gum-graft
          tools/gum-graft --help || true

      - name: Download Frida Gadget
        run: |
          set -euo pipefail
          URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gadget-${FRIDA_VERSION}-ios-universal.dylib.xz"
          curl -fL --retry 3 -o gadget.dylib.xz "$URL"
          xz -d gadget.dylib.xz
          mv gadget.dylib W.stock.dylib
          file W.stock.dylib
          lipo -info W.stock.dylib || true

      - name: Extract arm64 slice
        run: |
          set -euo pipefail
          # gum-graft работает только с arm64 (не arm64e)
          if lipo -info W.stock.dylib 2>/dev/null | grep -q "Non-fat"; then
            cp W.stock.dylib W.thin.dylib
          else
            lipo -thin arm64 -output W.thin.dylib W.stock.dylib
          fi
          file W.thin.dylib
          echo "thin size: $(stat -f%z W.thin.dylib) bytes"

      - name: Run gum-graft
        run: |
          set -euo pipefail
          # --ingest-function-starts: автоматически инструментировать все функции
          # из LC_FUNCTION_STARTS. gum-graft пишет результат в тот же файл.
          ./tools/gum-graft \
            --ingest-function-starts \
            W.thin.dylib
          echo "=== after grafting ==="
          file W.thin.dylib
          echo "grafted size: $(stat -f%z W.thin.dylib) bytes"
          # Проверяем, что появились новые секции (graft trampolines)
          otool -l W.thin.dylib | grep -i graft || echo "no graft sections found"

      - name: Assemble Frida.framework
        run: |
          set -euo pipefail
          rm -rf "$FRAMEWORK_NAME"
          mkdir -p "$FRAMEWORK_NAME"
          cp W.thin.dylib "$FRAMEWORK_NAME/W.dylib"

          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '    <key>CFBundleDevelopmentRegion</key>' \
            '    <string>en</string>' \
            '    <key>CFBundleDisplayName</key>' \
            '    <string>Frida</string>' \
            '    <key>CFBundleExecutable</key>' \
            '    <string>W.dylib</string>' \
            '    <key>CFBundleIdentifier</key>' \
            '    <string>re.frida.gadget</string>' \
            '    <key>CFBundleInfoDictionaryVersion</key>' \
            '    <string>6.0</string>' \
            '    <key>CFBundleName</key>' \
            '    <string>Frida</string>' \
            '    <key>CFBundlePackageType</key>' \
            '    <string>FMWK</string>' \
            '    <key>CFBundleSignature</key>' \
            '    <string>????</string>' \
            '    <key>CFBundleSupportedPlatforms</key>' \
            '    <array>' \
            '        <string>iPhoneOS</string>' \
            '    </array>' \
            '    <key>CFBundleVersion</key>' \
            '    <string>17.2.11</string>' \
            '    <key>CFBundleShortVersionString</key>' \
            '    <string>17.2.11</string>' \
            '    <key>DTPlatformName</key>' \
            '    <string>iphoneos</string>' \
            '    <key>MinimumOSVersion</key>' \
            '    <string>12.0</string>' \
            '    <key>UIRequiredDeviceCapabilities</key>' \
            '    <array>' \
            '        <string>arm64</string>' \
            '    </array>' \
            '</dict>' \
            '</plist>' \
            > "$FRAMEWORK_NAME/Info.plist"

          # ВАЖНО: code_signing должен быть "required" для работы gum-graft
          printf '%s\n' \
            '{' \
            '  "interaction": {' \
            '    "type": "script",' \
            '    "path": "agent.js",' \
            '    "on_change": "ignore"' \
            '  },' \
            '  "code_signing": "required"' \
            '}' \
            > "$FRAMEWORK_NAME/W.config"

          printf '%s\n' 'rpc.exports = { init: function () { return true; } };' > "$FRAMEWORK_NAME/agent.js"

          plutil -lint "$FRAMEWORK_NAME/Info.plist"
          find "$FRAMEWORK_NAME" -type f | sort

      - name: Sign framework
        run: |
          set -euo pipefail
          brew install ldid || true
          if command -v ldid >/dev/null; then
            ldid -S "$FRAMEWORK_NAME/W.dylib"
            echo "signed W.dylib"
            codesign -dvv "$FRAMEWORK_NAME/W.dylib" 2>&1 | head -5 || true
          fi

      - name: Package
        run: |
          set -euo pipefail
          find "$FRAMEWORK_NAME" -name ".DS_Store" -delete
          find "$FRAMEWORK_NAME" -name "._*" -delete
          xattr -cr "$FRAMEWORK_NAME" 2>/dev/null || true
          rm -f "$FRAMEWORK_NAME.zip"
          zip -r -X "$FRAMEWORK_NAME.zip" "$FRAMEWORK_NAME" \
            -x "*.DS_Store" -x "__MACOSX/*" -x "*/._*"
          unzip -l "$FRAMEWORK_NAME.zip"
          shasum -a 256 "$FRAMEWORK_NAME.zip" | tee "$FRAMEWORK_NAME.zip.sha256"

      - name: Summary
        run: |
          set -euo pipefail
          {
            echo "### frida framework with gum-graft"
            echo ""
            echo "| param | value |"
            echo "|---|---|"
            echo "| frida | ${FRIDA_VERSION} |"
            echo "| tool | gum-graft (ingest-function-starts) |"
            echo "| arch | arm64 |"
            echo "| code_signing | required |"
            echo "| dylib size | $(stat -f%z $FRAMEWORK_NAME/W.dylib) B |"
            echo "| sha256 | \`$(shasum -a 256 $FRAMEWORK_NAME.zip | cut -c1-16)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Frida.framework
          path: |
            Frida.framework.zip
            Frida.framework.zip.sha256
          retention-days: 30
          if-no-files-found: error