name: Build Frida.framework

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25
    env:
      FRIDA_VERSION: '17.2.11'
      FRAMEWORK_NAME: Frida.framework
      LDID_VERSION: 'v2.1.5-procursus7'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Download Frida Gadget
        run: |
          set -euo pipefail
          URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gadget-${FRIDA_VERSION}-ios-universal.dylib.xz"
          curl -fL --retry 3 -o gadget.xz "$URL"
          xz -d gadget.xz
          mv gadget W.fat.dylib
          lipo -thin arm64 -output W.thin.dylib W.fat.dylib
          echo "thin before sign: $(stat -f%z W.thin.dylib)"

      - name: Install ldid-procursus
        run: |
          set -euo pipefail
          sudo rm -f /usr/local/bin/ldid /opt/homebrew/bin/ldid /usr/bin/ldid 2>/dev/null || true
          brew uninstall ldid 2>/dev/null || true
          brew uninstall ldid-procursus 2>/dev/null || true

          PREBUILT_URL="https://github.com/ProcursusTeam/ldid/releases/download/${LDID_VERSION}/ldid_macos_arm64"
          if curl -fL --retry 3 -o /tmp/ldid "$PREBUILT_URL" 2>/dev/null; then
            echo "using prebuilt"
            chmod +x /tmp/ldid
            sudo mv /tmp/ldid /usr/local/bin/ldid
          else
            echo "building from source"
            brew install pkg-config libplist openssl@3
            OPENSSL_PREFIX=$(brew --prefix openssl@3)
            LIBPLIST_PREFIX=$(brew --prefix libplist)
            export PKG_CONFIG_PATH="$OPENSSL_PREFIX/lib/pkgconfig:$LIBPLIST_PREFIX/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            export LDFLAGS="-L$OPENSSL_PREFIX/lib -L$LIBPLIST_PREFIX/lib"
            export CPPFLAGS="-I$OPENSSL_PREFIX/include -I$LIBPLIST_PREFIX/include"
            rm -rf ldid-src
            if git clone --depth 1 --branch "${LDID_VERSION}" https://github.com/ProcursusTeam/ldid.git ldid-src 2>/dev/null; then
              echo "cloned tag ${LDID_VERSION}"
            else
              git clone --depth 1 https://github.com/ProcursusTeam/ldid.git ldid-src
            fi
            cd ldid-src
            make CXXFLAGS="-O2 -pipe"
            sudo cp ldid /usr/local/bin/ldid
            sudo chmod +x /usr/local/bin/ldid
          fi

          for p in /opt/homebrew/bin/ldid /usr/bin/ldid; do
            [ -e "$p" ] && sudo rm -f "$p" || true
          done
          /usr/local/bin/ldid -v 2>&1 | head -1 || true

      - name: Generate self-signed iOS cert
        run: |
          set -euo pipefail
          mkdir -p certs
          cd certs

          cat > cert.cnf << 'CERTEOF'
          [req]
          distinguished_name = dn
          prompt = no
          x509_extensions = v3_ext
          [dn]
          CN = Frida Gadget
          O = Frida
          OU = Gadget
          [v3_ext]
          basicConstraints = critical, CA:FALSE
          keyUsage = critical, digitalSignature
          extendedKeyUsage = critical, codeSigning
          CERTEOF

          openssl ecparam -name prime256v1 -genkey -noout -out key.pem
          openssl req -new -x509 -key key.pem -out cert.pem \
            -days 3650 -sha256 -config cert.cnf -extensions v3_ext
          openssl pkcs12 -export -out sign.p12 \
            -inkey key.pem -in cert.pem -passout pass:

          ls -la
          echo "cert ready"

      - name: Try signing variants until size matches
        run: |
          set -euo pipefail
          cp W.thin.dylib W.thin.orig.dylib
          TARGET=19006592

          try() {
            local name="$1"; shift
            cp W.thin.orig.dylib W.thin.test.dylib
            if "$@" >/dev/null 2>/tmp/sign.err; then
              local sz=$(stat -f%z W.thin.test.dylib)
              echo "  [$name] -> $sz"
              if [ "$sz" = "$TARGET" ]; then
                echo "  [$name] *** MATCH ***"
                cp W.thin.test.dylib W.thin.dylib
                return 0
              fi
            else
              echo "  [$name] -> FAIL: $(head -1 /tmp/sign.err)"
            fi
            return 1
          }

          echo "=== trying variants ==="
          try "ad-hoc -S" \
            /usr/local/bin/ldid -S W.thin.test.dylib && exit 0 || true

          try "cert -s sign.p12 -S" \
            /usr/local/bin/ldid -s certs/sign.p12 -S W.thin.test.dylib && exit 0 || true

          try "cert -S certs/sign.p12" \
            /usr/local/bin/ldid -S certs/sign.p12 W.thin.test.dylib && exit 0 || true

          try "cert -Cadhoc -s sign.p12 -S" \
            /usr/local/bin/ldid -Cadhoc -s certs/sign.p12 -S W.thin.test.dylib && exit 0 || true

          try "cert -Clinker-signed -s sign.p12 -S" \
            /usr/local/bin/ldid -Clinker-signed -s certs/sign.p12 -S W.thin.test.dylib && exit 0 || true

          try "codesign -s -" \
            codesign --force --sign - --timestamp=none W.thin.test.dylib && exit 0 || true

          try "codesign --generate-entitlement-der" \
            codesign --force --sign - --timestamp=none --generate-entitlement-der W.thin.test.dylib && exit 0 || true

          echo "::error::no variant matched $TARGET"
          echo "best effort results:"
          for n in ad-hoc cert; do
            echo "  $n variant last size: see above"
          done
          exit 1

      - name: Zero signature blob
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import struct
          with open("W.thin.dylib", "rb") as f:
              d = bytearray(f.read())
          n = struct.unpack_from("<I", d, 16)[0]
          o = 32
          for _ in range(n):
              c, s = struct.unpack_from("<II", d, o)
              if c == 0x1d:
                  off, sz = struct.unpack_from("<II", d, o + 8)
                  print("sig offset=" + str(off) + " size=" + str(sz))
                  for i in range(off, off + sz):
                      d[i] = 0
                  break
              o += s
          with open("W.thin.dylib", "wb") as f:
              f.write(d)
          print("thin final: " + str(len(d)))
          PYEOF

      - name: Wrap into fat binary
        run: |
          set -euo pipefail
          lipo -create -arch arm64 W.thin.dylib -output W.dylib
          echo "fat: $(stat -f%z W.dylib)"

      - name: Compare with dev reference
        run: |
          set -euo pipefail
          REF=""
          for p in Frida/W.dylib.zip W.dylib.zip frida/W.dylib.zip; do
            if [ -f "$p" ]; then REF="$p"; break; fi
          done
          if [ -z "$REF" ]; then
            echo "::warning::no dev reference"
            exit 0
          fi
          mkdir -p dev
          unzip -o "$REF" -d dev > /dev/null
          DEV=$(find dev -type f -name "*.dylib" ! -path "*__MACOSX*" ! -name "._*" | head -1)
          cp "$DEV" W.dev.dylib
          echo "dev:  $(stat -f%z W.dev.dylib)"
          echo "ours: $(stat -f%z W.dylib)"
          python3 - << 'PYEOF'
          with open("W.dev.dylib", "rb") as f:
              dev = f.read()
          with open("W.dylib", "rb") as f:
              ours = f.read()
          if len(dev) != len(ours):
              print("SIZE MISMATCH dev=" + str(len(dev)) + " ours=" + str(len(ours)))
          n = min(len(dev), len(ours))
          diffs = [i for i in range(n) if dev[i] != ours[i]]
          print("diffs: " + str(len(diffs)))
          for i in diffs[:32]:
              print("  off 0x%x: dev=%02x ours=%02x" % (i, dev[i], ours[i]))
          if not diffs:
              print("PERFECT")
          PYEOF

      - name: Assemble Frida.framework
        run: |
          set -euo pipefail
          rm -rf "$FRAMEWORK_NAME"
          mkdir -p "$FRAMEWORK_NAME"
          cp W.dylib "$FRAMEWORK_NAME/W.dylib"
          cat > "$FRAMEWORK_NAME/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>W.dylib</string>
              <key>CFBundleIdentifier</key><string>re.frida.gadget</string>
              <key>CFBundleShortVersionString</key><string>17.2.11</string>
              <key>CFBundleVersion</key><string>17.2.11</string>
              <key>CFBundleName</key><string>Frida</string>
              <key>CFBundlePackageType</key><string>FMWK</string>
              <key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>
              <key>DTPlatformName</key><string>iphoneos</string>
              <key>MinimumOSVersion</key><string>12.0</string>
          </dict>
          </plist>
          PLIST
          cat > "$FRAMEWORK_NAME/W.config" << 'CONFIG'
          {
            "interaction": {"type": "script", "path": "agent.js", "on_change": "ignore"},
            "code_signing": "required"
          }
          CONFIG
          echo 'rpc.exports = { init: function () { return true; } };' > "$FRAMEWORK_NAME/agent.js"

      - name: Package
        run: |
          set -euo pipefail
          find "$FRAMEWORK_NAME" -name ".DS_Store" -delete
          find "$FRAMEWORK_NAME" -name "._*" -delete
          xattr -cr "$FRAMEWORK_NAME" 2>/dev/null || true
          ditto -c -k --sequesterRsrc --keepParent "$FRAMEWORK_NAME" Frida.framework.zip
          shasum -a 256 Frida.framework.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Frida.framework
          path: Frida.framework.zip
          retention-days: 30
          if-no-files-found: error