name: Build Frida.framework

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25
    env:
      FRIDA_VERSION: '17.2.11'
      FRAMEWORK_NAME: Frida.framework
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Download Frida Gadget
        run: |
          set -euo pipefail
          URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gadget-${FRIDA_VERSION}-ios-universal.dylib.xz"
          curl -fL --retry 3 -o gadget.xz "$URL"
          xz -d gadget.xz
          mv gadget W.fat.dylib

      - name: Extract dev reference
        run: |
          set -euo pipefail
          REF=""
          for p in Frida/W.dylib.zip W.dylib.zip; do
            if [ -f "$p" ]; then REF="$p"; break; fi
          done
          [ -n "$REF" ] || { echo "::error::no dev reference"; exit 1; }
          mkdir -p dev
          unzip -o "$REF" -d dev > /dev/null
          DEV=$(find dev -type f -name "*.dylib" ! -path "*__MACOSX*" ! -name "._*" | head -1)
          cp "$DEV" W.dev.dylib
          lipo -thin arm64 -output W.dev.thin.dylib W.dev.dylib
          echo "dev thin: $(stat -f%z W.dev.thin.dylib)"

      - name: Extract thin arm64 from stock
        run: |
          set -euo pipefail
          lipo -thin arm64 -output W.thin.dylib W.fat.dylib
          echo "thin before: $(stat -f%z W.thin.dylib)"

      - name: Remove existing signature
        run: |
          set -euo pipefail
          codesign --remove-signature W.thin.dylib 2>/dev/null || true
          echo "after remove: $(stat -f%z W.thin.dylib)"

      - name: Build Frida.framework
        run: |
          set -euo pipefail
          rm -rf "$FRAMEWORK_NAME"
          mkdir -p "$FRAMEWORK_NAME"
          cp W.thin.dylib "$FRAMEWORK_NAME/W.dylib"
          cat > "$FRAMEWORK_NAME/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>W.dylib</string>
              <key>CFBundleIdentifier</key><string>re.frida.gadget</string>
              <key>CFBundleShortVersionString</key><string>17.2.11</string>
              <key>CFBundleVersion</key><string>17.2.11</string>
              <key>CFBundleName</key><string>Frida</string>
              <key>CFBundlePackageType</key><string>FMWK</string>
              <key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>
              <key>DTPlatformName</key><string>iphoneos</string>
              <key>MinimumOSVersion</key><string>12.0</string>
          </dict>
          </plist>
          PLIST
          cat > "$FRAMEWORK_NAME/W.config" << 'CONFIG'
          {
            "interaction": {"type": "script", "path": "agent.js", "on_change": "ignore"},
            "code_signing": "required"
          }
          CONFIG
          echo 'rpc.exports = { init: function () { return true; } };' > "$FRAMEWORK_NAME/agent.js"

      - name: Sign framework as bundle
        run: |
          set -euo pipefail
          TARGET=$(stat -f%z W.dev.thin.dylib)
          echo "target dylib size: $TARGET"

          # Sign the whole framework as bundle → codesign adds Info.plist + resources slots
          codesign --force --sign - --timestamp=none "$FRAMEWORK_NAME" 2>&1 || true

          SZ=$(stat -f%z "$FRAMEWORK_NAME/W.dylib")
          echo "after framework sign: $SZ (diff $((SZ - TARGET)))"

          if [ "$SZ" != "$TARGET" ]; then
            echo "bundle sign did not produce target, trying alternatives"

            # restore thin dylib and try other variants
            cp W.thin.dylib "$FRAMEWORK_NAME/W.dylib"

            # try signing framework with identifier override
            codesign --force --sign - --timestamp=none --identifier re.frida.gadget "$FRAMEWORK_NAME" 2>&1 || true
            SZ=$(stat -f%z "$FRAMEWORK_NAME/W.dylib")
            echo "with identifier: $SZ (diff $((SZ - TARGET)))"

            if [ "$SZ" != "$TARGET" ]; then
              echo "::error::cannot match target $TARGET"
              echo "closest frameworks:"
              ls -la "$FRAMEWORK_NAME/W.dylib"
              exit 1
            fi
          fi

      - name: Zero signature blob
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import struct
          path = "Frida.framework/W.dylib"
          with open(path, "rb") as f:
              d = bytearray(f.read())
          n = struct.unpack_from("<I", d, 16)[0]
          o = 32
          for _ in range(n):
              c, s = struct.unpack_from("<II", d, o)
              if c == 0x1d:
                  off, sz = struct.unpack_from("<II", d, o + 8)
                  print("sig offset=" + str(off) + " size=" + str(sz))
                  for i in range(off, off + sz):
                      d[i] = 0
                  break
              o += s
          with open(path, "wb") as f:
              f.write(d)
          print("done")
          PYEOF

      - name: Compare with dev thin
        run: |
          set -euo pipefail
          cp "$FRAMEWORK_NAME/W.dylib" W.thin.dylib
          echo "dev thin:  $(stat -f%z W.dev.thin.dylib)"
          echo "ours thin: $(stat -f%z W.thin.dylib)"
          python3 - << 'PYEOF'
          with open("W.dev.thin.dylib", "rb") as f: dev = f.read()
          with open("W.thin.dylib", "rb") as f: ours = f.read()
          if len(dev) != len(ours):
              print("SIZE MISMATCH: dev=" + str(len(dev)) + " ours=" + str(len(ours)) + " diff=" + str(abs(len(dev)-len(ours))))
          n = min(len(dev), len(ours))
          diffs = [i for i in range(n) if dev[i] != ours[i]]
          print("diffs: " + str(len(diffs)))
          for i in diffs[:32]:
              print("  off 0x%x: dev=%02x ours=%02x" % (i, dev[i], ours[i]))
          if not diffs and len(dev) == len(ours):
              print("PERFECT")
          PYEOF

      - name: Wrap into fat binary
        run: |
          set -euo pipefail
          lipo -create -arch arm64 W.thin.dylib -output W.dylib
          echo "fat: $(stat -f%z W.dylib)"

      - name: Compare with dev fat
        run: |
          set -euo pipefail
          echo "dev fat:  $(stat -f%z W.dev.dylib)"
          echo "ours fat: $(stat -f%z W.dylib)"
          python3 - << 'PYEOF'
          with open("W.dev.dylib", "rb") as f: dev = f.read()
          with open("W.dylib", "rb") as f: ours = f.read()
          n = min(len(dev), len(ours))
          diffs = [i for i in range(n) if dev[i] != ours[i]]
          print("diffs: " + str(len(diffs)))
          if not diffs and len(dev) == len(ours):
              print("PERFECT")
          PYEOF

      - name: Final assemble
        run: |
          set -euo pipefail
          cp W.dylib "$FRAMEWORK_NAME/W.dylib"
          plutil -lint "$FRAMEWORK_NAME/Info.plist"

      - name: Package
        run: |
          set -euo pipefail
          find "$FRAMEWORK_NAME" -name ".DS_Store" -delete
          find "$FRAMEWORK_NAME" -name "._*" -delete
          xattr -cr "$FRAMEWORK_NAME" 2>/dev/null || true
          ditto -c -k --sequesterRsrc --keepParent "$FRAMEWORK_NAME" Frida.framework.zip
          shasum -a 256 Frida.framework.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Frida.framework
          path: Frida.framework.zip
          retention-days: 30
          if-no-files-found: error