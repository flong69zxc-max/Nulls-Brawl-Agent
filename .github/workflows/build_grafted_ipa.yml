name: Build Clean Frida IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve agent script
        id: agent
        run: |
          set -euo pipefail
          for p in scripts/agents.js scripts/agent.js agent/agents.js agent/agent.js scripts/frida-scripts/agent.js; do
            if [ -f "$p" ]; then echo "path=$p" >> "$GITHUB_OUTPUT"; echo "found: $p"; exit 0; fi
          done
          echo "::error::agent script not found"
          find . -maxdepth 3 -name "*.js" -not -path "./node_modules/*" -not -path "./ghidra/*"
          exit 1

      - uses: actions/cache@v4
        id: cache-gadget
        with:
          path: gadget-cache
          key: frida-gadget-17.9.7-ios-universal-v1

      - name: Download Frida Gadget
        if: steps.cache-gadget.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p gadget-cache
          META=$(curl -sL -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/frida/frida/releases/tags/17.9.7")
          URL=$(echo "$META" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for a in d.get('assets',[]):
              n=a['name']
              if 'gadget' in n and 'ios' in n and n.endswith('.dylib.xz'):
                  print(a['browser_download_url']); break
          ")
          test -n "$URL"
          curl -fL -o /tmp/frida.xz "$URL"
          xz -d /tmp/frida.xz
          mv /tmp/frida gadget-cache/FridaGadget.dylib
          file gadget-cache/FridaGadget.dylib

      - uses: actions/cache@v4
        id: cache-ipa
        with:
          path: ipa-cache
          key: nulls-brawl-ipa-v1

      - name: Download Nulls Brawl IPA
        if: steps.cache-ipa.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ipa-cache
          curl -fL -A "Mozilla/5.0" -o ipa-cache/bs.ipa "https://dnull.xyz/latest_bs_i"
          test -s ipa-cache/bs.ipa

      - name: Extract and Clean IPA
        id: extract
        run: |
          set -euo pipefail
          rm -rf build/extract
          mkdir -p build/extract
          unzip -q ipa-cache/bs.ipa -d build/extract
          APP_DIR=$(find build/extract/Payload -maxdepth 1 -type d -name "*.app" | head -n1)
          test -n "$APP_DIR"
          BIN="$APP_DIR/Nulls Brawl"
          if [ ! -f "$BIN" ]; then
            BIN=$(find "$APP_DIR" -maxdepth 1 -type f -perm +111 ! -name "*.dylib" ! -name "*.png" | head -n1)
          fi
          test -f "$BIN"
          rm -rf "$APP_DIR/Frameworks/Frida.framework"
          rm -rf "$APP_DIR/Frameworks/Cephei.framework"
          rm -rf "$APP_DIR/Frameworks/CepheiPrefs.framework"
          rm -f "$APP_DIR/Frameworks/FridaGadget.dylib"
          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"
          file "$BIN"

      - name: Build FridaGadget.framework
        run: |
          set -euo pipefail
          APP_DIR="${{ steps.extract.outputs.app_dir }}"
          FW="$APP_DIR/Frameworks/FridaGadget.framework"
          mkdir -p "$FW"
          cp gadget-cache/FridaGadget.dylib "$FW/FridaGadget"
          chmod +x "$FW/FridaGadget"
          cp "${{ steps.agent.outputs.path }}" "$FW/agent.js"
          cat > "$FW/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>FridaGadget</string>
              <key>CFBundleIdentifier</key>
              <string>re.frida.gadget</string>
              <key>CFBundleName</key>
              <string>FridaGadget</string>
              <key>CFBundlePackageType</key>
              <string>FMWK</string>
              <key>CFBundleShortVersionString</key>
              <string>17.9.7</string>
              <key>CFBundleVersion</key>
              <string>17.9.7</string>
              <key>MinimumOSVersion</key>
              <string>11.0</string>
          </dict>
          </plist>
          EOF
          cat > "$FW/FridaGadget.config" << 'EOF'
          {
            "interaction": {
              "type": "script",
              "path": "agent.js",
              "on_change": "ignore"
            },
            "code_signing": "required"
          }
          EOF
          ls -la "$FW"

      - name: Install tools
        run: |
          set -euo pipefail
          brew install ldid
          git clone --depth 1 https://github.com/tyilo/insert_dylib.git /tmp/insert_dylib
          cd /tmp/insert_dylib
          xcodebuild -project insert_dylib.xcodeproj -scheme insert_dylib -configuration Release SYMROOT="$PWD/build" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -5
          sudo cp build/Release/insert_dylib /usr/local/bin/
          sudo chmod +x /usr/local/bin/insert_dylib
          which insert_dylib ldid

      - name: Inject dylib
        run: |
          set -euo pipefail
          BIN="${{ steps.extract.outputs.bin }}"
          insert_dylib --weak --all-yes "@executable_path/Frameworks/FridaGadget.framework/FridaGadget" "$BIN" "$BIN.patched"
          mv "$BIN.patched" "$BIN"
          chmod +x "$BIN"
          otool -L "$BIN" | grep -i frida || echo "no frida load command"

      - name: Sign
        run: |
          set -euo pipefail
          APP_DIR="${{ steps.extract.outputs.app_dir }}"
          BIN="${{ steps.extract.outputs.bin }}"
          FW="$APP_DIR/Frameworks/FridaGadget.framework"
          ldid -S "$FW/FridaGadget"
          ldid -S "$BIN"
          echo "signed"

      - name: Repack IPA
        run: |
          set -euo pipefail
          cd build/extract
          rm -f ../bs_patched.ipa
          zip -qry ../bs_patched.ipa Payload
          cd ..
          ls -la bs_patched.ipa

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="brawl-clean-$(date +%Y%m%d)-r${{ github.run_number }}"
          gh release create "$TAG" build/bs_patched.ipa --title "$TAG" --notes "Frida 17.9.7 clean build"

      - uses: actions/upload-artifact@v4
        with:
          name: brawl-clean-ipa
          path: build/bs_patched.ipa
          retention-days: 7