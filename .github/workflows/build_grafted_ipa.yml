name: Diagnostic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Download stock
        run: |
          set -euo pipefail
          URL="https://github.com/frida/frida/releases/download/17.2.11/frida-gadget-17.2.11-ios-universal.dylib.xz"
          curl -fL --retry 3 -o gadget.xz "$URL"
          xz -d gadget.xz
          mv gadget W.fat.dylib
          echo "=== fat info ==="
          file W.fat.dylib
          lipo -info W.fat.dylib
          ls -la W.fat.dylib

      - name: Extract thin arm64
        run: |
          set -euo pipefail
          lipo -thin arm64 -output W.thin.dylib W.fat.dylib
          file W.thin.dylib
          ls -la W.thin.dylib

      - name: Parse code signature
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import struct

          with open("W.thin.dylib", "rb") as f:
              data = f.read()

          print(f"thin size: {len(data)}")
          print(f"head: {data[:32].hex()}")
          print(f"tail: {data[-32:].hex()}")

          magic = struct.unpack_from("<I", data, 0)[0]
          ncmds = struct.unpack_from("<I", data, 16)[0]
          cmd_off = 32
          for _ in range(ncmds):
              cmd, cmdsize = struct.unpack_from("<II", data, cmd_off)
              if cmd == 0x1d:
                  off, size = struct.unpack_from("<II", data, cmd_off + 8)
                  print(f"LC_CODE_SIGNATURE: offset={off} size={size}")
                  print(f"last 32 bytes of blob: {data[off+size-32:off+size].hex()}")
              elif cmd == 0x1b:
                  uuid = data[cmd_off+8:cmd_off+24]
                  print(f"LC_UUID: {uuid.hex()}")
              cmd_off += cmdsize
          PYEOF

      - name: Rebuild fat
        run: |
          set -euo pipefail
          lipo -create -arch arm64 W.thin.dylib -output W.fat.rebuild.dylib
          file W.fat.rebuild.dylib
          lipo -info W.fat.rebuild.dylib
          ls -la W.fat.rebuild.dylib
          head -c 32 W.fat.rebuild.dylib