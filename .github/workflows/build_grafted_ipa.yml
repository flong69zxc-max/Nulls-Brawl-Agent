name: Build Frida.framework (17.19.0 gum-graft)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      FRIDA_VERSION: '17.19.0'
      FRAMEWORK_NAME: Frida.framework
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Download Frida Gadget
        run: |
          set -euo pipefail
          URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gadget-${FRIDA_VERSION}-ios-universal.dylib.xz"
          curl -fL --retry 3 -o gadget.xz "$URL"
          xz -d gadget.xz
          mv gadget W.fat.dylib
          lipo -thin arm64 -output W.thin.dylib W.fat.dylib
          echo "thin before: $(stat -f%z W.thin.dylib)"

      - name: Remove signature
        run: |
          set -euo pipefail
          codesign --remove-signature W.thin.dylib 2>&1 || true
          echo "unsigned: $(stat -f%z W.thin.dylib)"

      - name: Download gum-graft
        run: |
          set -euo pipefail
          URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/gum-graft-${FRIDA_VERSION}-macos-arm64.xz"
          curl -fL --retry 3 -o gum-graft.xz "$URL"
          xz -d gum-graft.xz
          chmod +x gum-graft
          file gum-graft
          echo "GUM_GRAFT=$(realpath gum-graft)" >> "$GITHUB_ENV"

      - name: Run gum-graft
        run: |
          set -euo pipefail
          echo "before: $(stat -f%z W.thin.dylib)"
          "$GUM_GRAFT" --ingest-imports W.thin.dylib 2>&1 | tail -20 || true
          sz=$(stat -f%z W.thin.dylib)
          echo "after: $sz"
          if [ "$sz" = "$(stat -f%z W.fat.dylib)" ]; then
            echo "::error::gum-graft did not change thin size"
            exit 1
          fi
          otool -l W.thin.dylib | grep -iE "graft|__FRIDA" || echo "no graft sections, but size changed"

      - name: Build Frida.framework
        run: |
          set -euo pipefail
          rm -rf "$FRAMEWORK_NAME"
          mkdir -p "$FRAMEWORK_NAME"
          cp W.thin.dylib "$FRAMEWORK_NAME/W.dylib"

          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '    <key>CFBundleExecutable</key>' \
            '    <string>W.dylib</string>' \
            '    <key>CFBundleIdentifier</key>' \
            '    <string>re.frida.gadget</string>' \
            '    <key>CFBundleShortVersionString</key>' \
            '    <string>17.19.0</string>' \
            '    <key>CFBundleVersion</key>' \
            '    <string>17.19.0</string>' \
            '    <key>CFBundleName</key>' \
            '    <string>Frida</string>' \
            '    <key>CFBundlePackageType</key>' \
            '    <string>FMWK</string>' \
            '    <key>CFBundleSupportedPlatforms</key>' \
            '    <array>' \
            '        <string>iPhoneOS</string>' \
            '    </array>' \
            '    <key>DTPlatformName</key>' \
            '    <string>iphoneos</string>' \
            '    <key>MinimumOSVersion</key>' \
            '    <string>12.0</string>' \
            '</dict>' \
            '</plist>' \
            > "$FRAMEWORK_NAME/Info.plist"

          printf '%s\n' \
            '{' \
            '  "interaction": {' \
            '    "type": "script",' \
            '    "path": "agent.js",' \
            '    "on_change": "ignore"' \
            '  },' \
            '  "code_signing": "required"' \
            '}' \
            > "$FRAMEWORK_NAME/W.config"

          printf '%s\n' 'rpc.exports = { init: function () { return true; } };' > "$FRAMEWORK_NAME/agent.js"
          plutil -lint "$FRAMEWORK_NAME/Info.plist"

      - name: Sign framework with codesign
        run: |
          set -euo pipefail
          codesign --force --sign - --timestamp=none "$FRAMEWORK_NAME" 2>&1 || {
            echo "::error::codesign failed"
            exit 1
          }
          echo "=== framework signed ==="
          codesign -dvvv "$FRAMEWORK_NAME/W.dylib" 2>&1 | head -15 || true
          echo "dylib size after sign: $(stat -f%z $FRAMEWORK_NAME/W.dylib)"

      - name: Copy signed thin and wrap into fat
        run: |
          set -euo pipefail
          cp "$FRAMEWORK_NAME/W.dylib" W.thin.signed.dylib
          lipo -create -arch arm64 W.thin.signed.dylib -output W.dylib
          echo "fat: $(stat -f%z W.dylib)"
          file W.dylib
          otool -l W.dylib | grep -A4 LC_BUILD_VERSION | head -10 || true

      - name: Replace framework dylib with fat
        run: |
          set -euo pipefail
          cp W.dylib "$FRAMEWORK_NAME/W.dylib"
          echo "final framework contents:"
          find "$FRAMEWORK_NAME" -type f -exec ls -la {} \;

      - name: Verify signature slice
        run: |
          set -euo pipefail
          codesign -dvvv "$FRAMEWORK_NAME/W.dylib" 2>&1 | head -15 || true
          echo ""
          echo "=== check code signature in fat ==="
          python3 - << 'PYEOF'
          import struct

          with open("Frida.framework/W.dylib", "rb") as f:
              data = f.read()

          magic = struct.unpack_from(">I", data, 0)[0]
          print("magic: 0x%x" % magic)

          if magic != 0xcafebabe:
              print("not fat")
              raise SystemExit(1)

          nfat = struct.unpack_from(">I", data, 4)[0]
          print("nfat: %d" % nfat)

          for i in range(nfat):
              base = 8 + i * 20
              cputype, cpusub, offset, size, align = struct.unpack_from(">IIIII", data, base)
              print("  slice[%d] cputype=0x%x offset=%d size=%d" % (i, cputype, offset, size))

              slice = data[offset:offset+size]
              ncmds = struct.unpack_from("<I", slice, 16)[0]
              cmd_off = 32
              for _ in range(ncmds):
                  cmd, cmdsize = struct.unpack_from("<II", slice, cmd_off)
                  if cmd == 0x1d:
                      off, sz = struct.unpack_from("<II", slice, cmd_off + 8)
                      print("    LC_CODE_SIGNATURE: offset=%d size=%d (relative)" % (off, sz))
                      print("    absolute offset in fat: %d" % (offset + off))
                      break
                  cmd_off += cmdsize
          PYEOF

      - name: Package
        run: |
          set -euo pipefail
          find "$FRAMEWORK_NAME" -name ".DS_Store" -delete
          find "$FRAMEWORK_NAME" -name "._*" -delete
          xattr -cr "$FRAMEWORK_NAME" 2>/dev/null || true
          ditto -c -k --sequesterRsrc --keepParent "$FRAMEWORK_NAME" Frida.framework.zip
          echo "zip: $(stat -f%z Frida.framework.zip) bytes"
          shasum -a 256 Frida.framework.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Frida.framework
          path: Frida.framework.zip
          retention-days: 30
          if-no-files-found: error