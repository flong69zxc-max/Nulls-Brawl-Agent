name: Compare Dev W.dylib with Frida Stock

on:
  push:
    branches: [main]
    paths:
      - 'W.dylib.zip'
      - '.github/workflows/compare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Unpack dev dylib
        run: |
          set -euo pipefail
          mkdir -p dev_unpacked
          unzip -o W.dylib.zip -d dev_unpacked
          echo "=== unpacked contents ==="
          find dev_unpacked -type f
          DEV=$(find dev_unpacked -type f -name "*.dylib" | head -1)
          if [ -z "$DEV" ]; then
            DEV=$(find dev_unpacked -type f | head -1)
          fi
          echo "using dev file: $DEV"
          cp "$DEV" W.dev.raw.dylib
          file W.dev.raw.dylib
          echo "=== lipo ==="
          lipo -info W.dev.raw.dylib || true
          echo "=== arch ==="
          otool -hv W.dev.raw.dylib | head -5

      - name: Prepare dev thin slice
        run: |
          set -euo pipefail
          if lipo -info W.dev.raw.dylib 2>/dev/null | grep -q "Non-fat"; then
            cp W.dev.raw.dylib W.dev.dylib
            echo "already thin"
          else
            if lipo -info W.dev.raw.dylib | grep -q "arm64e"; then
              lipo -thin arm64e -output W.dev.dylib W.dev.raw.dylib
            else
              lipo -thin arm64 -output W.dev.dylib W.dev.raw.dylib
            fi
          fi
          file W.dev.dylib
          echo "dev size: $(stat -f%z W.dev.dylib) bytes"

      - name: Download stock Frida versions
        run: |
          set -euo pipefail
          mkdir -p stock
          VERSIONS="17.0.0 17.1.0 17.2.0 17.2.9 17.2.17 17.3.0 17.3.1 17.4.0 17.4.2 17.5.0 17.6.0 17.7.0 17.8.0 17.9.0 17.9.7"
          for v in $VERSIONS; do
            URL="https://github.com/frida/frida/releases/download/${v}/frida-gadget-${v}-ios-universal.dylib.xz"
            if curl -fL --retry 2 --connect-timeout 10 -o "stock/${v}.xz" "$URL" 2>/dev/null; then
              (cd stock && xz -d "${v}.xz" && mv "${v}" "${v}.dylib" 2>/dev/null) || true
              if [ ! -f "stock/${v}.dylib" ]; then
                echo "$v: extraction failed"
                continue
              fi
              if lipo -info "stock/${v}.dylib" 2>/dev/null | grep -q "Non-fat"; then
                cp "stock/${v}.dylib" "stock/${v}.thin.dylib"
              else
                if lipo -info "stock/${v}.dylib" | grep -q "arm64e"; then
                  lipo -thin arm64e -output "stock/${v}.thin.dylib" "stock/${v}.dylib"
                else
                  lipo -thin arm64 -output "stock/${v}.thin.dylib" "stock/${v}.dylib"
                fi
              fi
              echo "$v: $(stat -f%z stock/${v}.thin.dylib) bytes"
            else
              echo "$v: download failed"
            fi
          done
          echo "=== available stock files ==="
          ls -la stock/*.thin.dylib 2>/dev/null || echo "none"

      - name: Install LIEF
        run: |
          set -euo pipefail
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install lief==0.17.5
          python3 -c "import lief; print('lief', lief.__version__)"

      - name: Find closest stock version
        run: |
          set -euo pipefail
          source venv/bin/activate
          python3 - <<'PYEOF'
          import lief, os, hashlib, glob, sys, json

          def info(path):
              try:
                  m = lief.MachO.parse(path).at(0)
              except Exception as e:
                  return None
              secs = []
              for seg in m.segments:
                  for sec in seg.sections:
                      secs.append((seg.name, sec.name, sec.size))
              with open(path, 'rb') as f:
                  head = f.read(65536)
              return {
                  'size': os.path.getsize(path),
                  'hash': hashlib.sha256(head).hexdigest()[:16],
                  'sections': secs,
                  'section_count': len(secs),
              }

          dev = info('W.dev.dylib')
          print(f"[dev] size={dev['size']} hash64k={dev['hash']} sections={dev['section_count']}")

          results = []
          for p in sorted(glob.glob('stock/*.thin.dylib')):
              v = os.path.basename(p).replace('.thin.dylib', '')
              s = info(p)
              if s is None:
                  print(f"[{v}] parse error")
                  continue
              results.append((v, s))
              print(f"[{v}] size={s['size']} hash64k={s['hash']} sections={s['section_count']}")

          if not results:
              print("::error::no stock files available")
              sys.exit(1)

          def score(s):
              size_diff = abs(s['size'] - dev['size'])
              sec_diff = abs(s['section_count'] - dev['section_count'])
              return size_diff + sec_diff * 10000

          results.sort(key=lambda x: score(x[1]))
          best_v, best_s = results[0]
          print(f"\n[closest] {best_v}")
          print(f"  dev size={dev['size']} vs stock size={best_s['size']} (diff={dev['size']-best_s['size']})")
          print(f"  dev sections={dev['section_count']} vs stock sections={best_s['section_count']}")

          with open('closest.txt', 'w') as f:
              f.write(best_v)

          # section name comparison
          dev_names = set((s[0], s[1]) for s in dev['sections'])
          stock_names = set((s[0], s[1]) for s in best_s['sections'])
          only_dev = dev_names - stock_names
          only_stock = stock_names - dev_names
          with open('section-name-diff.txt', 'w') as f:
              f.write("sections only in DEV:\n")
              for x in sorted(only_dev): f.write(f"  {x}\n")
              f.write("\nsections only in STOCK:\n")
              for x in sorted(only_stock): f.write(f"  {x}\n")
          print(f"  sections only in dev: {len(only_dev)}")
          print(f"  sections only in stock: {len(only_stock)}")
          PYEOF
          cat closest.txt

      - name: Detailed byte diff per section
        run: |
          set -euo pipefail
          source venv/bin/activate
          CLOSEST=$(cat closest.txt)
          export CLOSEST
          python3 - <<'PYEOF'
          import lief, os, sys

          CLOSEST = os.environ['CLOSEST']

          def section_map(path):
              m = lief.MachO.parse(path).at(0)
              r = {}
              for seg in m.segments:
                  for sec in seg.sections:
                      r[(seg.name, sec.name)] = sec
              return r

          secs_dev = section_map('W.dev.dylib')
          secs_stock = section_map(f'stock/{CLOSEST}.thin.dylib')

          with open('W.dev.dylib', 'rb') as f:
              data_dev = f.read()
          with open(f'stock/{CLOSEST}.thin.dylib', 'rb') as f:
              data_stock = f.read()

          report = open('diff-report.txt', 'w')
          def w(line):
              print(line)
              report.write(line + '\n')

          w(f'=== diff report ===')
          w(f'dev size: {len(data_dev)}')
          w(f'stock size: {len(data_stock)} ({CLOSEST})')
          w('')

          common = sorted(secs_dev.keys() & secs_stock.keys())
          w(f'=== byte diffs in {len(common)} common sections ===')
          for k in common:
              sd = secs_dev[k]
              ss = secs_stock[k]
              if sd.size != ss.size:
                  w(f'[{k[0]},{k[1]}] size differs: dev={sd.size} stock={ss.size}')
                  continue
              if sd.offset == 0 or ss.offset == 0:
                  continue
              dd = data_dev[sd.offset:sd.offset+sd.size]
              ds = data_stock[ss.offset:ss.offset+ss.size]
              if dd == ds:
                  continue
              diffs = [i for i in range(len(dd)) if dd[i] != ds[i]]
              w(f'[{k[0]},{k[1]}] size={sd.size} diff_bytes={len(diffs)}')
              for i in diffs[:300]:
                  w(f'  off 0x{i:x}: stock={ds[i]:02x} dev={dd[i]:02x}')
              if len(diffs) > 300:
                  w(f'  ... and {len(diffs)-300} more')

          report.close()
          print('diff-report.txt written')
          PYEOF

      - name: BRK and abort analysis
        run: |
          set -euo pipefail
          source venv/bin/activate
          CLOSEST=$(cat closest.txt)
          export CLOSEST
          python3 - <<'PYEOF'
          import os

          CLOSEST = os.environ['CLOSEST']

          patterns = [
              (bytes.fromhex('20A720D4'), 'brk #0x539'),
              (bytes.fromhex('200020D4'), 'brk #1'),
              (bytes.fromhex('1F2003D5'), 'nop'),
              (bytes.fromhex('C0035FD6'), 'ret'),
              (bytes.fromhex('00000000'), 'nulls'),
          ]

          with open('brk-analysis.txt', 'w') as r:
              for path in ['W.dev.dylib', f'stock/{CLOSEST}.thin.dylib']:
                  with open(path, 'rb') as f:
                      data = f.read()
                  r.write(f'=== {path} (size={len(data)}) ===\n')
                  print(f'=== {path} ===')
                  for pat, name in patterns:
                      cnt = data.count(pat)
                      line = f'  {name}: {cnt}'
                      r.write(line + '\n')
                      print(line)
                  r.write('\n')
          PYEOF
          cat brk-analysis.txt

      - name: Frida version strings
        run: |
          set -euo pipefail
          echo "=== version-like strings in dev ===" > version-strings.txt
          strings W.dev.dylib | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -u | head -40 >> version-strings.txt || true
          echo "" >> version-strings.txt
          echo "=== section name diff ===" >> version-strings.txt
          cat section-name-diff.txt >> version-strings.txt
          cat version-strings.txt

      - name: Summary
        run: |
          set -euo pipefail
          CLOSEST=$(cat closest.txt)
          {
            echo "### dev vs stock comparison"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| dev size | $(stat -f%z W.dev.dylib) B |"
            echo "| closest stock | ${CLOSEST} |"
            echo "| stock size | $(stat -f%z stock/${CLOSEST}.thin.dylib) B |"
            echo ""
            echo '```'
            cat brk-analysis.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison
          path: |
            closest.txt
            diff-report.txt
            brk-analysis.txt
            version-strings.txt
            section-name-diff.txt
          retention-days: 30
          if-no-files-found: warn