name: Compare Dev W.dylib with Frida 17.2.11

on:
  push:
    branches: [main]
    paths:
      - 'W.dylib.zip'
      - '.github/workflows/compare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Unpack dev dylib
        run: |
          set -euo pipefail
          rm -rf dev_unpacked
          mkdir -p dev_unpacked
          unzip -o W.dylib.zip -d dev_unpacked
          find dev_unpacked -type f | sort

          DEV=$(find dev_unpacked -type f -name "*.dylib" ! -path "*__MACOSX*" ! -name "._*" | head -1)
          [ -n "$DEV" ] || { echo "::error::no file found"; exit 1; }
          cp "$DEV" W.dev.raw.dylib
          xattr -c W.dev.raw.dylib 2>/dev/null || true

          FILE_INFO=$(file -b W.dev.raw.dylib)
          echo "file info: $FILE_INFO"

          if echo "$FILE_INFO" | grep -q "universal"; then
            lipo -thin arm64 -output W.dev.dylib W.dev.raw.dylib
          else
            cp W.dev.raw.dylib W.dev.dylib
          fi
          file W.dev.dylib
          echo "dev size: $(stat -f%z W.dev.dylib) bytes"

      - name: Download Frida 17.2.11
        run: |
          set -euo pipefail
          mkdir -p stock
          URL="https://github.com/frida/frida/releases/download/17.2.11/frida-gadget-17.2.11-ios-universal.dylib.xz"
          curl -fL --retry 3 -o stock/17.2.11.xz "$URL"
          (cd stock && xz -d 17.2.11.xz)
          mv stock/17.2.11 stock/17.2.11.dylib

          if lipo -info stock/17.2.11.dylib 2>/dev/null | grep -q "Non-fat"; then
            cp stock/17.2.11.dylib stock/17.2.11.thin.dylib
          else
            lipo -thin arm64e -output stock/17.2.11.thin.dylib stock/17.2.11.dylib
          fi
          file stock/17.2.11.thin.dylib
          echo "stock size: $(stat -f%z stock/17.2.11.thin.dylib) bytes"

      - name: Install LIEF
        run: |
          set -euo pipefail
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install "lief>=0.17.2"
          python3 -c "import lief; print('lief', lief.__version__)"

      - name: Write analysis script
        run: |
          set -euo pipefail
          mkdir -p scripts

          printf '%s\n' \
            'import lief, sys' \
            '' \
            'def get_sections(path):' \
            '    try:' \
            '        fat = lief.MachO.parse(path)' \
            '        if fat is None: return None' \
            '        binary = fat.at(0)' \
            '        if binary is None: return None' \
            '        sections = {}' \
            '        for seg in binary.segments:' \
            '            for sec in seg.sections:' \
            '                sections[(seg.name, sec.name)] = sec' \
            '        return sections' \
            '    except Exception as e:' \
            '        print(f"::error::exception parsing {path}: {e}")' \
            '        return None' \
            '' \
            'secs_dev = get_sections("W.dev.dylib")' \
            'secs_stock = get_sections("stock/17.2.11.thin.dylib")' \
            'if secs_dev is None or secs_stock is None:' \
            '    sys.exit(1)' \
            '' \
            'with open("W.dev.dylib", "rb") as f: data_dev = f.read()' \
            'with open("stock/17.2.11.thin.dylib", "rb") as f: data_stock = f.read()' \
            '' \
            'out = open("diff-report.txt", "w")' \
            'def w(line):' \
            '    print(line)' \
            '    out.write(line + "\n")' \
            '' \
            'w(f"=== dev vs stock 17.2.11 ===")' \
            'w(f"dev size:   {len(data_dev)}")' \
            'w(f"stock size: {len(data_stock)}")' \
            'w(f"diff:       {len(data_dev) - len(data_stock)}")' \
            'w("")' \
            '' \
            'common = sorted(secs_dev.keys() & secs_stock.keys())' \
            'only_dev = sorted(set(secs_dev.keys()) - set(secs_stock.keys()))' \
            'only_stock = sorted(set(secs_stock.keys()) - set(secs_dev.keys()))' \
            '' \
            'if only_dev:' \
            '    w("=== only in DEV ===")' \
            '    for x in only_dev: w(f"  {x}")' \
            'if only_stock:' \
            '    w("=== only in STOCK ===")' \
            '    for x in only_stock: w(f"  {x}")' \
            'w("")' \
            '' \
            'total = 0' \
            'for k in common:' \
            '    sd = secs_dev[k]' \
            '    ss = secs_stock[k]' \
            '    if sd.size != ss.size:' \
            '        w(f"[{k[0]},{k[1]}] SIZE dev=0x{sd.size:x} stock=0x{ss.size:x}")' \
            '        continue' \
            '    if sd.offset == 0 or ss.offset == 0: continue' \
            '    if sd.offset + sd.size > len(data_dev) or ss.offset + ss.size > len(data_stock): continue' \
            '    dd = data_dev[sd.offset:sd.offset+sd.size]' \
            '    ds = data_stock[ss.offset:ss.offset+ss.size]' \
            '    if dd == ds: continue' \
            '    diffs = [i for i in range(len(dd)) if dd[i] != ds[i]]' \
            '    total += len(diffs)' \
            '    w(f"[{k[0]},{k[1]}] size=0x{sd.size:x} diff={len(diffs)}")' \
            '    for i in diffs[:500]:' \
            '        w(f"  off 0x{i:x}: stock={ds[i]:02x} dev={dd[i]:02x}")' \
            '    if len(diffs) > 500:' \
            '        w(f"  ... and {len(diffs)-500} more")' \
            '' \
            'w("")' \
            'w(f"=== total diff bytes: {total} ===")' \
            'out.close()' \
            > scripts/diff.py

          printf '%s\n' \
            'patterns = [' \
            '    (bytes.fromhex("20A720D4"), "brk539"),' \
            '    (bytes.fromhex("200020D4"), "brk1"),' \
            '    (bytes.fromhex("1F2003D5"), "nop"),' \
            '    (bytes.fromhex("C0035FD6"), "ret"),' \
            '    (bytes.fromhex("00000000"), "nulls"),' \
            ']' \
            'out = open("brk-analysis.txt", "w")' \
            'for path in ["W.dev.dylib", "stock/17.2.11.thin.dylib"]:' \
            '    with open(path, "rb") as f: data = f.read()' \
            '    out.write(f"=== {path} (size={len(data)}) ===\n")' \
            '    print(f"=== {path} ===")' \
            '    for pat, name in patterns:' \
            '        cnt = data.count(pat)' \
            '        out.write(f"  {name}: {cnt}\n")' \
            '        print(f"  {name}: {cnt}")' \
            '    out.write("\n")' \
            'out.close()' \
            > scripts/brk.py

          echo "scripts written"

      - name: Run diff analysis
        run: |
          set -euo pipefail
          source venv/bin/activate
          python3 scripts/diff.py || echo "::warning::diff script failed"

      - name: Run BRK analysis
        run: |
          set -euo pipefail
          source venv/bin/activate
          python3 scripts/brk.py

      - name: Version strings
        run: |
          set -euo pipefail
          {
            echo "=== version strings in dev ==="
            strings W.dev.dylib | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -u | head -40 || true
            echo ""
            echo "=== version strings in stock 17.2.11 ==="
            strings stock/17.2.11.thin.dylib | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -u | head -40 || true
          } > version-strings.txt
          cat version-strings.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison
          path: |
            diff-report.txt
            brk-analysis.txt
            version-strings.txt
            scripts/
          retention-days: 30
          if-no-files-found: warn