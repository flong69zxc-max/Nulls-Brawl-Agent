name: Cleanup repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove junk files
        run: |
          set -euo pipefail
          git rm -f .github/workflows/compare.yml 2>/dev/null || true
          git rm -f .github/workflows/create.yml 2>/dev/null || true
          git rm -rf FridaGadget.framework 2>/dev/null || true
          git rm -f offsets_report.txt 2>/dev/null || true
          git rm -f offsets_resolved.js 2>/dev/null || true
          git rm -f scripts/agent.js 2>/dev/null || true

      - name: Add .gitignore
        run: |
          cat > .gitignore << 'EOF'
          # Generated artifacts
          FridaGadget.framework/
          offsets_report.txt
          offsets_resolved.js
          scripts/agent.js

          # Build outputs
          dist/
          .meta/

          # Node
          node_modules/
          package-lock.json

          # macOS
          .DS_Store
          __MACOSX/
          ._*
          EOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .gitignore
          git commit -m "chore: cleanup junk files" || echo "nothing to commit"
          git push