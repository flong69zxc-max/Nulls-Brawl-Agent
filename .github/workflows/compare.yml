name: Compare Dev W.dylib with Frida 17.2.11

on:
  push:
    branches: [main]
    paths:
      - 'W.dylib.zip'
      - '.github/workflows/compare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Unpack and identify dev dylib
        run: |
          set -euo pipefail
          mkdir -p dev_unpacked
          unzip -o W.dylib.zip -d dev_unpacked
          echo "=== unpacked contents ==="
          find dev_unpacked -type f

          DEV=$(find dev_unpacked -type f -name "*.dylib" | head -1)
          if [ -z "$DEV" ]; then
            DEV=$(find dev_unpacked -type f | head -1)
          fi
          echo "using dev file: $DEV"
          cp "$DEV" W.dev.raw.dylib

          echo "=== file type ==="
          file W.dev.raw.dylib
          echo "=== first 64 bytes (hex) ==="
          xxd W.dev.raw.dylib | head -8
          echo "=== size ==="
          stat -f%z W.dev.raw.dylib

      - name: Extract dev thin slice (if needed)
        run: |
          set -euo pipefail
          # Проверяем, является ли файл Mach-O
          if ! file W.dev.raw.dylib | grep -q "Mach-O"; then
            echo "::error::W.dev.raw.dylib is not a Mach-O file"
            echo "file type: $(file W.dev.raw.dylib)"
            exit 1
          fi

          if lipo -info W.dev.raw.dylib 2>/dev/null | grep -q "Non-fat"; then
            cp W.dev.raw.dylib W.dev.dylib
            echo "already thin"
          else
            if lipo -info W.dev.raw.dylib | grep -q "arm64e"; then
              lipo -thin arm64e -output W.dev.dylib W.dev.raw.dylib
            else
              lipo -thin arm64 -output W.dev.dylib W.dev.raw.dylib
            fi
          fi
          file W.dev.dylib
          echo "dev size: $(stat -f%z W.dev.dylib) bytes"

      - name: Download Frida 17.2.11 stock
        run: |
          set -euo pipefail
          mkdir -p stock
          URL="https://github.com/frida/frida/releases/download/17.2.11/frida-gadget-17.2.11-ios-universal.dylib.xz"
          echo "downloading ${URL}"
          if curl -fL --retry 3 -o stock/17.2.11.xz "$URL"; then
            (cd stock && xz -d 17.2.11.xz)
            mv stock/17.2.11 stock/17.2.11.dylib 2>/dev/null || true
            if lipo -info stock/17.2.11.dylib 2>/dev/null | grep -q "Non-fat"; then
              cp stock/17.2.11.dylib stock/17.2.11.thin.dylib
            else
              lipo -thin arm64e -output stock/17.2.11.thin.dylib stock/17.2.11.dylib
            fi
            echo "stock size: $(stat -f%z stock/17.2.11.thin.dylib) bytes"
          else
            echo "::error::Failed to download Frida 17.2.11"
            exit 1
          fi

      - name: Install LIEF
        run: |
          set -euo pipefail
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install lief==0.17.5
          python3 -c "import lief; print('lief', lief.__version__)"

      - name: Compare dev vs stock 17.2.11
        run: |
          set -euo pipefail
          source venv/bin/activate
          python3 - <<'PYEOF'
          import lief, os

          def section_map(path):
              m = lief.MachO.parse(path).at(0)
              r = {}
              for seg in m.segments:
                  for sec in seg.sections:
                      r[(seg.name, sec.name)] = sec
              return r, m

          secs_dev, m_dev = section_map('W.dev.dylib')
          secs_stock, m_stock = section_map('stock/17.2.11.thin.dylib')

          with open('W.dev.dylib', 'rb') as f:
              data_dev = f.read()
          with open('stock/17.2.11.thin.dylib', 'rb') as f:
              data_stock = f.read()

          report = open('diff-report.txt', 'w')
          def w(line):
              print(line)
              report.write(line + '\n')

          w(f'=== dev vs stock 17.2.11 ===')
          w(f'dev size: {len(data_dev)}')
          w(f'stock size: {len(data_stock)}')
          w('')

          w(f'=== dev sections: {len(secs_dev)} ===')
          for k in sorted(secs_dev.keys()):
              w(f'  {k[0]},{k[1]} size=0x{secs_dev[k].size:x}')
          w('')
          w(f'=== stock sections: {len(secs_stock)} ===')
          for k in sorted(secs_stock.keys()):
              w(f'  {k[0]},{k[1]} size=0x{secs_stock[k].size:x}')
          w('')

          common = sorted(secs_dev.keys() & secs_stock.keys())
          w(f'=== common sections: {len(common)} ===')
          total_diffs = 0
          for k in common:
              sd = secs_dev[k]
              ss = secs_stock[k]
              if sd.size != ss.size:
                  w(f'[{k[0]},{k[1]}] SIZE DIFFERS: dev=0x{sd.size:x} stock=0x{ss.size:x}')
                  continue
              if sd.offset == 0 or ss.offset == 0:
                  continue
              dd = data_dev[sd.offset:sd.offset+sd.size]
              ds = data_stock[ss.offset:ss.offset+ss.size]
              if dd == ds:
                  continue
              diffs = [i for i in range(len(dd)) if dd[i] != ds[i]]
              total_diffs += len(diffs)
              w(f'[{k[0]},{k[1]}] size=0x{sd.size:x} diff_bytes={len(diffs)}')
              for i in diffs[:500]:
                  w(f'  off 0x{i:x}: stock={ds[i]:02x} dev={dd[i]:02x}')
              if len(diffs) > 500:
                  w(f'  ... and {len(diffs)-500} more')

          w('')
          w(f'=== total diff bytes: {total_diffs} ===')

          only_dev = sorted(set(secs_dev.keys()) - set(secs_stock.keys()))
          only_stock = sorted(set(secs_stock.keys()) - set(secs_dev.keys()))
          if only_dev:
              w('=== sections only in DEV ===')
              for x in only_dev: w(f'  {x}')
          if only_stock:
              w('=== sections only in STOCK ===')
              for x in only_stock: w(f'  {x}')

          report.close()
          PYEOF

      - name: BRK and abort analysis
        run: |
          set -euo pipefail
          source venv/bin/activate
          python3 - <<'PYEOF'
          patterns = [
              (bytes.fromhex('20A720D4'), 'brk #0x539'),
              (bytes.fromhex('200020D4'), 'brk #1'),
              (bytes.fromhex('1F2003D5'), 'nop'),
              (bytes.fromhex('C0035FD6'), 'ret'),
              (bytes.fromhex('00000000'), 'nulls'),
          ]

          with open('brk-analysis.txt', 'w') as r:
              for path in ['W.dev.dylib', 'stock/17.2.11.thin.dylib']:
                  with open(path, 'rb') as f:
                      data = f.read()
                  r.write(f'=== {path} (size={len(data)}) ===\n')
                  print(f'=== {path} ===')
                  for pat, name in patterns:
                      cnt = data.count(pat)
                      line = f'  {name}: {cnt}'
                      r.write(line + '\n')
                      print(line)
                  r.write('\n')
          PYEOF
          cat brk-analysis.txt

      - name: Version strings from dev
        run: |
          set -euo pipefail
          echo "=== version-like strings in dev ===" > version-strings.txt
          strings W.dev.dylib | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -u | head -40 >> version-strings.txt || true
          echo "" >> version-strings.txt
          echo "=== interesting strings (frida, brk, abort) ===" >> version-strings.txt
          strings W.dev.dylib | grep -iE 'frida|abort|brk|gadget|gum|detect' | head -40 >> version-strings.txt || true
          cat version-strings.txt

      - name: Summary
        run: |
          set -euo pipefail
          {
            echo "### dev vs stock 17.2.11 comparison"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| dev size | $(stat -f%z W.dev.dylib) B |"
            echo "| stock size | $(stat -f%z stock/17.2.11.thin.dylib) B |"
            echo ""
            echo '```'
            cat brk-analysis.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison
          path: |
            diff-report.txt
            brk-analysis.txt
            version-strings.txt
          retention-days: 30
          if-no-files-found: warn