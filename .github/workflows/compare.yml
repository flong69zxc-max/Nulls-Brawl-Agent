name: Compare Dev W.dylib with Frida 17.2.11

on:
  push:
    branches: [main]
    paths:
      - 'W.dylib.zip'
      - '.github/workflows/compare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inspect zip
        run: |
          set -euo pipefail
          echo "=== zip listing ==="
          unzip -l W.dylib.zip

      - name: Unpack dev dylib
        run: |
          set -euo pipefail
          rm -rf dev_unpacked
          mkdir -p dev_unpacked
          unzip -o W.dylib.zip -d dev_unpacked
          echo "=== all extracted files ==="
          find dev_unpacked -type f | sort

          DEV=$(find dev_unpacked -type f -name "*.dylib" \
                  ! -path "*__MACOSX*" \
                  ! -name "._*" \
                  | head -1)

          if [ -z "$DEV" ]; then
            DEV=$(find dev_unpacked -type f \
                    ! -path "*__MACOSX*" \
                    ! -name "._*" \
                    ! -name ".DS_Store" \
                    | head -1)
          fi

          if [ -z "$DEV" ]; then
            echo "::error::no dylib found in zip"
            exit 1
          fi

          echo "using dev file: $DEV"
          cp "$DEV" W.dev.raw.dylib

          echo "=== file type ==="
          file W.dev.raw.dylib
          echo "=== first 64 bytes (hex) ==="
          xxd -l 64 W.dev.raw.dylib
          echo "=== size ==="
          stat -f%z W.dev.raw.dylib

      - name: Strip xattrs
        run: |
          set -euo pipefail
          xattr -c W.dev.raw.dylib 2>/dev/null || true

      - name: Extract dev thin slice
        run: |
          set -euo pipefail
          FILE_INFO=$(file -b W.dev.raw.dylib)
          echo "file info: $FILE_INFO"

          if echo "$FILE_INFO" | grep -q "Mach-O"; then
            if echo "$FILE_INFO" | grep -q "universal"; then
              echo "universal binary, extracting arm64"
              # Используем lipo для universal binary
              lipo -thin arm64 -output W.dev.dylib W.dev.raw.dylib
            else
              echo "already thin"
              cp W.dev.raw.dylib W.dev.dylib
            fi
          elif echo "$FILE_INFO" | grep -q "Zip archive"; then
            echo "nested zip, extracting"
            unzip -o W.dev.raw.dylib -d nested
            NESTED=$(find nested -type f -name "*.dylib" ! -name "._*" ! -path "*__MACOSX*" | head -1)
            cp "$NESTED" W.dev.dylib
          else
            echo "::error::unknown file type: $FILE_INFO"
            exit 1
          fi

          file W.dev.dylib
          echo "dev size: $(stat -f%z W.dev.dylib) bytes"

      - name: Download Frida 17.2.11 stock
        run: |
          set -euo pipefail
          mkdir -p stock
          URL="https://github.com/frida/frida/releases/download/17.2.11/frida-gadget-17.2.11-ios-universal.dylib.xz"
          echo "downloading ${URL}"
          if curl -fL --retry 3 -o stock/17.2.11.xz "$URL"; then
            (cd stock && xz -d 17.2.11.xz)
            mv stock/17.2.11 stock/17.2.11.dylib 2>/dev/null || true
            if lipo -info stock/17.2.11.dylib 2>/dev/null | grep -q "Non-fat"; then
              cp stock/17.2.11.dylib stock/17.2.11.thin.dylib
            else
              lipo -thin arm64 -output stock/17.2.11.thin.dylib stock/17.2.11.dylib
            fi
            echo "stock size: $(stat -f%z stock/17.2.11.thin.dylib) bytes"
          else
            echo "::error::Failed to download Frida 17.2.11"
            exit 1
          fi

      - name: Install LIEF
        run: |
          set -euo pipefail
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install --upgrade pip
          # Исправление: устанавливаем LIEF >= 0.17.2
          python3 -m pip install "lief>=0.17.2"
          python3 -c "import lief; print('lief', lief.__version__)"

      - name: Compare dev vs stock 17.2.11
        run: |
          set -euo pipefail
          source venv/bin/activate
          python3 - <<'PYEOF'
          import lief
          import sys

          def get_sections(path):
              """Безопасное извлечение секций из Mach-O"""
              try:
                  # Важно: сохраняем результат в переменную, чтобы избежать GC
                  fat_binary = lief.MachO.parse(path)
                  if fat_binary is None:
                      print(f"::error::Failed to parse {path}")
                      return None

                  binary = fat_binary.at(0)
                  if binary is None:
                      print(f"::error::No binary at index 0 for {path}")
                      return None

                  sections = {}
                  for segment in binary.segments:
                      for section in segment.sections:
                          sections[(segment.name, section.name)] = section
                  return sections

              except Exception as_st e:
                  print(f"::error::Exception while parsing {path}: {eock}")
                  return None

          def read_file(path):
)}              with open(path, '')
rb') as f:
                  return f.read()

          # --- Парсинг секций ---
          print("=== parsing sections ===")
          secs_dev = get_sections('W.dev.dylib')
          secs_stock = get_sections('stock/17.2.11.thin.dylib')

          if secs_dev is None or secs_stock is None:
              sys.exit(1)

          data_dev = read_file('W.dev.dylib')
          data_stock = read_file('stock/17.2.11.thin.dylib')

          report = open('diff-report.txt', 'w')
          def w(line):
              print(line)
              report.write(line + '\n')

          w(f'=== dev vs stock 17.2.11 ===')
          w(f'dev size:   {len(data_dev)}')
          w(f'stock size: {len(data_stock)}')
          w(f'diff:       {len(data_dev) - len(data_stock)}')
          w('')

          w(f         '=== sections ===')
          w w(f'  dev:   {len(secs_dev)}')
          w(f'  stock: {len(secs('')

          common = sorted(secs_dev.keys() & secs_stock.keys())
          only_dev = sorted(set(secs_dev.keys()) - set(secs_stock.keys()))
          only_stock = sorted(set(secs_stock.keys()) - set(secs_dev.keys()))

          if only_dev:
              w('=== sections only in DEV ===')
              for x in only_dev: w(f'  {x}')
          if only_stock:
              w('=== sections only in STOCK ===')
              for x in only_stock: w(f'  {x}')
          w('')

          w(f'=== byte diffs in {len(common)} common sections ===')
          total_diffs = 0
          for k in common:
              sd = secs_dev[k]
              ss = secs_stock[k]
              if sd.size != ss.size:
                  w(f'[{k[0]},{k[1]}] SIZE: dev=0x{sd.size:x} stock=0x{ss.size:x}')
                  continue
              # Проверяем offset, чтобы не выйти за пределы файла
              if sd.offset == 0 or ss.offset == 0 or sd.offset + sd.size > len(data_dev) or ss.offset + ss.size > len(data_stock):
                  continue

              dd = data_dev[sd.offset:sd.offset+sd.size]
              ds = data_stock[ss.offset:ss.offset+ss.size]
              if dd == ds:
                  continue
              diffs = [i for i in range(len(dd)) if dd[i] != ds[i]]
              total_diffs += len(diffs)
              w(f'[{k[0]},{k[1]}] size=0x{sd.size:x} diff_bytes={len(diffs)}')
              for i in diffs[:500]:
                  w(f'  off 0x{i:x}: stock={ds[i]:02x} dev={dd[i]:02x}')
              if len(diffs) > 500:
                  w(f'  ... and {len(diffs)-500} more')

          w('')
          w(f'=== total diff bytes: {total_diffs} ===')
          report.close()
          PYEOF

      - name: BRK and abort analysis
        run: |
          set -euo pipefail
          source venv/bin/activate
          python3 - <<'PYEOF'
          patterns = [
              (bytes.fromhex('20A720D4'), 'brk #0x539'),
              (bytes.fromhex('200020D4'), 'brk #1'),
              (bytes.fromhex('1F2003D5'), 'nop'),
              (bytes.fromhex('C0035FD6'), 'ret'),
              (bytes.fromhex('00000000'), 'nulls'),
          ]

          with open('brk-analysis.txt', 'w') as r:
              for path in ['W.dev.dylib', 'stock/17.2.11.thin.dylib']:
                  with open(path, 'rb') as f:
                      data = f.read()
                  r.write(f'=== {path} (size={len(data)}) ===\n')
                  print(f'=== {path} ===')
                  for pat, name in patterns:
                      cnt = data.count(pat)
                      line = f'  {name}: {cnt}'
                      r.write(line + '\n')
                      print(line)
                  r.write('\n')
          PYEOF
          cat brk-analysis.txt

      - name: Version strings from dev
        run: |
          set -euo pipefail
          {
            echo "=== version-like strings in dev ==="
            strings W.dev.dylib | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -u | head -40 || true
            echo ""
            echo "=== frida/gadget/gum strings in dev ==="
            strings W.dev.dylib | grep -iE 'frida|gadget|gum|gadget' | head -40 || true
            echo ""
            echo "=== version-like strings in stock ==="
            strings stock/17.2.11.thin.dylib | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -u | head -40 || true
          } > version-strings.txt
          cat version-strings.txt

      - name: Summary
        run: |
          set -euo pipefail
          {
            echo "### dev vs stock 17.2.11 comparison"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| dev size | $(stat -f%z W.dev.dylib) B |"
            echo "| stock size | $(stat -f%z stock/17.2.11.thin.dylib) B |"
            echo ""
            echo '```'
            cat brk-analysis.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison
          path: |
            diff-report.txt
            brk-analysis.txt
            version-strings.txt
          retention-days: 30
          if-no-files-found: warn