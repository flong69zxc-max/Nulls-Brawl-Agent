name: Compare Dev W.dylib with Frida 17.2.11

on:
  push:
    branches: [main]
    paths:
      - 'W.dylib.zip'
      - '.github/workflows/compare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Unpack dev dylib
        run: |
          set -euo pipefail
          rm -rf dev_unpacked
          mkdir -p dev_unpacked
          unzip -o W.dylib.zip -d dev_unpacked
          find dev_unpacked -type f | sort

          DEV=$(find dev_unpacked -type f -name "*.dylib" ! -path "*__MACOSX*" ! -name "._*" | head -1)
          [ -n "$DEV" ] || { echo "::error::no file found"; exit 1; }
          cp "$DEV" W.dev.raw.dylib
          xattr -c W.dev.raw.dylib 2>/dev/null || true

          FILE_INFO=$(file -b W.dev.raw.dylib)
          echo "file info: $FILE_INFO"

          if echo "$FILE_INFO" | grep -q "universal"; then
            lipo -thin arm64 -output W.dev.dylib W.dev.raw.dylib
          else
            cp W.dev.raw.dylib W.dev.dylib
          fi
          file W.dev.dylib
          echo "dev size: $(stat -f%z W.dev.dylib) bytes"

      - name: Download Frida 17.2.11
        run: |
          set -euo pipefail
          mkdir -p stock
          URL="https://github.com/frida/frida/releases/download/17.2.11/frida-gadget-17.2.11-ios-universal.dylib.xz"
          curl -fL --retry 3 -o stock/17.2.11.xz "$URL"
          (cd stock && xz -d 17.2.11.xz)
          mv stock/17.2.11 stock/17.2.11.dylib

          if lipo -info stock/17.2.11.dylib 2>/dev/null | grep -q "Non-fat"; then
            cp stock/17.2.11.dylib stock/17.2.11.thin.dylib
          else
            lipo -thin arm64e -output stock/17.2.11.thin.dylib stock/17.2.11.dylib
          fi
          file stock/17.2.11.thin.dylib
          echo "stock size: $(stat -f%z stock/17.2.11.thin.dylib) bytes"

      - name: Write comparison script
        run: |
          set -euo pipefail
          mkdir -p scripts

          printf '%s\n' \
            'import subprocess, re, sys, os' \
            '' \
            'MAX_DIFFS_PER_SECTION = 1000' \
            'MAX_OFFSETS_PRINTED = 20' \
            'MAX_REPORT_BYTES = 100 * 1024' \
            '' \
            'def get_sections(path):' \
            '    out = subprocess.run(["otool", "-l", path], capture_output=True, text=True).stdout' \
            '    sections = []' \
            '    cur = {}' \
            '    for line in out.splitlines():' \
            '        s = line.strip()' \
            '        if s.startswith("sectname "):' \
            '            cur["sectname"] = s.split()[1]' \
            '        elif s.startswith("segname "):' \
            '            cur["segname"] = s.split()[1]' \
            '        elif s.startswith("addr "):' \
            '            cur["addr"] = int(s.split()[1], 16)' \
            '        elif s.startswith("size "):' \
            '            cur["size"] = int(s.split()[1], 16)' \
            '        elif s.startswith("offset "):' \
            '            cur["offset"] = int(s.split()[1])' \
            '            if all(k in cur for k in ("sectname", "segname", "addr", "size", "offset")):' \
            '                sections.append(dict(cur))' \
            '            cur = {}' \
            '    return sections' \
            '' \
            'def read_bytes(path, offset, size):' \
            '    with open(path, "rb") as f:' \
            '        f.seek(offset)' \
            '        return f.read(size)' \
            '' \
            'dev_path = "W.dev.dylib"' \
            'stock_path = "stock/17.2.11.thin.dylib"' \
            '' \
            'secs_dev = get_sections(dev_path)' \
            'secs_stock = get_sections(stock_path)' \
            '' \
            'def key(s):' \
            '    return (s["segname"], s["sectname"])' \
            '' \
            'dev_map = {key(s): s for s in secs_dev}' \
            'stock_map = {key(s): s for s in secs_stock}'' \
            '' \
            'common = sorted(set(dev_map) & set(stock_map))' \
            'only_dev = sorted(set(dev_map) - set(stock_map))' \
            'only_stock = sorted(set(stock_map) - set(dev_map))' \
            '' \
            'out = open("diff-report.txt", "w")' \
            'def w(line):' \
            '    out.write(line + "\n")' \
            '' \
            'w("=== dev vs stock 17.2.11 ===")' \
            'w(f"dev sections:   {len(secs_dev)}")' \
            'w(f"stock sections: {len(secs_stock)}")' \
            'w(f"common:         {len(common)}")' \
            'w("")' \
            '' \
            'if only_dev:' \
            '    w("=== only in DEV ===")' \
            '    for x in only_dev: w(f"  {x}")' \
            'if only_stock:' \
            '    w("=== only in STOCK ===")' \
            '    for x in only_stock: w(f"  {x}")' \
            'w("")' \
            '' \
            'total_diffs = 0' \
            'diffs_by_section = []' \
            '' \
            'for k in common:' \
            '    sd = dev_map[k]' \
            '    ss = stock_map[k]' \
            '    if sd["size"] != ss["size"]:' \
            '        w(f"[{k[0]},{k[1]}] SIZE dev=0x{sd[\"size\"]:x} stock=0x{ss[\"size\"]:x}")' \
            '        continue' \
            '    if sd["size"] == 0:' \
            '        continue' \
            '    dd = read_bytes(dev_path, sd["offset"], sd["size"])' \
            '    ds = read_bytes(stock_path, ss["offset"], ss["size"])' \
            '    if dd == ds:' \
            '        continue' \
            '    diffs = [i for i in range(len(dd)) if dd[i] != ds[i]]' \
            '    cnt = len(diffs)' \
            '    total_diffs += cnt' \
            '    diffs_by_section.append((k, cnt, diffs, dd, ds))' \
            '' \
            'diffs_by_section.sort(key=lambda x: -x[1])' \
            '' \
            'w(f"=== sections with diffs: {len(diffs_by_section)} ===")' \
            'w(f"=== total diff bytes: {total_diffs} ===")' \
            'w("")' \
            '' \
            'for k, cnt, diffs, dd, ds in diffs_by_section:' \
            '    if cnt > MAX_DIFFS_PER_SECTION:' \
            '        w(f"[{k[0]},{k[1]}] size=0x{len(dd):x} diff={cnt} (too many, skipping offsets)")' \
            '        continue' \
            '    w(f"[{k[0]},{k[1]}] size=0x{len(dd):x} diff={cnt}")' \
            '    for i in diffs[:MAX_OFFSETS_PRINTED]:' \
            '        w(f"  off 0x{i:x}: stock={ds[i]:02x} dev={dd[i]:02x}")' \
            '    if len(diffs) > MAX_OFFSETS_PRINTED:' \
            '        w(f"  ... and {len(diffs) - MAX_OFFSETS_PRINTED} more")' \
            '' \
            'out.close()' \
            '' \
            'size = os.path.getsize("diff-report.txt")' \
            'if size > MAX_REPORT_BYTES:' \
            '    with open("diff-report.txt", "rb") as f:' \
            '        data = f.read(MAX_REPORT_BYTES)' \
            '    with open("diff-report.txt", "wb") as f:' \
            '        f.write(data)' \
            '        f.write(b"\n\n=== TRUNCATED (report too large) ===\n")' \
            '    print(f"::warning::diff report truncated to {MAX_REPORT_BYTES} bytes (was {size})")' \
            'else:' \
            '    print(f"diff report size: {size} bytes")' \
            > scripts/diff.py

          echo "script written"

      - name: Run comparison
        run: |
          set -euo pipefail
          python3 scripts/diff.py

      - name: Show report head
        run: |
          set -euo pipefail
          echo "=== report size ==="
          stat -f%z diff-report.txt
          echo "=== first 200 lines ==="
          head -200 diff-report.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison
          path: |
            diff-report.txt
            scripts/diff.py
          retention-days: 30
          if-no-files-found: warn