name: Compare Dev W.dylib with Frida 17.2.11

on:
  push:
    branches: [main]
    paths:
      - 'W.dylib.zip'
      - '.github/workflows/compare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Unpack dev dylib
        run: |
          set -euo pipefail
          rm -rf dev_unpacked
          mkdir -p dev_unpacked
          unzip -o W.dylib.zip -d dev_unpacked
          find dev_unpacked -type f | sort

          DEV=$(find dev_unpacked -type f -name "*.dylib" ! -path "*__MACOSX*" ! -name "._*" | head -1)
          [ -n "$DEV" ] || { echo "::error::no file found"; exit 1; }
          cp "$DEV" W.dev.raw.dylib
          xattr -c W.dev.raw.dylib 2>/dev/null || true

          FILE_INFO=$(file -b W.dev.raw.dylib)
          echo "file info: $FILE_INFO"

          if echo "$FILE_INFO" | grep -q "universal"; then
            lipo -thin arm64 -output W.dev.dylib W.dev.raw.dylib
          else
            cp W.dev.raw.dylib W.dev.dylib
          fi
          file W.dev.dylib
          echo "dev size: $(stat -f%z W.dev.dylib) bytes"

      - name: Download Frida 17.2.11
        run: |
          set -euo pipefail
          mkdir -p stock
          URL="https://github.com/frida/frida/releases/download/17.2.11/frida-gadget-17.2.11-ios-universal.dylib.xz"
          curl -fL --retry 3 -o stock/17.2.11.xz "$URL"
          (cd stock && xz -d 17.2.11.xz)
          mv stock/17.2.11 stock/17.2.11.dylib

          if lipo -info stock/17.2.11.dylib 2>/dev/null | grep -q "Non-fat"; then
            cp stock/17.2.11.dylib stock/17.2.11.thin.dylib
          else
            lipo -thin arm64e -output stock/17.2.11.thin.dylib stock/17.2.11.dylib
          fi
          file stock/17.2.11.thin.dylib
          echo "stock size: $(stat -f%z stock/17.2.11.thin.dylib) bytes"

      - name: Write comparison script
        run: |
          set -euo pipefail
          mkdir -p scripts
          cat > scripts/diff.py << 'PYEOF'
          import subprocess, os, sys

          MAX_OFFSETS = 20
          MAX_REPORT = 100 * 1024

          def sections(path):
              out = subprocess.run(["otool", "-l", path],
                                   capture_output=True, text=True).stdout
              result = []
              cur = {}
              for line in out.splitlines():
                  s = line.strip()
                  if s.startswith("sectname "):
                      cur["sect"] = s.split()[1]
                  elif s.startswith("segname "):
                      cur["seg"] = s.split()[1]
                  elif s.startswith("addr "):
                      cur["addr"] = int(s.split()[1], 16)
                  elif s.startswith("size "):
                      cur["size"] = int(s.split()[1], 16)
                  elif s.startswith("offset "):
                      cur["off"] = int(s.split()[1])
                      if all(k in cur for k in ("sect", "seg", "addr", "size", "off")):
                          result.append(dict(cur))
                      cur = {}
              return result

          def read(path, off, size):
              with open(path, "rb") as f:
                  f.seek(off)
                  return f.read(size)

          dev_path = "W.dev.dylib"
          stock_path = "stock/17.2.11.thin.dylib"

          dev_secs = sections(dev_path)
          stock_secs = sections(stock_path)

          def key(s):
              return (s["seg"], s["sect"])

          dev_map = {key(s): s for s in dev_secs}
          stock_map = {key(s): s for s in stock_secs}

          common = sorted(set(dev_map) & set(stock_map))
          only_dev = sorted(set(dev_map) - set(stock_map))
          only_stock = sorted(set(stock_map) - set(dev_map))

          out = open("diff-report.txt", "w")
          def w(line):
              out.write(line + "\n")

          w("=== dev vs stock 17.2.11 ===")
          w("dev sections:   " + str(len(dev_secs)))
          w("stock sections: " + str(len(stock_secs)))
          w("common:         " + str(len(common)))
          w("")

          if only_dev:
              w("=== only in DEV ===")
              for x in only_dev:
                  w("  " + str(x))
          if only_stock:
              w("=== only in STOCK ===")
              for x in only_stock:
                  w("  " + str(x))
          w("")

          total = 0
          results = []
          for k in common:
              sd = dev_map[k]
              ss = stock_map[k]
              if sd["size"] != ss["size"]:
                  w("[" + str(k) + "] SIZE dev=0x" + format(sd["size"], "x") +
                    " stock=0x" + format(ss["size"], "x"))
                  continue
              if sd["size"] == 0:
                  continue
              dd = read(dev_path, sd["off"], sd["size"])
              ds = read(stock_path, ss["off"], ss["size"])
              if dd == ds:
                  continue
              diffs = [i for i in range(len(dd)) if dd[i] != ds[i]]
              cnt = len(diffs)
              total += cnt
              results.append((k, cnt, diffs, dd, ds))

          results.sort(key=lambda x: -x[1])

          w("=== sections with diffs: " + str(len(results)) + " ===")
          w("=== total diff bytes: " + str(total) + " ===")
          w("")

          w("=== top sections by diff count ===")
          for k, cnt, diffs, dd, ds in results:
              w("[" + str(k) + "] size=0x" + format(len(dd), "x") + " diff=" + str(cnt))
          w("")

          if results:
              k, cnt, diffs, dd, ds = results[0]
              w("=== first section details: " + str(k) + " ===")
              for i in diffs[:MAX_OFFSETS]:
                  w("  off 0x" + format(i, "x") + ": stock=" +
                    format(ds[i], "02x") + " dev=" + format(dd[i], "02x"))
              if len(diffs) > MAX_OFFSETS:
                  w("  ... and " + str(len(diffs) - MAX_OFFSETS) + " more")

          out.close()

          size = os.path.getsize("diff-report.txt")
          if size > MAX_REPORT:
              with open("diff-report.txt", "rb") as f:
                  data = f.read(MAX_REPORT)
              with open("diff-report.txt", "wb") as f:
                  f.write(data)
                  f.write(b"\n\n=== TRUNCATED ===\n")
              print("::warning::diff report truncated to " + str(MAX_REPORT) + " bytes")
          else:
              print("diff report size: " + str(size) + " bytes")
          PYEOF
          echo "script written"

      - name: Run comparison
        run: |
          set -euo pipefail
          python3 scripts/diff.py

      - name: Show report
        run: |
          set -euo pipefail
          echo "=== report size ==="
          stat -f%z diff-report.txt
          echo "=== contents ==="
          cat diff-report.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison
          path: |
            diff-report.txt
            scripts/diff.py
          retention-days: 30
          if-no-files-found: warn