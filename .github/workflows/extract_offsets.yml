name: Extract Offsets

on:
  push:
    branches: [main]
    paths:
      - scripts/find_offsets_r2.py
      - scripts/rename_from_json.py
      - offsets.js
      - .github/workflows/extract_offsets.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHE_EPOCH: r2-v4
  R2_VER: "5.9.8"

jobs:
  prepare:
    runs-on: macos-14
    timeout-minutes: 30
    outputs:
      ver: ${{ steps.resolve.outputs.VER }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install helper tools
        run: |
          set -e
          command -v file >/dev/null 2>&1 || brew install file
          command -v unzip >/dev/null 2>&1 || brew install unzip

      - name: Resolve ipa URL
        id: resolve
        run: |
          set -euo pipefail
          LOC=$(curl -sIL -A "Mozilla/5.0" "https://dnull.xyz/latest_bs_i" \
            | grep -i "^location:" | tail -1 | awk '{print $2}' | tr -d '\r\n')
          test -n "$LOC"
          echo "VER=$(basename "$LOC" | sed -E 's/nb_([0-9.]+)_.*/\1/')" >> "$GITHUB_OUTPUT"
          echo "URL=$LOC" >> "$GITHUB_OUTPUT"
          echo "resolved: $LOC"

      - uses: actions/cache@v4
        id: cache-ipa
        with:
          path: ipa_cache
          key: ipa-nulls-brawl-${{ steps.resolve.outputs.VER }}
          restore-keys: |
            ipa-nulls-brawl-

      - name: Download ipa
        if: steps.cache-ipa.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ipa_cache
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
            --max-time 900 -A "Mozilla/5.0" \
            -o ipa_cache/bs.ipa "${{ steps.resolve.outputs.URL }}"
          test -s ipa_cache/bs.ipa
          file ipa_cache/bs.ipa

      - name: Extract binary
        run: |
          set -euo pipefail
          rm -rf extract
          mkdir -p extract
          unzip -oq ipa_cache/bs.ipa -d extract
          APP_DIR=$(find extract/Payload -maxdepth 1 -type d -name "*.app" | head -n1)
          test -n "$APP_DIR"
          echo "APP_DIR=$APP_DIR"

          PLIST="$APP_DIR/Info.plist"
          test -f "$PLIST" || { echo "Info.plist missing"; ls -la "$APP_DIR"; exit 1; }

          EXEC_NAME=$(python3 -c "import plistlib,sys; print(plistlib.load(open(sys.argv[1],'rb')).get('CFBundleExecutable',''))" "$PLIST")
          echo "CFBundleExecutable=$EXEC_NAME"

          BIN="$APP_DIR/$EXEC_NAME"
          if [ ! -f "$BIN" ]; then
            echo "not found at $BIN, scanning .app root"
            BIN=""
            for f in "$APP_DIR"/*; do
              [ -f "$f" ] || continue
              if file "$f" | grep -qE "Mach-O.*executable"; then
                BIN="$f"
                break
              fi
            done
          fi
          test -n "$BIN" || { echo "no Mach-O executable found"; ls -la "$APP_DIR"; exit 1; }
          test -f "$BIN"

          FILE_OUT=$(file "$BIN")
          echo "$FILE_OUT"
          if ! echo "$FILE_OUT" | grep -qE "Mach-O.*executable"; then
            echo "wrong file type: $FILE_OUT"
            exit 1
          fi

          cp "$BIN" "/tmp/Nulls Brawl"
          file "/tmp/Nulls Brawl"

      - uses: actions/upload-artifact@v4
        with:
          name: nulls-brawl-bin
          path: "/tmp/Nulls Brawl"
          retention-days: 30

  analyze:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install helper tools
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git curl pkg-config unzip

      - uses: actions/cache@v4
        id: cache-r2
        with:
          path: r2_build
          key: r2-build-${{ env.R2_VER }}-arm64-${{ env.CACHE_EPOCH }}

      - name: Build radare2
        run: |
          set -euo pipefail
          if [ -x "$GITHUB_WORKSPACE/r2_build/bin/r2" ]; then
            echo "radare2 already present in r2_build, skipping build"
            export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/r2_build/lib:$GITHUB_WORKSPACE/r2_build/lib64:${LD_LIBRARY_PATH:-}"
            "$GITHUB_WORKSPACE/r2_build/bin/r2" -v
            exit 0
          fi
          echo "no r2_build/bin/r2 -- building from source"
          rm -rf /tmp/r2src /tmp/r2-install "$GITHUB_WORKSPACE/r2_build"
          git clone --depth 1 --branch ${{ env.R2_VER }} \
            https://github.com/radareorg/radare2.git /tmp/r2src
          cd /tmp/r2src
          ./configure --prefix=/tmp/r2-install --with-rpath
          make -j$(nproc)
          make install
          mkdir -p "$GITHUB_WORKSPACE/r2_build"
          cp -aL /tmp/r2-install/. "$GITHUB_WORKSPACE/r2_build/"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/r2_build/lib:$GITHUB_WORKSPACE/r2_build/lib64:${LD_LIBRARY_PATH:-}"
          "$GITHUB_WORKSPACE/r2_build/bin/r2" -v

      - name: Setup radare2 PATH
        run: |
          set -euo pipefail
          test -x "$GITHUB_WORKSPACE/r2_build/bin/r2"
          echo "$GITHUB_WORKSPACE/r2_build/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/r2_build/lib:$GITHUB_WORKSPACE/r2_build/lib64" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install r2pipe
        run: |
          python -m pip install --quiet r2pipe

      - uses: actions/cache/restore@v4
        id: cache-session
        with:
          path: r2_session
          key: r2-session-${{ env.CACHE_EPOCH }}-${{ needs.prepare.outputs.ver }}
          restore-keys: |
            r2-session-${{ env.CACHE_EPOCH }}-

      - uses: actions/download-artifact@v4
        if: steps.cache-session.outputs.cache-hit != 'true'
        with:
          name: nulls-brawl-bin
          path: /tmp

      - name: Prepare session
        if: steps.cache-session.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p r2_session
          cp "/tmp/Nulls Brawl" r2_session/brawl_bin
          ls -la r2_session/

      - uses: actions/cache/save@v4
        if: steps.cache-session.outputs.cache-hit != 'true'
        with:
          path: r2_session
          key: r2-session-${{ env.CACHE_EPOCH }}-${{ needs.prepare.outputs.ver }}

      - name: Verify radare2 runs
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/r2_build/lib:$GITHUB_WORKSPACE/r2_build/lib64:${LD_LIBRARY_PATH:-}"
          which r2
          r2 -v
          r2 -N -q -c 'q' "$GITHUB_WORKSPACE/r2_session/brawl_bin"
          echo "r2 on binary: ok"

      - name: Download offsets.json
        run: |
          set -euo pipefail
          curl -fsSL "https://cdn.jsdelivr.net/gh/kujounOfficial/bsre-ghirda-tools@main/offsets.json" \
            -o "$GITHUB_WORKSPACE/offsets.json"
          test -s "$GITHUB_WORKSPACE/offsets.json"
          python3 -c "import json;d=json.load(open('offsets.json'));print('entries:',len(d))"

      - name: Run rename_from_json
        env:
          R2_BIN: ${{ github.workspace }}/r2_session/brawl_bin
          GITHUB_WORKSPACE: ${{ github.workspace }}
          OFFSETS_JSON: ${{ github.workspace }}/offsets.json
          LD_LIBRARY_PATH: ${{ github.workspace }}/r2_build/lib:${{ github.workspace }}/r2_build/lib64
        run: |
          set -euo pipefail
          test -f scripts/rename_from_json.py || { echo "scripts/rename_json_from.py not found"; ls -la scripts/; exit 1; }
          python scripts/rename_from_json.py 2>&1 | tee r2_rename.log | tail -160 || true

      - name: Run find_offsets_r2 (optional)
        if: hashFiles('scripts/find_offsets_r2.py') != ''
        env:
          R2_BIN: ${{ github.workspace }}/r2_session/brawl_bin
          GITHUB_WORKSPACE: ${{ github.workspace }}
          LD_LIBRARY_PATH: ${{ github.workspace }}/r2_build/lib:${{ github.workspace }}/r2_build/lib64
        run: |
          set -euo pipefail
          python scripts/find_offsets_r2.py 2>&1 | tee r2.log | tail -120 || true

      - name: Validate outputs
        run: |
          set +e
          set -uo pipefail
          ok=1
          if [ ! -s renamed_offsets.js ]; then
            echo "renamed_offsets.js missing or empty"
            tail -300 r2_rename.log 2>/dev/null || true
            ok=0
          else
            echo "renamed_offsets.js lines: $(wc -l < renamed_offsets.js)"
          fi
          if [ -s offsets_resolved.js ]; then
            echo "offsets_resolved.js lines: $(wc -l < offsets_resolved.js)"
          else
            echo "offsets_resolved.js not present (optional)"
          fi
          exit $((1 - ok))

      - name: Report
        if: always()
        run: |
          echo "=== r2_rename.log tail ==="
          tail -300 r2_rename.log 2>/dev/null || true
          echo "=== renamed_offsets.js head ==="
          head -40 renamed_offsets.js 2>/dev/null || true
          echo "=== r2.log tail ==="
          tail -100 r2.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brawl-offsets
          path: |
            renamed_offsets.js
            r2_rename.log
            offsets_resolved.js
            r2.log
            offsets.json
          retention-days: 30
          if-no-files-found: warn