name: Extract Offsets

on:
  push:
    branches: [main]
    paths:
      - scripts/find_offsets.py
      - offsets.js
      - .github/workflows/extract_offsets.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      ver: ${{ steps.resolve.outputs.VER }}
      url: ${{ steps.resolve.outputs.URL }}
      program_name: ${{ steps.extract.outputs.PROGRAM_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install helper tools
        run: |
          set -e
          command -v file >/dev/null 2>&1 || sudo apt-get install -y file
          command -v unzip >/dev/null 2>&1 || sudo apt-get install -y unzip

      - name: Resolve ipa URL
        id: resolve
        run: |
          set -euo pipefail
          LOC=$(curl -sIL -A "Mozilla/5.0" "https://dnull.xyz/latest_bs_i" \
            | grep -i "^location:" | tail -1 | awk '{print $2}' | tr -d '\r\n')
          test -n "$LOC"
          echo "URL=$LOC" >> "$GITHUB_OUTPUT"
          VER=$(basename "$LOC" | sed -E 's/nb_([0-9.]+)_.*/\1/')
          echo "VER=$VER" >> "$GITHUB_OUTPUT"
          echo "resolved: $LOC (version $VER)"

      - uses: actions/cache@v4
        id: cache-ipa
        with:
          path: ipa_cache
          key: ipa-nulls-brawl-${{ steps.resolve.outputs.VER }}
          restore-keys: |
            ipa-nulls-brawl-

      - name: Download ipa
        if: steps.cache-ipa.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ipa_cache
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
            --max-time 900 \
            -A "Mozilla/5.0" \
            -o ipa_cache/bs.ipa \
            "${{ steps.resolve.outputs.URL }}"
          test -s ipa_cache/bs.ipa
          file ipa_cache/bs.ipa
          if ! file ipa_cache/bs.ipa | grep -qi "zip"; then
            echo "ERROR: not a zip/ipa"
            exit 1
          fi

      - name: Extract executable
        id: extract
        run: |
          set -euo pipefail
          rm -rf extract
          mkdir -p extract
          unzip -q ipa_cache/bs.ipa -d extract
          APP_DIR=$(find extract/Payload -maxdepth 1 -type d -name "*.app" | head -n1)
          test -n "$APP_DIR"
          BIN="$APP_DIR/Nulls Brawl"
          if [ ! -f "$BIN" ]; then
            BIN=""
            for f in "$APP_DIR"/*; do
              [ -f "$f" ] || continue
              case "$f" in
                *.dylib|*.png|*.jpg|*.jpeg|*.plist|*.car|*.ttf|*.otf|*.json|*.xml|*.txt|*.html) continue ;;
              esac
              if file "$f" | grep -qi "Mach-O"; then
                BIN="$f"
                break
              fi
            done
          fi
          test -n "$BIN"
          test -f "$BIN"
          file "$BIN"
          cp "$BIN" /tmp/brawl_bin
          echo "PROGRAM_NAME=brawl_bin" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: brawl-bin
          path: /tmp/brawl_bin
          retention-days: 1

  cold:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Install helper tools
        run: |
          set -e
          command -v unzip >/dev/null 2>&1 || sudo apt-get install -y unzip

      - uses: actions/cache@v4
        id: cache-ghidra
        with:
          path: ghidra
          key: ghidra-12.1.2-jython-v1
          restore-keys: |
            ghidra-12.1.2-
            ghidra-

      - name: Install Ghidra
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/g.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.2_build/ghidra_12.1.2_PUBLIC_20260605.zip
          unzip -q /tmp/g.zip -d "$GITHUB_WORKSPACE"
          mv "$GITHUB_WORKSPACE/ghidra_12.1.2_PUBLIC" "$GITHUB_WORKSPACE/ghidra"
          JYTHON_ZIP=$(find "$GITHUB_WORKSPACE/ghidra/Extensions/Ghidra" -maxdepth 1 -name "*Jython*.zip" | head -n1)
          test -n "$JYTHON_ZIP"
          mkdir -p "$GITHUB_WORKSPACE/ghidra/Ghidra/Extensions"
          unzip -q "$JYTHON_ZIP" -d "$GITHUB_WORKSPACE/ghidra/Ghidra/Extensions"
          rm -f /tmp/g.zip

      - uses: actions/cache/restore@v4
        id: cache-project
        with:
          path: ghidra_project
          key: ghidra-brawl-project-${{ needs.prepare.outputs.ver }}
          restore-keys: |
            ghidra-brawl-project-

      - uses: actions/download-artifact@v4
        if: steps.cache-project.outputs.cache-hit != 'true'
        with:
          name: brawl-bin
          path: /tmp

      - name: Run COLD
        if: steps.cache-project.outputs.cache-hit != 'true'
        env:
          _JAVA_OPTIONS: "-Xmx14g -Djava.awt.headless=true"
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          JOBS=$(nproc)
          rm -rf ghidra_project cold.log
          mkdir -p ghidra_project
          "$GITHUB_WORKSPACE/ghidra/support/analyzeHeadless" \
            "$GITHUB_WORKSPACE/ghidra_project" BrawlProject \
            -import /tmp/brawl_bin \
            -processor AARCH64:LE:64:AppleSilicon \
            -loader MachoLoader \
            -analysisTimeoutPerFile 3600 \
            -max-cpu "$JOBS" 2>&1 | tee cold.log | tail -60

      - uses: actions/cache/save@v4
        if: steps.cache-project.outputs.cache-hit != 'true'
        with:
          path: ghidra_project
          key: ghidra-brawl-project-${{ needs.prepare.outputs.ver }}

  warm:
    needs: [prepare, cold]
    if: always() && needs.prepare.result == 'success' && (needs.cold.result == 'success' || needs.cold.result == 'skipped')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Install helper tools
        run: |
          set -e
          command -v unzip >/dev/null 2>&1 || sudo apt-get install -y unzip

      - uses: actions/cache@v4
        id: cache-ghidra
        with:
          path: ghidra
          key: ghidra-12.1.2-jython-v1
          restore-keys: |
            ghidra-12.1.2-
            ghidra-

      - name: Install Ghidra
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/g.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.2_build/ghidra_12.1.2_PUBLIC_20260605.zip
          unzip -q /tmp/g.zip -d "$GITHUB_WORKSPACE"
          mv "$GITHUB_WORKSPACE/ghidra_12.1.2_PUBLIC" "$GITHUB_WORKSPACE/ghidra"
          JYTHON_ZIP=$(find "$GITHUB_WORKSPACE/ghidra/Extensions/Ghidra" -maxdepth 1 -name "*Jython*.zip" | head -n1)
          test -n "$JYTHON_ZIP"
          mkdir -p "$GITHUB_WORKSPACE/ghidra/Ghidra/Extensions"
          unzip -q "$JYTHON_ZIP" -d "$GITHUB_WORKSPACE/ghidra/Ghidra/Extensions"
          rm -f /tmp/g.zip

      - uses: actions/cache/restore@v4
        id: cache-project
        with:
          path: ghidra_project
          key: ghidra-brawl-project-${{ needs.prepare.outputs.ver }}
          restore-keys: |
            ghidra-brawl-project-

      - name: Fail if no project cache
        if: steps.cache-project.outputs.cache-hit != 'true'
        run: |
          echo "ERROR: ghidra_project not found"
          exit 1

      - name: Run WARM
        env:
          _JAVA_OPTIONS: "-Xmx14g -Djava.awt.headless=true"
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          JOBS=$(nproc)
          rm -f offsets_resolved.js offsets_report.txt
          git checkout -- offsets.js 2>/dev/null || true
          "$GITHUB_WORKSPACE/ghidra/support/analyzeHeadless" \
            "$GITHUB_WORKSPACE/ghidra_project" BrawlProject \
            -process "${{ needs.prepare.outputs.program_name }}" -noanalysis \
            -postScript find_offsets.py \
            -scriptPath "$GITHUB_WORKSPACE/scripts" \
            -max-cpu "$JOBS" 2>&1 | tee ghidra.log | tail -80

      - name: Validate outputs
        run: |
          set +e
          set -uo pipefail
          if [ ! -s offsets_resolved.js ]; then
            echo "offsets_resolved.js missing or empty"
            tail -120 ghidra.log 2>/dev/null || true
            exit 1
          fi
          echo "offsets_resolved.js lines: $(wc -l < offsets_resolved.js)"

      - name: Report
        if: always()
        run: |
          echo "=== ghidra.log tail ==="
          tail -120 ghidra.log 2>/dev/null || true
          echo "=== offsets_report.txt ==="
          cat offsets_report.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brawl-offsets
          path: |
            offsets_resolved.js
            offsets_report.txt
            signatures.json
            ghidra.log
          retention-days: 30