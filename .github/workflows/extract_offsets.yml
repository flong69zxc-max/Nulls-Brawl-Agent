name: Extract Offsets

on:
  push:
    branches: [main]
    paths:
      - scripts/find_offsets_r2.py
      - offsets.js
      - .github/workflows/extract_offsets.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHE_EPOCH: r2-v2

jobs:
  prepare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      ver: ${{ steps.resolve.outputs.VER }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install helper tools
        run: |
          set -e
          command -v file >/dev/null 2>&1 || sudo apt-get install -y file
          command -v unzip >/dev/null 2>&1 || sudo apt-get install -y unzip

      - name: Resolve ipa URL
        id: resolve
        run: |
          set -euo pipefail
          LOC=$(curl -sIL -A "Mozilla/5.0" "https://dnull.xyz/latest_bs_i" \
            | grep -i "^location:" | tail -1 | awk '{print $2}' | tr -d '\r\n')
          test -n "$LOC"
          VER=$(basename "$LOC" | sed -E 's/nb_([0-9.]+)_.*/\1/')
          echo "VER=$VER" >> "$GITHUB_OUTPUT"
          echo "URL=$LOC" >> "$GITHUB_OUTPUT"
          echo "resolved: $LOC (version $VER)"

      - uses: actions/cache@v4
        id: cache-ipa
        with:
          path: ipa_cache
          key: ipa-nulls-brawl-${{ steps.resolve.outputs.VER }}
          restore-keys: |
            ipa-nulls-brawl-

      - name: Download ipa
        if: steps.cache-ipa.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ipa_cache
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
            --max-time 900 -A "Mozilla/5.0" \
            -o ipa_cache/bs.ipa "${{ steps.resolve.outputs.URL }}"
          test -s ipa_cache/bs.ipa
          file ipa_cache/bs.ipa

      - name: Extract binary
        run: |
          set -euo pipefail
          rm -rf extract
          mkdir -p extract
          unzip -oq ipa_cache/bs.ipa -d extract
          APP_DIR=$(find extract/Payload -maxdepth 1 -type d -name "*.app" | head -n1)
          test -n "$APP_DIR"
          BIN="$APP_DIR/Nulls Brawl"
          if [ ! -f "$BIN" ]; then
            BIN=""
            for f in "$APP_DIR"/*; do
              [ -f "$f" ] || continue
              case "$f" in
                *.dylib|*.png|*.jpg|*.jpeg|*.plist|*.car|*.ttf|*.otf|*.json|*.xml|*.txt|*.html) continue ;;
              esac
              if file "$f" | grep -qi "Mach-O"; then BIN="$f"; break; fi
            done
          fi
          test -n "$BIN"
          test -f "$BIN"
          file "$BIN"
          cp "$BIN" /tmp/brawl_bin

      - uses: actions/upload-artifact@v4
        with:
          name: brawl-bin
          path: /tmp/brawl_bin
          retention-days: 1

  analyze:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install helper tools
        run: |
          set -e
          command -v unzip >/dev/null 2>&1 || sudo apt-get install -y unzip

      - name: Install radare2
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq radare2
          r2 -v

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install r2pipe
        run: |
          python -m pip install --quiet r2pipe

      - uses: actions/cache/restore@v4
        id: cache-r2
        with:
          path: r2_session
          key: r2-session-${{ env.CACHE_EPOCH }}-${{ needs.prepare.outputs.ver }}
          restore-keys: |
            r2-session-${{ env.CACHE_EPOCH }}-

      - uses: actions/download-artifact@v4
        if: steps.cache-r2.outputs.cache-hit != 'true'
        with:
          name: brawl-bin
          path: /tmp

      - name: Prepare session
        if: steps.cache-r2.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p r2_session
          cp /tmp/brawl_bin r2_session/brawl_bin
          ls -la r2_session/

      - uses: actions/cache/save@v4
        if: steps.cache-r2.outputs.cache-hit != 'true'
        with:
          path: r2_session
          key: r2-session-${{ env.CACHE_EPOCH }}-${{ needs.prepare.outputs.ver }}

      - name: Run find_offsets_r2
        env:
          R2_BIN: ${{ github.workspace }}/r2_session/brawl_bin
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          r2 -v
          python scripts/find_offsets_r2.py 2>&1 | tee r2.log | tail -120

      - name: Validate outputs
        run: |
          set +e
          set -uo pipefail
          if [ ! -s offsets_resolved.js ]; then
            echo "offsets_resolved.js missing or empty"
            tail -300 r2.log 2>/dev/null || true
            exit 1
          fi
          echo "offsets_resolved.js lines: $(wc -l < offsets_resolved.js)"

      - name: Report
        if: always()
        run: |
          echo "=== r2.log tail ==="
          tail -300 r2.log 2>/dev/null || true
          echo "=== offsets_report.txt ==="
          cat offsets_report.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brawl-offsets
          path: |
            offsets_resolved.js
            offsets_report.txt
            r2.log
          retention-days: 30