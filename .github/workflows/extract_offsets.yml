name: Extract Offsets

on:
  push:
    branches: [main]
    paths:
      - scripts/find_offsets.py
      - offsets.js
      - .github/workflows/extract_offsets.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHE_EPOCH: v6
  GHIDRA_VER: "11.4.3"
  GHIDRA_URL: "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.4.3_build/ghidra_11.4.3_PUBLIC_20251203.zip"

jobs:
  prepare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      ver: ${{ steps.resolve.outputs.VER }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install helper tools
        run: |
          set -e
          command -v file >/dev/null 2>&1 || sudo apt-get install -y file
          command -v unzip >/dev/null 2>&1 || sudo apt-get install -y unzip

      - name: Resolve ipa URL
        id: resolve
        run: |
          set -euo pipefail
          LOC=$(curl -sIL -A "Mozilla/5.0" "https://dnull.xyz/latest_bs_i" \
            | grep -i "^location:" | tail -1 | awk '{print $2}' | tr -d '\r\n')
          test -n "$LOC"
          VER=$(basename "$LOC" | sed -E 's/nb_([0-9.]+)_.*/\1/')
          echo "VER=$VER" >> "$GITHUB_OUTPUT"
          echo "URL=$LOC" >> "$GITHUB_OUTPUT"
          echo "resolved: $LOC (version $VER)"

      - uses: actions/cache@v4
        id: cache-ipa
        with:
          path: ipa_cache
          key: ipa-nulls-brawl-${{ steps.resolve.outputs.VER }}
          restore-keys: |
            ipa-nulls-brawl-

      - name: Download ipa
        if: steps.cache-ipa.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ipa_cache
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
            --max-time 900 -A "Mozilla/5.0" \
            -o ipa_cache/bs.ipa "${{ steps.resolve.outputs.URL }}"
          test -s ipa_cache/bs.ipa
          file ipa_cache/bs.ipa

      - name: Extract binary
        run: |
          set -euo pipefail
          rm -rf extract
          mkdir -p extract
          unzip -oq ipa_cache/bs.ipa -d extract
          APP_DIR=$(find extract/Payload -maxdepth 1 -type d -name "*.app" | head -n1)
          test -n "$APP_DIR"
          BIN="$APP_DIR/Nulls Brawl"
          if [ ! -f "$BIN" ]; then
            BIN=""
            for f in "$APP_DIR"/*; do
              [ -f "$f" ] || continue
              case "$f" in
                *.dylib|*.png|*.jpg|*.jpeg|*.plist|*.car|*.ttf|*.otf|*.json|*.xml|*.txt|*.html) continue ;;
              esac
              if file "$f" | grep -qi "Mach-O"; then BIN="$f"; break; fi
            done
          fi
          test -n "$BIN"
          test -f "$BIN"
          file "$BIN"
          cp "$BIN" /tmp/brawl_bin

      - uses: actions/upload-artifact@v4
        with:
          name: brawl-bin
          path: /tmp/brawl_bin
          retention-days: 1

  cold:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Install helper tools
        run: |
          set -e
          command -v unzip >/dev/null 2>&1 || sudo apt-get install -y unzip

      - uses: actions/cache@v4
        id: cache-ghidra
        with:
          path: ghidra
          key: ghidra-${{ env.GHIDRA_VER }}-${{ env.CACHE_EPOCH }}
          restore-keys: |
            ghidra-${{ env.GHIDRA_VER }}-

      - name: Install Ghidra
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/g.zip "${{ env.GHIDRA_URL }}"
          unzip -oq /tmp/g.zip -d "$GITHUB_WORKSPACE"
          rm -rf "$GITHUB_WORKSPACE/ghidra"
          mv "$GITHUB_WORKSPACE/ghidra_${GHIDRA_VER}_PUBLIC" "$GITHUB_WORKSPACE/ghidra"
          rm -f /tmp/g.zip

      - uses: actions/cache/restore@v4
        id: cache-gzf
        with:
          path: brawl_bin.gzf
          key: gzf-${{ env.GHIDRA_VER }}-${{ env.CACHE_EPOCH }}-${{ needs.prepare.outputs.ver }}
          restore-keys: |
            gzf-${{ env.GHIDRA_VER }}-${{ env.CACHE_EPOCH }}-

      - uses: actions/download-artifact@v4
        if: steps.cache-gzf.outputs.cache-hit != 'true'
        with:
          name: brawl-bin
          path: /tmp

      - name: Run COLD
        if: steps.cache-gzf.outputs.cache-hit != 'true'
        env:
          _JAVA_OPTIONS: "-Xmx14g -Djava.awt.headless=true"
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          JOBS=$(nproc)
          rm -rf /tmp/ghidra_cold "$GITHUB_WORKSPACE/brawl_bin.gzf"
          mkdir -p /tmp/ghidra_cold
          test -s /tmp/brawl_bin
          file /tmp/brawl_bin
          "$GITHUB_WORKSPACE/ghidra/support/analyzeHeadless" \
            /tmp/ghidra_cold ColdProject \
            -import /tmp/brawl_bin \
            -processor AARCH64:LE:64:AppleSilicon \
            -loader MachoLoader \
            -analysisTimeoutPerFile 3600 \
            -max-cpu "$JOBS" \
            -export "$GITHUB_WORKSPACE/brawl_bin.gzf" 2>&1 | tee cold.log | tail -80
          echo "=== after cold ==="
          ls -la "$GITHUB_WORKSPACE/brawl_bin.gzf" || true
          test -s "$GITHUB_WORKSPACE/brawl_bin.gzf"

      - uses: actions/cache/save@v4
        if: steps.cache-gzf.outputs.cache-hit != 'true'
        with:
          path: brawl_bin.gzf
          key: gzf-${{ env.GHIDRA_VER }}-${{ env.CACHE_EPOCH }}-${{ needs.prepare.outputs.ver }}

  warm:
    needs: [prepare, cold]
    if: always() && needs.prepare.result == 'success' && (needs.cold.result == 'success' || needs.cold.result == 'skipped')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Install helper tools
        run: |
          set -e
          command -v unzip >/dev/null 2>&1 || sudo apt-get install -y unzip

      - uses: actions/cache@v4
        id: cache-ghidra
        with:
          path: ghidra
          key: ghidra-${{ env.GHIDRA_VER }}-${{ env.CACHE_EPOCH }}
          restore-keys: |
            ghidra-${{ env.GHIDRA_VER }}-

      - name: Install Ghidra
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/g.zip "${{ env.GHIDRA_URL }}"
          unzip -oq /tmp/g.zip -d "$GITHUB_WORKSPACE"
          rm -rf "$GITHUB_WORKSPACE/ghidra"
          mv "$GITHUB_WORKSPACE/ghidra_${GHIDRA_VER}_PUBLIC" "$GITHUB_WORKSPACE/ghidra"
          rm -f /tmp/g.zip

      - uses: actions/cache/restore@v4
        id: cache-gzf
        with:
          path: brawl_bin.gzf
          key: gzf-${{ env.GHIDRA_VER }}-${{ env.CACHE_EPOCH }}-${{ needs.prepare.outputs.ver }}
          restore-keys: |
            gzf-${{ env.GHIDRA_VER }}-${{ env.CACHE_EPOCH }}-

      - name: Fail if no gzf
        if: steps.cache-gzf.outputs.cache-hit != 'true'
        run: |
          echo "ERROR: brawl_bin.gzf not found"
          exit 1

      - name: Run WARM
        env:
          _JAVA_OPTIONS: "-Xmx14g -Djava.awt.headless=true"
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          JOBS=$(nproc)
          rm -f offsets_resolved.js offsets_report.txt ctors_detailed.log ghidra.log
          git checkout -- offsets.js 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/brawl_bin.gzf"
          test -s "$GITHUB_WORKSPACE/brawl_bin.gzf"
          rm -rf /tmp/ghidra_warm
          mkdir -p /tmp/ghidra_warm
          "$GITHUB_WORKSPACE/ghidra/support/analyzeHeadless" \
            /tmp/ghidra_warm WarmProject \
            -import "$GITHUB_WORKSPACE/brawl_bin.gzf" \
            -noanalysis \
            -postScript find_offsets.py \
            -scriptPath "$GITHUB_WORKSPACE/scripts" \
            -max-cpu "$JOBS" 2>&1 | tee ghidra.log | tail -120

      - name: Validate outputs
        run: |
          set +e
          set -uo pipefail
          if [ ! -s offsets_resolved.js ]; then
            echo "offsets_resolved.js missing or empty"
            tail -300 ctors_detailed.log 2>/dev/null || true
            tail -200 ghidra.log 2>/dev/null || true
            exit 1
          fi
          echo "offsets_resolved.js lines: $(wc -l < offsets_resolved.js)"

      - name: Report
        if: always()
        run: |
          echo "=== ctors_detailed.log tail ==="
          tail -300 ctors_detailed.log 2>/dev/null || true
          echo "=== offsets_report.txt ==="
          cat offsets_report.txt 2>/dev/null || true
          echo "=== ghidra.log tail ==="
          tail -120 ghidra.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brawl-offsets
          path: |
            offsets_resolved.js
            offsets_report.txt
            ctors_detailed.log
            ghidra.log
          retention-days: 30